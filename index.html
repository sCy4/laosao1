<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>交換時間</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* 交換時間：宿舍綠為主色、時間暖黃標示金額與待辦；單欄手機版，頂部帳號列＋底部分頁 */
  --bg:#edf2f0; --surface:#ffffff; --ink:#15302a; --muted:#5a6d67; --line:#d5dfdb;
  --accent:#0d7765; --accent-ink:#ffffff; --accent-soft:#d6eee7;
  --sun:#e3a21a; --sun-soft:#fbeecf; --warn:#8a5703;
  --good:#24804a; --good-soft:#dcf0e3; --bad:#b9382a; --bad-soft:#f7e0db; --info:#2a63a8; --info-soft:#dce8f6;
  --line-green:#06c755;
  --font-display:"LXGW WenKai TC","Noto Sans TC","PingFang TC",serif;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1614; --surface:#16211e; --ink:#e2ebe8; --muted:#95a8a2; --line:#2a3834;
    --accent:#3db59d; --accent-ink:#04201a; --accent-soft:#163a33;
    --sun:#f0bd45; --sun-soft:#3a2e12; --warn:#f0c463;
    --good:#5cc27f; --good-soft:#163222; --bad:#ef7d69; --bad-soft:#3b1b16; --info:#82b2ec; --info-soft:#17283c;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1614; --surface:#16211e; --ink:#e2ebe8; --muted:#95a8a2; --line:#2a3834;
  --accent:#3db59d; --accent-ink:#04201a; --accent-soft:#163a33;
  --sun:#f0bd45; --sun-soft:#3a2e12; --warn:#f0c463;
  --good:#5cc27f; --good-soft:#163222; --bad:#ef7d69; --bad-soft:#3b1b16; --info:#82b2ec; --info-soft:#17283c;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
#app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-size:22px;font-weight:700}
h2{font-size:16px;font-weight:700}
h3{font-size:14px;font-weight:700;color:var(--muted);margin-top:8px}
p{margin:0}
.small{font-size:13px}
.ink{color:var(--ink)}
.muted{color:var(--muted)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.center{text-align:center}
.grow{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:8px}
.row.between{justify-content:space-between}
.row.end{justify-content:flex-end}
.row.wrap{flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-s{display:flex;flex-direction:column;gap:8px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0)}

header.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{font-family:var(--font-display);font-size:22px;font-weight:700;color:var(--accent);letter-spacing:.06em;line-height:1.2}
.brand.big{font-size:44px}
.clock{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.acct{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 4px;font:inherit;font-size:14px;color:var(--ink);cursor:pointer;min-height:40px}

main{flex:1;padding:16px 16px 104px;display:flex;flex-direction:column;gap:12px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}

nav.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:grid;background:var(--surface);border-top:1px solid var(--line);z-index:6}
nav.tabs.n4{grid-template-columns:repeat(4,1fr)}
nav.tabs.n2{grid-template-columns:repeat(2,1fr)}
nav.tabs button{position:relative;appearance:none;background:none;border:0;font:inherit;font-size:12px;color:var(--muted);padding:9px 0 12px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;min-height:56px}
nav.tabs button.on{color:var(--accent);font-weight:700}
nav.tabs button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--sun);color:#2b1d00;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}
nav.tabs .badge{position:absolute;top:4px;left:calc(50% + 8px)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card.task{appearance:none;text-align:left;width:100%;font:inherit;color:inherit;cursor:pointer;gap:4px}
.card.task{padding:0;gap:0;overflow:visible;position:relative}
.nbadge{position:absolute;top:-8px;right:-8px;z-index:3;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:#f05a28;color:#fff;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;border:2px solid var(--bg);font-variant-numeric:tabular-nums;pointer-events:none}
.tc-open{position:absolute;inset:0;z-index:1;width:100%;border:0;background:transparent;cursor:pointer;border-radius:14px;padding:0}
.tc-open:focus-visible{outline:3px solid var(--sun);outline-offset:-3px}
.tc-body{display:flex;flex-direction:column;gap:4px;padding:14px}
.tc-row{display:flex;gap:12px;align-items:flex-end}
.tc-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.tc-g{display:flex;align-items:center;min-height:22px}
.tc-note{display:flex;align-items:flex-start;gap:6px;margin-top:4px;font-size:14px;color:var(--muted)}
.tc-note-txt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc-note.open .tc-note-txt{white-space:normal;overflow:visible}
.tc-more{position:relative;z-index:2;flex:none;appearance:none;border:0;background:none;color:var(--accent);font:inherit;font-size:13px;font-weight:700;padding:0 2px;cursor:pointer;min-height:24px}
.tc-side{flex:none;display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;gap:8px;text-align:right}
.tc-bottom{margin-top:auto;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.tc-bar{border-radius:13px 13px 0 0}
.tc-bar.bottom{border-radius:0 0 13px 13px}
.tc-bar.own-bar{background:var(--accent-soft);color:var(--accent)}
.bar-role{margin-left:auto;font-weight:700;opacity:.85}
.tc-date{font-size:17px;font-weight:700;padding-right:36px;display:flex;flex-wrap:wrap;column-gap:12px;row-gap:2px;align-items:baseline}
.tc-date .tc-time{font-size:16px;font-weight:700}
.gtxt{display:inline-flex;align-items:center;font-size:13px;font-weight:700;border-radius:6px;padding:1px 8px}
.gtxt.male{color:#2563c9;background:#e1ebfb}
.gtxt.female{color:#d0384f;background:#fbe3e7}
.me-card .me-name{font-size:18px}
.idblock{display:flex;flex-direction:column;gap:2px;min-width:0}
.id-name{font-size:16px}
.idblock.big .id-name{font-size:20px}
.idline{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:14px;color:var(--muted)}
.idblock.big .idline{font-size:15px}
#m-cls{text-transform:uppercase}
.tc-time{font-size:15px;font-variant-numeric:tabular-nums}
.tc-place{font-size:15px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.favbtn{position:absolute;top:8px;right:8px;z-index:2;appearance:none;border:0;background:transparent;color:var(--muted);width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.favbtn:hover{background:var(--bg)}
.favbtn.on{color:var(--sun)}
.favbtn.on svg path{fill:currentColor}
.favbtn.txt{position:static;width:auto;height:36px;border-radius:999px;padding:0 12px;gap:6px;border:1px solid var(--line);background:var(--surface);font:inherit;font-size:14px;font-weight:700}
.favbtn.txt.on{border-color:var(--sun);background:var(--sun-soft);color:var(--warn)}
.gsym{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%}
.gsym.male{color:#2563c9;background:#e1ebfb}
.gsym.female{color:#d0384f;background:#fbe3e7}
.checks label.gm{color:#2563c9}
.checks label.gf{color:#d0384f}
.checks label svg{display:block}
.when{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.cal{border:1px solid var(--line);border-radius:12px;padding:10px}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.cal-nav{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:36px;height:36px;border-radius:10px;font-size:20px;cursor:pointer}
.cal-nav:disabled{opacity:.35;cursor:not-allowed}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal-wd{font-size:12px;color:var(--muted);padding:2px 0}
.cal-day{appearance:none;border:0;background:transparent;color:var(--ink);font:inherit;font-variant-numeric:tabular-nums;height:40px;border-radius:50%;cursor:pointer;position:relative}
.cal-day:hover:not(:disabled){background:var(--accent-soft)}
.cal-day:disabled{color:var(--line);cursor:not-allowed}
.cal-day.today::after{content:"";position:absolute;bottom:5px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--sun)}
.cal-day.on,.cal-day.on:hover:not(:disabled){background:var(--accent);color:var(--accent-ink);font-weight:700}
.seg-sm button{min-height:34px;font-size:13px}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.slot{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:14px;font-variant-numeric:tabular-nums;border-radius:10px;padding:8px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.2;min-height:40px;justify-content:center}
.slot small{font-size:11px;color:var(--muted)}
.slot.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.slot.on small{color:var(--accent-ink)}
.slot:disabled{opacity:.35;cursor:not-allowed}
.tagwrap{position:relative;display:inline-flex}
.tagbtn{appearance:none;display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:4px 8px;min-height:34px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;max-width:180px}
.tagbtn .tg-lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tagbtn.tg-trust{color:var(--good);border-color:var(--good);background:var(--good-soft)}
.tagbtn.tg-black{color:var(--bad);border-color:var(--bad);background:var(--bad-soft)}
.tagbtn.tg-custom{color:var(--info);border-color:var(--info);background:var(--info-soft)}
.tagbtn:not(.tg-none) svg path{fill:currentColor}
.tagmenu{position:absolute;right:0;top:calc(100% + 6px);z-index:8;min-width:200px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:6px;display:flex;flex-direction:column}
.tagmenu>button{appearance:none;border:0;background:none;color:var(--ink);font:inherit;font-size:14px;text-align:left;padding:10px;border-radius:8px;display:flex;align-items:center;gap:8px;cursor:pointer}
.tagmenu>button:hover{background:var(--bg)}
.tm-dot{width:10px;height:10px;border-radius:50%;flex:none}
.tm-dot.trust{background:var(--good)}.tm-dot.black{background:var(--bad)}.tm-dot.custom{background:var(--info)}
.tm-check{margin-left:auto;color:var(--accent);font-weight:700}
.tm-remove{color:var(--bad)!important;border-top:1px solid var(--line)!important;border-radius:0 0 8px 8px!important}
.tm-custom{display:flex;gap:6px;padding:6px}
.tm-custom input{min-height:36px;padding:6px 10px}
.card.mini{overflow:visible}
.tc-title{font-size:17px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tc-sub{font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.tc-side .price{font-size:21px;line-height:1.2}
.pc-row{font-size:15px}
.pc-row .price{font-size:16px}
.pc-center{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0}
.pc-big{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.pc-div{border:0;border-top:1px solid var(--line);margin:4px 0;opacity:.7}
.pc-label{text-align:center;font-size:13px;color:var(--muted)}
.pc-input{display:flex;align-items:center;justify-content:center;gap:8px;font-size:22px;font-weight:700;color:var(--muted)}
.pc-input input{width:150px;text-align:center;font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;padding:8px 10px;min-height:52px}
.banner.center{text-align:center}
.tpick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tblock{border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px}
.tb-head{display:flex;align-items:baseline;justify-content:space-between;padding:0 4px}
.tb-input{width:84px;min-height:38px;padding:4px 6px;text-align:center;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.tb3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tb3 .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px}
.daychip{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--accent-soft);color:var(--accent);border-radius:12px;padding:6px 6px 6px 12px;font-weight:700;font-size:14px}
.optlist{display:flex;flex-direction:column;gap:6px}
.opt-row{appearance:none;display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:15px;text-align:left;padding:12px 14px;border-radius:12px;cursor:pointer;min-height:48px}
.opt-row.on{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.bcal .cal-grid{gap:3px}
.bc-day{appearance:none;border:1px solid transparent;background:transparent;color:var(--ink);font:inherit;min-height:54px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:2px;padding:5px 0;cursor:pointer;position:relative}
.bc-day .bc-n{font-size:15px;font-variant-numeric:tabular-nums}
.bc-day .bc-cnt{font-size:11px;font-weight:700;color:var(--accent-ink);background:var(--accent);border-radius:6px;padding:0 5px}
.bc-day:not(.has):not(:disabled) .bc-n{color:var(--muted)}
.bc-day:hover:not(:disabled){background:var(--accent-soft)}
.bc-day.today{border-color:var(--sun)}
.bc-day.on,.bc-day.on:hover:not(:disabled){background:var(--accent-soft);border-color:var(--accent)}
.bc-day:disabled{color:var(--line);cursor:not-allowed}
.tcols{display:flex;align-items:center;gap:2px}
.tsep{font-weight:700;color:var(--muted)}
.tcol{position:relative;flex:1;height:176px;overflow-y:auto;scroll-snap-type:y proximity;display:flex;flex-direction:column;gap:2px;padding:2px;border-radius:8px;background:var(--bg);scrollbar-width:none}
.tcol::-webkit-scrollbar{display:none}
.tcell{appearance:none;border:0;background:transparent;color:var(--ink);font:inherit;font-size:16px;font-variant-numeric:tabular-nums;min-height:36px;border-radius:8px;cursor:pointer;scroll-snap-align:center;flex:none}
.tcell:hover:not(:disabled){background:var(--accent-soft)}
.tcell.on,.tcell.on:hover:not(:disabled){background:var(--accent);color:var(--accent-ink);font-weight:700}
.tcell:disabled{color:var(--line);cursor:not-allowed}
.tc-tags{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:4px}
.tc-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 14px;font-size:13px;font-weight:700;border:0;border-radius:0}
.tc-bar.s-off{border:0;border-top:1px solid var(--line)}
.segs{display:flex;gap:3px;flex:none}
.segs i{display:block;width:14px;height:5px;border-radius:3px;background:currentColor;opacity:.22}
.segs i.on{opacity:1}
.card.mini{padding:12px 14px;gap:4px}
.mini-role{font-size:12px;font-weight:700;color:var(--accent)}
.mini-name{font-size:16px}
.people{display:flex;flex-direction:column;gap:8px}
.range{display:flex;align-items:center;gap:8px}
.range input{flex:1;min-width:0}
.range span{color:var(--muted);font-size:14px}
.card.task:hover{border-color:var(--accent)}
.date-tile{flex:none;width:58px;padding:6px 0;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:flex;flex-direction:column;align-items:center;line-height:1.2}
.date-tile .dm{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.date-tile .wd{font-size:12px}
.card.task .grow{display:flex;flex-direction:column;gap:2px}
.card.task .time{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.card.task .place{font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chev{flex:none;font-size:22px;color:var(--muted)}
.side{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:5px;text-align:right}
.side .price{font-size:15px}
.idline .dot{color:var(--line);font-weight:700}
.dt-btn{appearance:none;display:flex;align-items:center;gap:10px;width:100%;min-height:48px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;border-radius:10px;padding:8px 12px;cursor:pointer;text-align:left}
.dt-btn svg{color:var(--accent);flex:none}
.dt-btn:hover{border-color:var(--accent)}
.scrim.center{align-items:center;padding:16px}
.sheet.dlg{max-width:360px;border-radius:24px;padding:20px 18px 14px;gap:10px}
.dlg-title{font-size:13px;color:var(--muted)}
.dlg-big{font-size:28px;font-weight:500;font-variant-numeric:tabular-nums}
.dlg-month{font-size:14px}
.icon-btn{appearance:none;border:0;background:transparent;color:var(--ink);width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer}
.icon-btn:hover:not(:disabled){background:var(--bg)}
.icon-btn:disabled{opacity:.3;cursor:not-allowed}
.dd-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.dd-wd{font-size:13px;color:var(--muted);padding:6px 0}
.dd{appearance:none;border:1px solid transparent;background:transparent;color:var(--ink);font:inherit;font-size:15px;font-variant-numeric:tabular-nums;width:40px;height:40px;margin:0 auto;border-radius:50%;cursor:pointer}
.dd:hover:not(:disabled){background:var(--bg)}
.dd.today{border-color:var(--accent);color:var(--accent)}
.dd.on,.dd.on:hover:not(:disabled){background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.dd:disabled{color:var(--line);cursor:not-allowed}
.dlg-input{font-size:20px;text-align:center;font-variant-numeric:tabular-nums}
.dlg-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:4px}
.tbig{display:flex;align-items:center;gap:8px}
.tbox{appearance:none;border:0;width:88px;height:72px;border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;font-size:44px;font-variant-numeric:tabular-nums;cursor:pointer}
.tbox.on{background:var(--accent-soft);color:var(--accent)}
.tcolon{font-size:40px;font-weight:700}
.tbig-in{display:flex;flex-direction:column;align-items:center;gap:2px}
.tbig-in input{width:88px;height:72px;font-size:40px;text-align:center;font-variant-numeric:tabular-nums;border-radius:12px}
.ampm{display:flex;flex-direction:column;margin-left:auto;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.ampm button{appearance:none;border:0;background:transparent;color:var(--muted);font:inherit;font-size:14px;font-weight:700;padding:8px 12px;cursor:pointer;min-height:36px}
.ampm button+button{border-top:1px solid var(--line)}
.ampm button.on{background:var(--sun-soft);color:var(--warn)}

  if(t.status==='done'&&r==='poster')return '確認打掃結果';
  if(t.status==='confirmed'&&r==='poster')return '請付款給接案人';
  if(t.status==='confirmed'&&r==='worker')return '等發案人付款';
  if(t.status==='paid'&&r==='poster')return null;

function matchBrowse(t,ignoreDay){
  const f=ui.f;
  if(!ignoreDay&&ui.day&&toDate(new Date(t.start))!==ui.day)return false;
  if(f.from&&t.start<new Date(f.from+'T00:00').getTime())return false;
  if(f.to&&t.start>=new Date(f.to+'T00:00').getTime()+D)return false;
  if(f.pmin!==''||f.pmax!==''){
    if(!t.budget)return false;
    if(f.pmin!==''&&t.budget<Number(f.pmin))return false;
    if(f.pmax!==''&&t.budget>Number(f.pmax))return false;
  }
  if(f.genders.indexOf(t.gender)<0)return false;
  if(f.tmin!==''||f.tmax!==''){const d=new Date(t.start),e=new Date(t.end),sm=d.getHours()*60+d.getMinutes(),em=e.getHours()*60+e.getMinutes();

  const q=ui.q.trim().toLowerCase();
  if(q&&(t.building+' '+t.meet+' '+t.note).toLowerCase().indexOf(q)<0)return false;
  return true;

function browseList(){

      return a.start-b.start;
    }
    if(s==='created')return sg*(a.createdAt-b.createdAt)||a.start-b.start;
    return sg*(a.start-b.start);

function bcalSheet(){
  const ym=ui.bcalMonth.split('-').map(Number),y=ym[0],mo=ym[1];
  const lead=(new Date(y,mo-1,1).getDay()+6)%7,days=new Date(y,mo,0).getDate(),today=toDate(new Date(now()));
  const cnt={};S.tasks.forEach(t=>{if(t.status==='open'&&matchBrowse(t,true)){const k=toDate(new Date(t.start));cnt[k]=(cnt[k]||0)+1;}});
  let cells='';
  for(let i=0;i<lead;i++)cells+='<span></span>';
  for(let d=1;d<=days;d++){
    const ds=toDate(new Date(y,mo-1,d)),c=cnt[ds]||0,past=ds<today,sel=ds===ui.day;
    cells+='<button type="button" class="bc-day'+(sel?' on':'')+(ds===today?' today':'')+(c?' has':'')+'" data-act="pickDay" data-v="'+ds+'"'+(past?' disabled':'')+' aria-pressed="'+sel+'" aria-label="'+mo+' 月 '+d+' 日，'+(c?c+' 個案子':'沒有案子')+'"><span class="bc-n">'+d+'</span>'+(c?'<span class="bc-cnt">'+c+' 件</span>':'')+'</button>';
  }
  return '<h2>用日曆找案子</h2><p class="small muted">數字是那天可以接的案子，點一天只看那天的案子。</p>'+
  '<div class="cal bcal"><div class="cal-head"><button type="button" class="cal-nav" data-act="bcalMonth" data-v="-1"'+(ui.bcalMonth>today.slice(0,7)?'':' disabled')+' aria-label="上個月">‹</button><b>'+y+' 年 '+mo+' 月</b><button type="button" class="cal-nav" data-act="bcalMonth" data-v="1" aria-label="下個月">›</button></div>'+
  '<div class="cal-grid">'+'一二三四五六日'.split('').map(w=>'<span class="cal-wd">'+w+'</span>').join('')+cells+'</div></div>'+
  '<div class="two">'+(ui.day?'<button class="btn ghost" data-act="clearDay">看全部日期</button>':'<span></span>')+'<button class="btn ghost" data-act="close">關閉</button></div>';
}
function sortSheet(){
  return '<h2>排序</h2><div class="optlist" role="radiogroup" aria-label="排序方式">'+SORTS.map(([k,dir,l])=>{const on=ui.sort===k&&ui.dir===dir;
    return '<button class="opt-row'+(on?' on':'')+'" role="radio" aria-checked="'+on+'" data-act="pickSort" data-k="'+k+'" data-v="'+dir+'"><span>'+l+'</span>'+(on?'<span class="tm-check">✓</span>':'')+'</button>';}).join('')+'</div>';

function mineSegs(id){
  return [
    ['w-bid','出價中',t=>(t.status==='open'||t.status==='pending')&&t.poster!==id&&t.offers.some(o=>o.user===id),'出價後、發案人還沒挑人前，會出現在這裡。'],
    ['w-active','進行中',t=>t.assignee===id&&t.status==='assigned','發案人選你之後，案子會出現在這裡。'],
    ['w-pay','等待收款',t=>t.assignee===id&&['done','confirmed','paid'].includes(t.status),'打掃完成、等發案人付款的案子會出現在這裡。'],
    ['p-open','媒合中',t=>t.poster===id&&(t.status==='open'||t.status==='pending'),'按下方「發案」，填好日期、時間和地點就能開始。'],
    ['p-active','進行中',t=>t.poster===id&&t.status==='assigned','選好接案人之後，案子會出現在這裡。'],
    ['p-deliver','交付中',t=>t.poster===id&&['done','confirmed','paid'].includes(t.status),'接案人完成打掃後，等你確認和付款的案子會出現在這裡。']
  ];
}
function manageView(kind){
  const id=S.me,all=mineSegs(id),segs=kind==='work'?all.slice(0,3):all.slice(3),key=kind==='work'?'workSeg':'ownSeg';
  const cnt=sg=>S.tasks.filter(sg[2]).filter(t=>todo(t,id)).length;
  if(!ui[key]){const hit=segs.find(sg=>cnt(sg));ui[key]=hit?hit[0]:segs[0][0];}
  const cur=segs.find(sg=>sg[0]===ui[key])||segs[0];
  const list=S.tasks.filter(cur[2]).sort((a,b)=>a.start-b.start);
  return '<div class="sec-head"><h1>'+(kind==='work'?'接案管理':'發案管理')+'</h1></div>'+
  '<div class="seg" role="tablist">'+segs.map(sg=>'<button role="tab" aria-selected="'+(ui[key]===sg[0])+'" class="'+(ui[key]===sg[0]?'on':'')+'" data-act="seg" data-k="'+key+'" data-v="'+sg[0]+'">'+sg[1]+(cnt(sg)?'<span class="badge">'+cnt(sg)+'</span>':'')+'</button>').join('')+'</div>'+
  (list.length?list.map(t=>taskCard(t,{bar:true})).join(''):empty('這裡目前沒有案子',cur[3]));
}

function pfdef(){const d=new Date(now()+D);return {date:toDate(d),month:toDate(d).slice(0,7),start:'10:00',end:'11:00',building:'',meet:'',gender:'不限',budget:'',note:''};}
function toMin(s){const p=s.split(':');return Number(p[0])*60+Number(p[1]);}
function fromMin(n){return pad(Math.floor(n/60))+':'+pad(n%60);}
function durLabel(n){const h=Math.floor(n/60),m=n%60;return (h?h+' 小時':'')+(h&&m?' ':'')+(m?m+' 分鐘':'');}
function slotOk(date,time){return new Date(date+'T'+time).getTime()>now()+H;}
function firstSlot(date){for(let n=0;n<=23*60;n+=5){const s=fromMin(n);if(slotOk(date,s))return s;}return null;}
const MAXEND=23*60+59;
function timeCol(which,part,sel,isDis){
  const vals=part==='h'?Array.from({length:24},(_,i)=>i):Array.from({length:60},(_,i)=>i);
  return '<div class="tcol" role="listbox" aria-label="'+(which==='start'?'開始':'結束')+(part==='h'?'小時':'分鐘')+'">'+vals.map(n=>{
    const dis=isDis(n),on=n===sel;
    return '<button type="button" role="option" aria-selected="'+on+'" class="tcell'+(on?' on':'')+'" data-act="pickTime" data-w="'+which+'" data-p="'+part+'" data-v="'+n+'"'+(dis?' disabled':'')+'>'+pad(n)+'</button>';
  }).join('')+'</div>';
}
function calendar(){
  const pf=ui.pf,ym=pf.month.split('-').map(Number),y=ym[0],mo=ym[1];
  const lead=new Date(y,mo-1,1).getDay(),days=new Date(y,mo,0).getDate();
  const today=toDate(new Date(now())),maxDate=toDate(new Date(now()+60*D));
  let cells='';
  for(let i=0;i<lead;i++)cells+='<span></span>';
  for(let d=1;d<=days;d++){
    const ds=toDate(new Date(y,mo-1,d)),dis=ds<today||ds>maxDate||!firstSlot(ds),sel=ds===pf.date,isT=ds===today;
    cells+='<button type="button" class="cal-day'+(sel?' on':'')+(isT?' today':'')+'" data-act="pickDate" data-v="'+ds+'"'+(dis?' disabled':'')+' aria-pressed="'+sel+'" aria-label="'+mo+' 月 '+d+' 日'+(isT?'，今天':'')+'">'+d+'</button>';
  }
  return '<div class="cal"><div class="cal-head"><button type="button" class="cal-nav" data-act="calMonth" data-v="-1"'+(pf.month>today.slice(0,7)?'':' disabled')+' aria-label="上個月">‹</button>'+
    '<b>'+y+' 年 '+mo+' 月</b><button type="button" class="cal-nav" data-act="calMonth" data-v="1"'+(pf.month<maxDate.slice(0,7)?'':' disabled')+' aria-label="下個月">›</button></div>'+
    '<div class="cal-grid">'+'日一二三四五六'.split('').map(w=>'<span class="cal-wd">'+w+'</span>').join('')+cells+'</div></div>';
}
function timePicker(){
  const pf=ui.pf,s=toMin(pf.start),e=toMin(pf.end),sh=Math.floor(s/60),sm=s%60,eh=Math.floor(e/60),em=e%60;
  const okS=n=>slotOk(pf.date,fromMin(n));
  const startH=h=>{for(let m=0;m<60;m++)if(okS(h*60+m)&&h*60+m<MAXEND)return false;return true;};
  const startM=m=>!okS(sh*60+m)||sh*60+m>=MAXEND;
  const endH=h=>h*60+59<=s;
  const endM=m=>eh*60+m<=s;
  const blk=(w,label,val,h,mm,hd,md)=>'<div class="tblock"><div class="tb-head"><label class="small muted" for="tin-'+w+'">'+label+'</label><input id="tin-'+w+'" class="tb-input" data-w="'+w+'" inputmode="numeric" maxlength="5" value="'+val+'" aria-describedby="tp-help"></div>'+
    '<div class="tcols">'+timeCol(w,'h',h,hd)+'<span class="tsep">:</span>'+timeCol(w,'m',mm,md)+'</div></div>';
  return '<div class="tpick">'+blk('start','開始',pf.start,sh,sm,startH,startM)+blk('end','結束',pf.end,eh,em,endH,endM)+'</div>'+
    '<p class="small muted center" id="tp-help">共 '+durLabel(e-s)+'。可以捲動點選，也可以直接在上面的時間輸入，例如 1435。</p>';
}
function parseTime(str){
  const d=String(str).replace(/[^0-9]/g,'');let h,m;
  if(d.length===3){h=+d[0];m=+d.slice(1);}else if(d.length===4){h=+d.slice(0,2);m=+d.slice(2);}else if(d.length<=2&&d.length>0){h=+d;m=0;}else return null;
  return h<24&&m<60?h*60+m:null;
}
function setTime(which,t){
  const pf=ui.pf;
  if(which==='start'){
    if(!slotOk(pf.date,fromMin(t)))return toast('開始時間至少要在 1 小時後');
    if(t>=MAXEND)return toast('開始時間太晚了');
    pf.start=fromMin(t);if(toMin(pf.end)<=t)pf.end=fromMin(Math.min(t+60,MAXEND));
  }else{
    if(t<=toMin(pf.start))return toast('結束時間要晚於開始時間');
    pf.end=fromMin(t);
  }
  return true;
}
function centerTimeCols(){
  document.querySelectorAll('.tcol').forEach(c=>{const on=c.querySelector('.on');if(on)c.scrollTop=on.offsetTop-c.clientHeight/2+on.clientHeight/2;});
}

  if(ui.meSub==='favs')return favView();
  if(ui.meSub==='profile')return profileView();

function stepper(t){
  if(t.status==='cancelled')return '';
  const i=IDX[t.status];
  return '<ol class="steps" aria-label="案件進度">'+STEPS.map((s,k)=>'<li class="'+(k<i?'past':k===i?'cur':'')+'"><span class="dot"></span><span>'+s+'</span></li>').join('')+'</ol>';
}
function notify(to,text,taskId){if(!to)return;S.notes=S.notes||[];S.notes.unshift({id:nid('n'),to:to,text:text,taskId:taskId||null,at:now(),read:false});}
function myNotes(){return (S.notes||[]).filter(n=>n.to===S.me);}
function unreadNotes(){return myNotes().filter(n=>!n.read).length;}
function notesSheet(){
  const list=myNotes(),fresh=ui.noteFresh||[];
  return '<div class="row between"><h2>通知</h2><button class="btn ghost sm" data-act="close">關閉</button></div>'+
    (list.length?'<div class="notes">'+list.map(n=>'<button class="note'+(fresh.indexOf(n.id)>=0?' new':'')+'" data-act="openNote" data-id="'+n.id+'"><span class="note-txt">'+esc(n.text)+'</span><span class="note-time">'+fmtShort(n.at)+'</span></button>').join('')+'</div>'
      :'<p class="small muted">目前沒有通知。</p>');
}
function deadline(t){return Math.min(t.pendingAt+24*H,t.start);}
function sweep(){
  let ch=false;
  S.tasks.forEach(t=>{
    const lb=t.building+'・'+fmtShort(t.start);
    if(t.status==='pending'&&now()>=deadline(t)){
      ch=true;const w=t.assignee;
      if(now()>=t.start){t.status='cancelled';t.cancelReason='開工時間到了，接案人還沒確認接案，案子已自動取消';
        notify(t.poster,'接案人在開工前沒有確認，案子已自動取消（'+lb+'）。',t.id);notify(w,'你沒有在開工前確認接案，案子已自動取消（'+lb+'）。',t.id);}
      else{t.offers=t.offers.filter(o=>o.user!==w);t.status='open';t.assignee=null;t.price=null;t.matchNote='接案人沒有在 24 小時內確認，這次選擇已作廢，可以改選其他出價。';
        notify(t.poster,'接案人沒有在 24 小時內確認，這次選擇已作廢，可以改選其他出價（'+lb+'）。',t.id);notify(w,'你沒有在 24 小時內確認接案，發案人的選擇已作廢（'+lb+'）。',t.id);}
    }
    if((t.status==='confirmed'||t.status==='paid')&&!t.payWarned&&t.confirmedAt&&now()>t.confirmedAt+24*H){
      ch=true;t.payWarned=true;
      notify(t.poster,'付款已超過 24 小時還沒完成（'+lb+'），'+(t.status==='confirmed'?'請盡快付款並按「已付款」。':'正在等接案人確認收款。'),t.id);
      notify(t.assignee,'付款已超過 24 小時還沒完成（'+lb+'），'+(t.status==='confirmed'?'發案人還沒按「已付款」。':'收到款項後請按「已收款」。'),t.id);
    }
    if(t.status==='closed'&&t.photos&&t.photos.length&&t.closedAt&&now()>t.closedAt+7*D){ch=true;t.photos=[];t.photosGone=true;}
  });
  if(ch)save();
}
const TAGS=[['trust','可信賴'],['black','黑名單'],['custom','自訂內容']];

function tagText(g){return g.type==='trust'?'可信賴':g.type==='black'?'黑名單':g.text;}
function tagChip(g){
  if(!g)return '';
  return '<span class="pill '+(g.type==='trust'?'s-good':g.type==='black'?'s-bad':'s-assigned')+'">'+esc(tagText(g))+'</span>';
}
function tagButton(uid){
  const g=tagOf(uid),open=ui.tagMenu===uid;
  return '<span class="tagwrap"><button class="tagbtn tg-'+(g?g.type:'none')+'" data-act="tagMenu" data-uid="'+uid+'" aria-haspopup="menu" aria-expanded="'+open+'" aria-label="標記'+(g?'，目前是「'+esc(tagText(g))+'」':'')+'">'+
    '<span class="tg-lbl">'+(g?esc(tagText(g)):'標記他')+'</span>'+IC.bookmark+'</button>'+
    (open?'<div class="tagmenu" role="menu">'+

      '<button role="menuitemradio" aria-checked="'+(!!g&&g.type==='black')+'" data-act="setTag" data-uid="'+uid+'" data-type="black"><span class="tm-dot black"></span>黑名單'+(g&&g.type==='black'?'<span class="tm-check">✓</span>':'')+'</button>'+
      (ui.tagCustom?'<form data-form="tag" data-uid="'+uid+'" class="tm-custom" novalidate><input name="text" maxlength="30" placeholder="輸入自訂內容" aria-label="自訂標記內容" value="'+esc(g&&g.type==='custom'?g.text:'')+'"><button class="btn sm" type="submit">儲存</button></form>'
        :'<button role="menuitemradio" aria-checked="'+(!!g&&g.type==='custom')+'" data-act="tagCustom" data-uid="'+uid+'"><span class="tm-dot custom"></span>'+(g&&g.type==='custom'?'自訂：'+esc(g.text):'自訂內容…')+'</button>')+

const CMT_OPEN=['assigned','done','confirmed','paid'];

function personCard(title,x,self){

function photoSection(t,editable){

        '<h3>收到的出價（'+t.offers.length+'）</h3>'+
        (t.offers.length?t.offers.slice().sort((a,b)=>a.price-b.price).map((o,i)=>offerRow(t,o,i,true)).join(''):'<p class="small muted">還沒有人出價。案子已經顯示在「接案」頁。</p>');
    }else if(!m){
      body='<div class="pc-center"><span class="small muted">發案人價碼</span><span class="pc-big">'+(t.budget?'NT$ '+money(t.budget):'自由出價')+'</span></div>'+
        '<button class="btn block" data-act="login" data-why="登入後才能出價或接受價碼。">登入後出價</button>';
    }else{
      const mine=t.offers.find(o=>o.user===m.id),took=mine&&t.budget&&mine.price===t.budget;
      body=mine?'<div class="banner info center">你目前的出價 <b class="price">NT$ '+money(mine.price)+'</b><br><span class="small">等待發案人選定，選中後會通知你確認接案。</span></div>':'';
      body+='<div class="pc-center"><span class="small muted">發案人價碼</span><span class="pc-big">'+(t.budget?'NT$ '+money(t.budget):'自由出價')+'</span></div>';
      if(suspended(m))body+='<div class="banner bad">你目前停權中，'+fmtTime(m.suspendedUntil)+' 後才能出價。</div>';
      else if(!genderOk(t,m))body+='<div class="banner warn">這個案子'+gLabel(t.gender)+'，'+(m.gender?'你沒辦法出價。':'你的個人資料沒有填性別，所以沒辦法出價。')+'</div>';
      else{
        if(t.budget)body+='<button class="btn block" data-act="acceptPrice" data-id="'+t.id+'"'+(took?' disabled':'')+'>'+(took?'已接受此價':'接受此價')+'</button>';
        body+='<button class="btn block'+(t.budget?' ghost':'')+'" data-act="openBid" data-id="'+t.id+'">'+(mine?'查看我的出價':'自行出價')+'</button>';
      }
    }
  }else if(t.status==='pending'&&r==='viewer'){
    const mine=m?t.offers.find(o=>o.user===m.id):null;
    body='<div class="pc-center"><span class="small muted">發案人價碼</span><span class="pc-big">'+(t.budget?'NT$ '+money(t.budget):'自由出價')+'</span></div>'+

  }else if(t.price){

  }else{
    body='<div class="pc-center"><span class="small muted">發案人價碼</span><span class="pc-big">'+(t.budget?'NT$ '+money(t.budget):'自由出價')+'</span><span class="small muted">未成交</span></div>';
  }

  const out=[],lock=!canCancel(t),w=t.assignee?u(t.assignee):null;

  if(r==='viewer'){const g=tagOf(t.poster);if(g)out.push('<div class="banner warn row wrap">你標記過這位發案人：'+tagChip(g)+'</div>');}

      '<button class="btn block" data-act="acceptMatch" data-id="'+t.id+'">確認接案</button><button class="btn ghost block" data-act="declineMatch" data-id="'+t.id+'">婉拒</button></section>');

function dialHTML(g){
  const isH=g.mode==='h',val=isH?g.h%12:g.m,ang=isH?val*30:val*6,C=120,R=92,rad=a=>a*Math.PI/180;
  const pos=a=>'left:'+(C+R*Math.sin(rad(a))).toFixed(1)+'px;top:'+(C-R*Math.cos(rad(a))).toFixed(1)+'px';
  let labels='';
  for(let i=0;i<12;i++){const lab=isH?(i===0?12:i):pad(i*5),on=isH?val===i:val===i*5;labels+='<span class="dial-n'+(on?' on':'')+'" style="'+pos(i*30)+'">'+lab+'</span>';}
  return '<div class="dial" aria-hidden="true">'+labels+'<span class="dial-hand" style="transform:rotate('+ang+'deg)"></span>'+
    '<span class="dial-knob" style="'+pos(ang)+'">'+(isH?(val===0?12:val):pad(val))+'</span><span class="dial-c"></span></div>';
}

function parseDateIn(){
  const el=document.getElementById('dlg-date');if(!el)return null;
  const p=el.value.trim().split(/[\/\-.\s]+/).map(Number);if(p.length!==3||p.some(isNaN))return null;
  const dt=new Date(p[0],p[1]-1,p[2]);if(dt.getMonth()!==p[1]-1)return null;
  const ds=toDate(dt),today=toDate(new Date(now())),maxD=toDate(new Date(now()+60*D));
  return ds>=today&&ds<=maxD&&firstSlot(ds)?ds:null;
}
function readTimeIn(){
  const h=Number((document.getElementById('dlg-h')||{}).value),m=Number((document.getElementById('dlg-m')||{}).value);
  if(!(h>=1&&h<=12)||!(m>=0&&m<=59)||!Number.isInteger(h)||!Number.isInteger(m))return null;
  return {h:h%12+(ui.dlg.h>=12?12:0),m:m};
}

  removeBank(){ask('移除收款帳戶？','移除後，發案人確認完成時要和你自行約定付款方式。','移除',()=>{me().bank=null;save();toast('已移除收款帳戶');},true);},
  open(d){ui.view='detail';ui.detailId=d.id;ui.drawer=false;ui.top=true;const t=T(d.id);if(t&&S.me){t.seen=t.seen||{};t.seen[S.me]=now();save();}},
  back(){ui.view='list';ui.top=true;},
  filter(d){ui.filter=d.v;},
  seg(d){ui[d.k]=d.v;},
  acceptPrice(d){const m=me(),t=T(d.id);if(suspended(m))return toast('停權中不能出價');if(!genderOk(t,m))return toast('這個案子有指定性別，你沒辦法出價');const ex=t.offers.find(o=>o.user===m.id);if(ex){ex.price=t.budget;ex.at=now();}else{t.offers.push({id:nid('o'),user:m.id,price:t.budget,msg:'',at:now()});notify(t.poster,'有人接受了你的價碼（'+t.building+'・'+fmtShort(t.start)+'）。',t.id);}save();toast('已接受發案人價碼，等發案人挑選');},
  withdrawOffer(d){const t=T(d.id);t.offers=t.offers.filter(o=>o.user!==S.me);ui.modal=null;save();toast('已撤回出價');},
  choose(d){const t=T(d.id),o=t.offers.find(x=>x.id===d.oid);
    ask('選擇 '+u(o.user).name+'（NT$ '+money(o.price)+'）？','會通知接案人確認接案，確認後才算媒合成功。接案人要在 24 小時內、而且在開工前確認，否則這次選擇作廢。1 小時後他還沒確認的話，你可以改選別人。','選擇並通知',()=>{t.status='pending';t.assignee=o.user;t.price=o.price;t.pendingAt=now();t.matchNote=null;notify(o.user,me().name+' 選擇了你的出價（'+t.building+'・'+fmtShort(t.start)+'），請在 '+fmtTime(deadline(t))+' 前確認接案。',t.id);save();toast('已通知接案人確認接案');});},
  acceptMatch(d){const t=T(d.id);if(t.status!=='pending')return toast('這次媒合已經失效');t.status='assigned';t.assignedAt=now();notify(t.poster,me().name+' 已確認接案，媒合成功（'+t.building+'・'+fmtShort(t.start)+'）。',t.id);save();toast('已確認接案，媒合成功');},
  declineMatch(d){const t=T(d.id);ask('婉拒這次媒合？','你的出價會一起撤回，發案人可以改選其他出價。','婉拒',()=>{t.offers=t.offers.filter(o=>o.user!==S.me);t.status='open';t.assignee=null;t.price=null;t.matchNote='接案人婉拒了這次媒合，可以改選其他出價。';notify(t.poster,me().name+' 婉拒了這次媒合，可以改選其他出價（'+t.building+'・'+fmtShort(t.start)+'）。',t.id);save();ui.view='list';toast('已婉拒');},true);},
  unchoose(d){const t=T(d.id);if(now()<t.pendingAt+H)return toast('選擇後要等 1 小時才能取消選擇');ask('取消這次選擇？','原本的選擇會直接作廢並通知接案人，他的出價仍然保留，你可以重新挑選。','取消選擇',()=>{notify(t.assignee,'發案人取消了對你的選擇，這次媒合已作廢（'+t.building+'・'+fmtShort(t.start)+'）。你的出價仍然保留。',t.id);t.status='open';t.assignee=null;t.price=null;t.matchNote=null;save();toast('已取消選擇，可以改選其他出價');},true);},
  cancelTask(d){const t=T(d.id);if(!canCancel(t))return toast('已經開工，不能取消');
    ask('取消這個案子？',t.assignee?'接案人會收到取消通知。':'所有出價都會結束。','取消案子',()=>{const who=new Set(t.offers.map(o=>o.user));if(t.assignee)who.add(t.assignee);who.forEach(x=>notify(x,'發案人取消了案子（'+t.building+'・'+fmtShort(t.start)+'）。',t.id));t.status='cancelled';t.cancelReason='發案人於 '+fmtTime(now())+' 取消';save();toast('已取消');},true);},
  withdrawAssign(d){const t=T(d.id);if(!canCancel(t))return toast('已經開工，不能退出');
    ask('退出這個案子？','案子會回到媒合中，發案人可以重新挑人。','確定退出',()=>{notify(t.poster,me().name+' 退出了案子，案子回到媒合中（'+t.building+'・'+fmtShort(t.start)+'）。',t.id);t.status='open';t.assignee=null;t.price=null;t.offers=t.offers.filter(o=>o.user!==S.me);t.photos=[];save();ui.view='list';toast('已退出');},true);},
  rmPhoto(d){T(d.id).photos.splice(Number(d.i),1);save();},
  viewPhoto(d){ui.modal={type:'photo',src:T(d.id).photos[Number(d.i)].src};},
  requestPay(d){const t=T(d.id);if(now()<t.start)return toast('開工時間到了之後才能按打掃完成');t.status='done';t.requestedAt=now();notify(t.poster,'接案人已完成打掃，請確認（'+t.building+'・'+fmtShort(t.start)+'）。',t.id);save();toast('已通知發案人確認');},
  confirmDone(d){const t=T(d.id);ask('確認打掃完成？','確認後會顯示接案人的收款方式，請盡快付款 NT$ '+money(t.price)+'。','確認完成',()=>{t.status='confirmed';t.confirmedAt=now();notify(t.assignee,'發案人已確認打掃完成，接下來會付款 NT$ '+money(t.price)+'（'+t.building+'・'+fmtShort(t.start)+'）。',t.id);save();});},
  received(d){const t=T(d.id);ask('確認已收到款項？','確認後案子就結案了。','確認結案',()=>{t.status='closed';t.closedAt=now();notify(t.poster,'接案人已確認收款，案子結案（'+t.building+'・'+fmtShort(t.start)+'）。',t.id);save();toast('已結案');});},
  tagMenu(d){ui.tagMenu=ui.tagMenu===d.uid?null:d.uid;ui.tagCustom=false;},
  tagCustom(){ui.tagCustom=true;},
  setTag(d){S.tags[S.me]=S.tags[S.me]||{};S.tags[S.me][d.uid]={type:d.type,text:'',at:now()};ui.tagMenu=null;save();toast('已標記為「'+(d.type==='trust'?'可信賴':'黑名單')+'」');},
  untag(d){const mine=S.tags[S.me]||{};delete mine[d.uid];ui.tagMenu=null;ui.tagCustom=false;save();toast('已撤銷標記');},
  toggleNote(d){ui.expanded[d.id]=!ui.expanded[d.id];},
  calMonth(d){const p=ui.pf.month.split('-').map(Number),nd=new Date(p[0],p[1]-1+Number(d.v),1);ui.pf.month=nd.getFullYear()+'-'+pad(nd.getMonth()+1);},
  pickDate(d){const pf=ui.pf;pf.date=d.v;if(!pf.start||!slotOk(pf.date,pf.start)){const f=firstSlot(pf.date);pf.start=f;pf.end=f?fromMin(Math.min(toMin(f)+60,MAXEND)):null;}},
  openDate(){const d=ui.pf.date;ui.dlg={kind:'date',sel:d,month:d.slice(0,7),input:false};ui.modal={type:'dpick'};},
  dMonth(d){const p=ui.dlg.month.split('-').map(Number),nd=new Date(p[0],p[1]-1+Number(d.v),1);ui.dlg.month=nd.getFullYear()+'-'+pad(nd.getMonth()+1);},
  dPick(d){ui.dlg.sel=d.v;},
  dInput(){const g=ui.dlg;if(g.input){const v2=parseDateIn();if(v2){g.sel=v2;g.month=v2.slice(0,7);}}g.input=!g.input;},
  dOk(){const g=ui.dlg;let ds=g.sel;if(g.input){ds=parseDateIn();if(!ds)return toast('請輸入今天到 60 天內的日期，例如 2026/11/20');}
    const pf=ui.pf;pf.date=ds;pf.month=ds.slice(0,7);
    if(!slotOk(pf.date,pf.start)){const f=firstSlot(pf.date);if(f){pf.start=f;pf.end=fromMin(Math.min(toMin(f)+60,MAXEND));}}
    ui.modal=null;ui.dlg=null;},
  openTime(d){const t=toMin(ui.pf[d.w]);ui.dlg={kind:'time',which:d.w,h:Math.floor(t/60),m:t%60,mode:'h',input:false};ui.modal={type:'tpick'};},
  tMode(d){ui.dlg.mode=d.v;},
  tAmpm(d){const g=ui.dlg;g.h=g.h%12+(d.v==='pm'?12:0);},
  tInput(){const g=ui.dlg;if(g.input){const r=readTimeIn();if(r)Object.assign(g,r);}g.input=!g.input;},
  tOk(){const g=ui.dlg;if(g.input){const r=readTimeIn();if(!r)return toast('小時請填 1 到 12，分鐘請填 0 到 59');Object.assign(g,r);}
    const res=setTime(g.which,g.h*60+g.m);if(res!==true){renderModal();return false;}ui.modal=null;ui.dlg=null;},
  pickTime(d){
    const pf=ui.pf,cur=toMin(pf[d.w]),n=Number(d.v);
    let t=d.p==='h'?n*60+cur%60:Math.floor(cur/60)*60+n;
    if(d.w==='start'){
      if(!slotOk(pf.date,fromMin(t))||t>=MAXEND){for(let m=0;m<60;m++){const c=Math.floor(t/60)*60+m;if(slotOk(pf.date,fromMin(c))&&c<MAXEND){t=c;break;}}}
      pf.start=fromMin(t);if(toMin(pf.end)<=t)pf.end=fromMin(Math.min(t+60,MAXEND));
    }else{
      const s0=toMin(pf.start);
      if(t<=s0||t>MAXEND){const h0=Math.floor(t/60)*60;t=null;for(let m=0;m<60;m++){if(h0+m>s0&&h0+m<=MAXEND){t=h0+m;break;}}if(t===null)t=Math.min(s0+60,MAXEND);}
      pf.end=fromMin(t);
    }
  },
  endTask(d){const t=T(d.id);ask('結束這個案子？','案子會標記為未完成並移到「已取消」。需要的話，可以順便標記這位接案人。','結束案子',()=>{t.status='cancelled';t.cancelReason='時間已過，接案人沒有完成，發案人結束了案子';save();toast('已結束案子');},true);},
  copy(d){try{navigator.clipboard.writeText(d.v).then(()=>toast('已複製帳號'),()=>toast('無法複製，請手動選取帳號'));}catch(e){toast('無法複製，請手動選取帳號');}return false;}
};

/* ---------- 表單 ---------- */
const F={
  offer(f,d){
    const m=me();if(suspended(m))return toast('停權中不能出價');if(!genderOk(T(d.id),m))return toast('這個案子有指定性別，你沒辦法出價');
    const raw=v(f,'price'),price=Math.round(Number(raw));
    if(!raw||!(price>0))return toast('請輸入出價金額');
    const t=T(d.id),msg='',ex=t.offers.find(o=>o.user===m.id);
    if(ex){ex.price=price;ex.msg=msg;ex.at=now();toast('已更新出價');}
    else{t.offers.push({id:nid('o'),user:m.id,price,msg,at:now()});notify(t.poster,'有人對你的案子出價（'+t.building+'・'+fmtShort(t.start)+'）。',t.id);toast('已送出出價，等發案人挑選');}
    ui.modal=null;save();
  },
  post(f){
    const m=me(),pf=ui.pf;if(suspended(m))return toast('停權中不能發案');
    if(!pf.date||!pf.start||!pf.end)return toast('請選日期、開始和結束時間');
    const start=new Date(pf.date+'T'+pf.start).getTime(),end=new Date(pf.date+'T'+pf.end).getTime();
    if(!(end>start))return toast('結束時間要晚於開始時間');
    if(!(start>now()+H))return toast('開始時間至少要在 1 小時後');
    if(!v(f,'building'))return toast('請填地點');
    if(!v(f,'meet'))return toast('請填集合位置');
    const g=f.querySelector('input[name=gender]:checked');if(!g)return toast('請選擇接案人性別');
    const bs=v(f,'budget');let budget=null;
    if(bs){budget=Math.round(Number(bs));if(!(budget>=50&&budget<=5000))return toast('價碼請在 NT$ 50 到 5,000 之間');}
    const t={id:nid('t'),poster:m.id,building:v(f,'building'),meet:v(f,'meet'),gender:g.value,start,end,budget,note:v(f,'note'),status:'open',offers:[],assignee:null,price:null,photos:[],createdAt:now()};
    S.tasks.unshift(t);ui.pf=pfdef();save();ui.tab='own';ui.ownSeg='p-open';ui.view='detail';ui.detailId=t.id;ui.top=true;toast('已發布，同學可以開始出價');
  },
  pay(f,d){
    const t=T(d.id);
    if(f.elements.last5){const x=v(f,'last5');if(!/^\d{5}$/.test(x))return toast('請輸入 5 位數字');t.payment={last5:x,method:'匯款',at:now()};}
    else{const c=f.querySelector('input[name=method]:checked');if(!c)return toast('請選擇付款方式');t.payment={last5:null,method:c.value,at:now()};}
    t.status='paid';notify(t.assignee,'發案人表示已付款 NT$ '+money(t.price)+'，收到後請按「已收款」（'+t.building+'・'+fmtShort(t.start)+'）。',t.id);save();toast('已通知接案人確認收款');
  },
  profile(f){
    const m=me(),name=v(f,'name'),sid=v(f,'sid').toUpperCase(),g=f.querySelector('input[name=gender]:checked');
    if(!name)return toast('請填姓名');
    if(!/^[A-Z]\d{8}$/.test(sid))return toast('學號格式是一個英文字母加八個數字，例如 S15330124');
    if(!g||!g.value)return toast('請選擇性別');
    if(m.bank&&m.bank.name!==name)return toast('姓名要和收款帳戶的戶名相同，請先到「收款帳戶」修改或移除');
    Object.assign(m,{name,sid,gender:g.value,cls:v(f,'cls').toUpperCase()});
    ui.editing=false;save();toast('資料已更新');
  },
  bank(f){
    const m=me(),code=v(f,'code'),acct=v(f,'acct').replace(/[\s-]/g,''),bname=v(f,'bname');
    if(!code)return toast('請選擇銀行');
    if(!/^\d{10,16}$/.test(acct))return toast('帳號請輸入 10 到 16 位數字');
    if(bname!==m.name)return toast('戶名必須和姓名「'+m.name+'」相同');
    m.bank={code,acct,name:bname};save();toast('收款帳戶已儲存');
  },
  filter(f){
    const from=v(f,'from'),to=v(f,'to'),tmin=v(f,'tmin'),tmax=v(f,'tmax'),pmin=v(f,'pmin'),pmax=v(f,'pmax'),today=toDate(new Date(now()));
    if(tmin!==''&&tmax!==''&&Number(tmax)<=Number(tmin))return toast('時段的結束要晚於開始');
    if(from&&from<today)return toast('開始日期不能早於今天');
    if(to&&to<today)return toast('結束日期不能早於今天');
    if(from&&to&&to<from)return toast('結束日期不能早於開始日期');
    if(pmin!==''&&pmax!==''&&Number(pmax)<Number(pmin))return toast('最高價格不能低於最低價格');
    const genders=Array.from(f.querySelectorAll('input[name=g]:checked')).map(x=>x.value);
    if(!genders.length)return toast('至少勾選一種性別限制');
    ui.f={from,to,tmin,tmax,pmin,pmax,genders};ui.modal=null;
  },
  comment(f,d){
    const t=T(d.id),text=v(f,'text');
    if(!text)return toast('請輸入留言');
    if(CMT_OPEN.indexOf(t.status)<0)return toast('這個案子的留言板已經關閉');
    t.comments=t.comments||[];t.comments.push({id:nid('c'),user:S.me,text,at:now()});
    t.seen=t.seen||{};t.seen[S.me]=now();ui.cdraft[t.id]='';save();
  },
  tag(f,d){
    const text=v(f,'text');if(!text)return toast('請輸入自訂內容');
    S.tags[S.me]=S.tags[S.me]||{};S.tags[S.me][d.uid]={type:'custom',text,at:now()};
    ui.tagMenu=null;ui.tagCustom=false;save();toast('已儲存標記');
  }
};

/* ---------- 照片 ---------- */
function shrink(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{const max=640,s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');
      c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',0.7));};
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('bad image'));};
    img.src=url;
  });
}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(ui.tagMenu&&!e.target.closest('.tagwrap')){ui.tagMenu=null;ui.tagCustom=false;if(!el){render();return;}}
  if(!el)return;
  const fn=A[el.dataset.act];if(!fn)return;
  if(el.dataset.act!=='scrim'&&el.dataset.act!=='dscrim')e.preventDefault();
  if(fn(el.dataset,el,e)!==false)render();
});
document.addEventListener('submit',e=>{
  const f=e.target;if(!f.dataset||!f.dataset.form)return;
  e.preventDefault();
  if(F[f.dataset.form](f,f.dataset)!==false)render();
});
document.addEventListener('input',e=>{
  const el=e.target,pf=el.form&&el.form.dataset.form==='post';
  if(el.id==='m-sid'||el.id==='m-cls'){const p=el.selectionStart,up=el.value.toUpperCase();if(up!==el.value){el.value=up;try{el.setSelectionRange(p,p);}catch(x){}}return;}
  if(el.id==='cmt-in'&&el.form){ui.cdraft[el.form.dataset.id]=el.value;return;}
  if(pf&&['building','meet','budget','note','gender'].indexOf(el.name)>=0){ui.pf[el.name]=el.value;return;}
  if(el.id!=='q')return;
  ui.q=el.value;const box=document.getElementById('blist');if(box){box.innerHTML=browseList();fixNotes();}
});
window.addEventListener('resize',()=>fixNotes());
document.addEventListener('change',async e=>{
  const el=e.target;
  if(el.id==='sort'){ui.sort=el.value;render();return;}
  if(el.form&&el.form.dataset.form==='post'&&el.name==='gender'){ui.pf.gender=el.value;return;}
  if(el.classList.contains('tb-input')){const t=parseTime(el.value);if(t===null){toast('請輸入像 14:35 或 1435 的時間');}else setTime(el.dataset.w,t);render();return;}if(!el.dataset||!el.dataset.upload)return;
  const files=Array.from(el.files||[]);if(!files.length)return;
  const t=T(el.dataset.id);let ok=0,bad=0;
  for(const file of files){try{t.photos.push({src:await shrink(file),at:now()});ok++;}catch(err){bad++;}}
  save();render();toast(bad?'上傳 '+ok+' 張，'+bad+' 張讀不到':'已上傳 '+ok+' 張');
});
document.addEventListener('pointerdown',e=>{if(e.target.closest&&e.target.closest('.dial')){ui.drag=true;e.preventDefault();dialSet(e);}});
document.addEventListener('pointermove',e=>{if(ui.drag)dialSet(e);});
document.addEventListener('pointerup',()=>{if(!ui.drag)return;ui.drag=false;if(ui.dlg&&ui.dlg.mode==='h'){ui.dlg.mode='m';renderModal();}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.target.id==='dlg-date'||e.target.id==='dlg-h'||e.target.id==='dlg-m')){e.preventDefault();A[e.target.id==='dlg-date'?'dOk':'tOk']();render();return;}if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('tb-input')){e.preventDefault();e.target.blur();return;}if(e.key!=='Escape')return;if(ui.tagMenu){ui.tagMenu=null;ui.tagCustom=false;render();}else if(ui.modal){ui.modal=null;ui.pending=null;render();}else if(ui.drawer){ui.drawer=false;render();}});

render();
})();
</script>
