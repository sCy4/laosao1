<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>替身掃者</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700..900;1,700..900&family=Jost:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Zhi+Mang+Xing&text=%E5%94%B0%E5%92%9A%E5%8F%AE%E7%A0%B0%E5%95%AA%E5%92%BB%EF%BC%81%E2%80%94&display=swap" rel="stylesheet">
<style>
:root{
  /* 方案 I：高級時裝 × 漫畫。深靛藍為主色、香檳金點綴、象牙白底；粗黑框線、硬陰影、網點。
     反轉配色（螢光綠、電光洋紅、鈷藍）只用在案件詳情的主視覺、重大狀態改變的閃屏和提示訊息 */
  --bg:#f7f1e3; --surface:#fffcf4; --ink:#0a0a0a; --muted:#4a4560; --line:#cfc5ad;
  --accent:#26217a; --accent-ink:#fffcf4; --accent-soft:#e6e3f8;
  --sun:#d4ad55; --sun-soft:#f8ecc6; --warn:#7a5208;
  --good:#127a3f; --good-soft:#dcf2e2; --bad:#b0102a; --bad-soft:#fde0e4; --info:#1f3fd6; --info-soft:#e0e6ff;
  /* 提醒色只有一種意思：需要你處理，或有未讀（深紅） */
  --alert:#e0102f; --alert-soft:#ffe1e6; --alert-ink:#a00a22;
  --line-green:#06c755;
  /* 方案 I 專用 */
  --gold:#c9a043; --gold-hi:#f1dc9e; --gold-lo:#8f6a1f; --paper:#efe7d3;
  --lime:#c6ff1a; --magenta:#ff1f8f; --cobalt:#1f4bff;
  --font-display:"Playfair Display","Noto Sans TC","PingFang TC",serif;
  --font-body:"Jost","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light; /* 全站一律淺色模式，不跟著手機的深色設定 */
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
#app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-size:22px;font-weight:700}
h2{font-size:16px;font-weight:700}
h3{font-size:14px;font-weight:700;color:var(--muted);margin-top:8px}
p{margin:0}
.small{font-size:14px}
.ink{color:var(--ink)}
.muted{color:var(--muted)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.center{text-align:center}
.grow{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:8px}
.row.between{justify-content:space-between}
.row.end{justify-content:flex-end}
.row.wrap{flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-s{display:flex;flex-direction:column;gap:8px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0)}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;min-height:61px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{font-family:var(--font-display);font-size:22px;font-weight:700;color:var(--accent);letter-spacing:.06em;line-height:1.2}
.brand.big{font-size:44px}
.clock{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
/* 標題欄固定一排，不換行 */
.hd-brand{flex:1;min-width:0;white-space:nowrap}
.hd-brand .brand,.hd-brand .clock{overflow:hidden;text-overflow:ellipsis}
.hd-act{flex:none;display:flex;align-items:center;gap:8px}
.demo-entry{margin-top:auto;padding-top:16px;border-top:1px dashed var(--line);display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.clock .sim{display:inline-block;margin-right:4px;padding:0 5px;border-radius:4px;background:var(--sun-soft);color:var(--warn);font-weight:700}
@media (max-width:360px){header.top{padding:10px 12px;gap:6px}header.top .icon-btn{width:36px;height:36px}.hd-act{gap:4px}.hd-brand .brand{font-size:20px}}
.acct{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 4px;font:inherit;font-size:14px;color:var(--ink);cursor:pointer;min-height:40px}

main{flex:1;padding:16px 16px 104px;display:flex;flex-direction:column;gap:12px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}

nav.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:grid;background:var(--surface);border-top:1px solid var(--line);z-index:6;padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs.n4{grid-template-columns:repeat(4,1fr)}
nav.tabs.n2{grid-template-columns:repeat(2,1fr)}
nav.tabs button{position:relative;appearance:none;background:none;border:0;font:inherit;font-size:12px;color:var(--muted);padding:9px 0 12px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;min-height:56px}
nav.tabs button.on{color:var(--accent);font-weight:700}
nav.tabs button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--alert);color:#fff;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}
nav.tabs .badge{position:absolute;top:4px;left:calc(50% + 8px)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card.task{appearance:none;text-align:left;width:100%;font:inherit;color:inherit;cursor:pointer;gap:4px}
.card.task{padding:0;gap:0;overflow:visible;position:relative}
.nbadge{position:absolute;top:-8px;right:-8px;z-index:3;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--alert);color:#fff;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;border:2px solid var(--bg);font-variant-numeric:tabular-nums;pointer-events:none}
.tc-open{position:absolute;inset:0;z-index:1;width:100%;border:0;background:transparent;cursor:pointer;border-radius:14px;padding:0}
.tc-open:focus-visible{outline:3px solid var(--sun);outline-offset:-3px}
.tc-body{display:flex;flex-direction:column;gap:4px;padding:14px}
.tc-row{display:flex;gap:12px;align-items:flex-end}
.tc-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.tc-g{display:flex;align-items:center;min-height:22px}
.tc-note{display:flex;align-items:flex-start;gap:6px;margin-top:4px;font-size:14px;color:var(--muted)}
.tc-note-txt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc-note.open .tc-note-txt{white-space:normal;overflow:visible}
.tc-more{position:relative;z-index:2;flex:none;appearance:none;border:0;background:none;color:var(--accent);font:inherit;font-size:13px;font-weight:700;padding:0 2px;cursor:pointer;min-height:24px}
.tc-side{flex:none;display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;gap:8px;text-align:right}
.tc-bottom{margin-top:auto;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.tc-bar{border-radius:13px 13px 0 0}
.tc-bar.bottom{border-radius:0 0 13px 13px}
.tc-bar.own-bar{background:var(--accent-soft);color:var(--accent)}
.bar-role{margin-left:auto;font-weight:700;opacity:.85}
.tc-date{font-size:17px;font-weight:700;padding-right:36px;display:flex;flex-wrap:wrap;column-gap:12px;row-gap:2px;align-items:baseline}
.tc-date .tc-time{font-size:16px;font-weight:700}
.gtxt{display:inline-flex;align-items:center;font-size:13px;font-weight:700;border-radius:6px;padding:1px 8px}
.gtxt.male{color:#2563c9;background:#e1ebfb}
.gtxt.female{color:#d0384f;background:#fbe3e7}
.me-card .me-name{font-size:18px}
.idblock{display:flex;flex-direction:column;gap:2px;min-width:0}
.id-name{font-size:16px}
.idblock.big .id-name{font-size:20px}
.idline{display:flex;flex-wrap:wrap;gap:2px 6px;font-size:14px;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.idblock.big .idline{font-size:15px}
#m-cls{text-transform:uppercase}
.tc-time{font-size:15px;font-variant-numeric:tabular-nums}
.tc-place{font-size:15px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.favbtn{position:absolute;top:8px;right:8px;z-index:2;appearance:none;border:0;background:transparent;color:var(--muted);width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.favbtn:hover{background:var(--bg)}
.favbtn.on{color:var(--sun)}
.favbtn.on svg path{fill:currentColor}
.favbtn.txt{position:static;width:auto;height:36px;border-radius:999px;padding:0 12px;gap:6px;border:1px solid var(--line);background:var(--surface);font:inherit;font-size:14px;font-weight:700}
.favbtn.txt.on{border-color:var(--sun);background:var(--sun-soft);color:var(--warn)}
.gsym{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%}
.gsym.male{color:#2563c9;background:#e1ebfb}
.gsym.female{color:#d0384f;background:#fbe3e7}
.checks label.gm{color:#2563c9}
.checks label.gf{color:#d0384f}
.checks label svg{display:block}
.when{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.cal{border:1px solid var(--line);border-radius:12px;padding:10px}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.cal-nav{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:36px;height:36px;border-radius:10px;font-size:20px;cursor:pointer}
.cal-nav:disabled{opacity:.35;cursor:not-allowed}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal-wd{font-size:12px;color:var(--muted);padding:2px 0}
.cal-day{appearance:none;border:0;background:transparent;color:var(--ink);font:inherit;font-variant-numeric:tabular-nums;height:40px;border-radius:50%;cursor:pointer;position:relative}
.cal-day:hover:not(:disabled){background:var(--accent-soft)}
.cal-day:disabled{color:var(--line);cursor:not-allowed}
.cal-day.today::after{content:"";position:absolute;bottom:5px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--sun)}
.cal-day.on,.cal-day.on:hover:not(:disabled){background:var(--accent);color:var(--accent-ink);font-weight:700}
.seg-sm button{min-height:34px;font-size:13px}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.slot{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:14px;font-variant-numeric:tabular-nums;border-radius:10px;padding:8px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.2;min-height:40px;justify-content:center}
.slot small{font-size:11px;color:var(--muted)}
.slot.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.slot.on small{color:var(--accent-ink)}
.slot:disabled{opacity:.35;cursor:not-allowed}
.tagwrap{position:relative;display:inline-flex}
.tagbtn{appearance:none;display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:4px 8px;min-height:34px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;max-width:180px}
.tagbtn .tg-lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tagbtn.tg-trust{color:var(--good);border-color:var(--good);background:var(--good-soft)}
.tagbtn.tg-black{color:var(--bad);border-color:var(--bad);background:var(--bad-soft)}
.tagbtn.tg-custom{color:var(--info);border-color:var(--info);background:var(--info-soft)}
.tagbtn:not(.tg-none) svg path{fill:currentColor}
.tagmenu{position:absolute;right:0;top:calc(100% + 6px);z-index:8;min-width:200px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:6px;display:flex;flex-direction:column}
.tagmenu>button{appearance:none;border:0;background:none;color:var(--ink);font:inherit;font-size:14px;text-align:left;padding:10px;border-radius:8px;display:flex;align-items:center;gap:8px;cursor:pointer}
.tagmenu>button:hover{background:var(--bg)}
.tm-dot{width:10px;height:10px;border-radius:50%;flex:none}
.tm-dot.trust{background:var(--good)}.tm-dot.black{background:var(--bad)}.tm-dot.custom{background:var(--info)}
.tm-check{margin-left:auto;color:var(--accent);font-weight:700}
.tm-remove{color:var(--bad)!important;border-top:1px solid var(--line)!important;border-radius:0 0 8px 8px!important}
.tm-custom{display:flex;gap:6px;padding:6px}
.tm-custom input{min-height:36px;padding:6px 10px}
/* 資訊卡裡的標記：平常一個低調的「標記」，按了才出現說明和選項 */
.tagline{margin-top:8px}
.tagline .tagwrap{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;font-size:14px}
.taglink{appearance:none;border:0;background:none;padding:6px 0;font:inherit;font-size:14px;font-weight:700;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.tagline .tagmenu{position:static;flex-basis:100%;max-width:340px;margin-top:2px;box-shadow:none}  /* 在原位往下展開，不浮在別的內容上 */
.tm-note{margin:0;padding:6px 10px 8px;line-height:1.5;border-bottom:1px solid var(--line)}
.tagmenu{scroll-margin:80px 0 96px}
.card.mini{overflow:visible}
.tc-title{font-size:17px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tc-sub{font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.tc-side .price{font-size:21px;line-height:1.2}
.pc-row{font-size:15px}
.pc-row .price{font-size:16px}
.pc-center{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0}
.pc-big{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.pc-div{border:0;border-top:1px solid var(--line);margin:4px 0;opacity:.7}
.pc-label{text-align:center;font-size:13px;color:var(--muted)}
.pc-input{display:flex;align-items:center;justify-content:center;gap:8px;font-size:22px;font-weight:700;color:var(--muted)}
.pc-input input{width:150px;text-align:center;font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;padding:8px 10px;min-height:52px}
.banner.center{text-align:center}
.tpick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tblock{border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px}
.tb-head{display:flex;align-items:baseline;justify-content:space-between;padding:0 4px}
.tb-input{width:84px;min-height:38px;padding:4px 6px;text-align:center;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.tb2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tb2 .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px}
.optlist{display:flex;flex-direction:column;gap:6px}
.opt-row{appearance:none;display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:15px;text-align:left;padding:12px 14px;border-radius:12px;cursor:pointer;min-height:48px}
.opt-row.on{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.tcols{display:flex;align-items:center;gap:2px}
.tsep{font-weight:700;color:var(--muted)}
.tcol{position:relative;flex:1;height:176px;overflow-y:auto;scroll-snap-type:y proximity;display:flex;flex-direction:column;gap:2px;padding:2px;border-radius:8px;background:var(--bg);scrollbar-width:none}
.tcol::-webkit-scrollbar{display:none}
.tcell{appearance:none;border:0;background:transparent;color:var(--ink);font:inherit;font-size:16px;font-variant-numeric:tabular-nums;min-height:36px;border-radius:8px;cursor:pointer;scroll-snap-align:center;flex:none}
.tcell:hover:not(:disabled){background:var(--accent-soft)}
.tcell.on,.tcell.on:hover:not(:disabled){background:var(--accent);color:var(--accent-ink);font-weight:700}
.tcell:disabled{color:var(--line);cursor:not-allowed}
.tc-tags{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:4px}
.tc-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 14px;font-size:13px;font-weight:700;border:0;border-radius:0}
.tc-bar.bottom{background:var(--bg);color:var(--muted);border-top:1px solid var(--line)}
.tc-bar.bottom.todo{background:var(--alert-soft);color:var(--alert-ink);border-top-color:transparent}
.tc-dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--alert)}
.tc-bar .grow{min-width:0}
.segs{display:flex;gap:3px;flex:none}
.segs i{display:block;width:14px;height:5px;border-radius:3px;background:currentColor;opacity:.22}
.segs i.on{opacity:1}
.card.mini{padding:12px 14px;gap:4px}
.mini-role{font-size:13px;font-weight:700;color:var(--accent)}
.mini-name{font-size:16px}
.people{display:flex;flex-direction:column;gap:8px}
.range{display:flex;align-items:center;gap:8px}
.range input{flex:1;min-width:0}
.range span{color:var(--muted);font-size:14px}
.card.task:hover{border-color:var(--accent)}
.date-tile{flex:none;width:58px;padding:6px 0;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:flex;flex-direction:column;align-items:center;line-height:1.2}
.date-tile .dm{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.date-tile .wd{font-size:12px}
.card.task .grow{display:flex;flex-direction:column;gap:2px}
.card.task .time{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.card.task .place{font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chev{flex:none;font-size:22px;color:var(--muted)}
.side{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:5px;text-align:right}
.side .price{font-size:15px}
.idline .dot{color:var(--line);font-weight:700;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.dt-btn{appearance:none;display:flex;align-items:center;gap:10px;width:100%;min-height:48px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;border-radius:10px;padding:8px 12px;cursor:pointer;text-align:left}
.dt-btn svg{color:var(--accent);flex:none}
.dt-btn:hover{border-color:var(--accent)}
.scrim.center{align-items:center;padding:16px}
.sheet.dlg{max-width:360px;border-radius:24px;padding:20px 18px 14px;gap:10px}
.dlg-title{font-size:14px;color:var(--muted)}
.dlg-big{font-size:28px;font-weight:500;font-variant-numeric:tabular-nums}
.dlg-month{font-size:14px}
.icon-btn{appearance:none;border:0;background:transparent;color:var(--ink);width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer}
.icon-btn:hover:not(:disabled){background:var(--bg)}
.icon-btn:disabled{opacity:.3;cursor:not-allowed}
.dd-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.dd-wd{font-size:13px;color:var(--muted);padding:6px 0}
.dd{appearance:none;border:1px solid transparent;background:transparent;color:var(--ink);font:inherit;font-size:15px;font-variant-numeric:tabular-nums;width:40px;height:40px;margin:0 auto;border-radius:50%;cursor:pointer}
.dd:hover:not(:disabled){background:var(--bg)}
.dd.today{border-color:var(--accent);color:var(--accent)}
.dd.on,.dd.on:hover:not(:disabled){background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}

<style id="theme-i">
/* =====================================================================
   方案 I：高級時裝 × 漫畫（雜誌式的取捨）
   方案 K 設計測試期間：這一段只在「我的案件」以外的頁面生效（render() 裡的 setTheme 切換）
   - 時裝雜誌當骨架、漫畫當爆點：日常畫面用細線和留白；漫畫手法只在詳情頁頂端、閃屏、第一次進入的封面
   - 線條只有兩種：3px 粗線（刊頭、案件卡片、分節開頭、下方分頁）和 1px 細線（輸入框、資料表）
   - 主要按鈕是黑底象牙字，不用偏移陰影；按下去才位移並換成螢光綠。深靛藍只用在品牌時刻（封面）
   - 詳情頁頂端是黑色封面格：直排「11月」、超大日期數字（階段色）、圓形星期印章、角落的標價框，斜切邊裁掉數字一角
   - Didone 數字只用在日期；金額一律無襯線
   - 輪到你：卡片橫條黑底白字＋紅色 ◆，全站同一種樣子
   - 音效字用筆刷字（Zhi Mang Xing，只載入用得到的幾個字）
   - 字：數字用高反差的 Playfair Display，中文標題用思源黑體 Black，介面用 Jost＋思源黑體；24px 以下的數字用無襯線
   - 整個畫面的反轉配色只在重大動作的閃屏；第一次進入是一張雜誌封面
   ===================================================================== */
body{background:var(--bg);font-family:var(--font-body);font-feature-settings:"lnum" 1}
p,dd,li,.cmt-txt{text-wrap:pretty}
h1,h2{font-family:var(--font-display);font-weight:900;letter-spacing:.02em}
h1{font-size:30px;line-height:1.15}
h2{font-size:20px;line-height:1.3}
h3{font-size:13px;letter-spacing:.04em;color:var(--muted)}
.price{font-family:var(--font-display);font-weight:700;font-variant-numeric:lining-nums tabular-nums;letter-spacing:.01em;white-space:nowrap}
.cur{font-family:var(--font-body);font-size:max(12px,.4em);font-weight:600;letter-spacing:.06em;margin-right:.2em}
p .price,.banner .price,.cmt-txt .price{font-family:var(--font-body);font-size:inherit;font-weight:700;letter-spacing:0}
:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}
.badge,.slot small,.ph-time,.req,.opt{font-size:12px}
.link-btn,.tc-more{color:var(--accent);text-decoration-thickness:1.5px}
header.top svg,main svg,.sheet svg{stroke-width:3;stroke-linecap:square;stroke-linejoin:miter}
.tool svg{display:none}

/* 標題欄：刊頭，粗細雙線 */
body::before{background:var(--surface)}
header.top{min-height:60px;padding:8px 16px;background:var(--surface);border-bottom:3px solid var(--ink);box-shadow:none}
.brand{font-family:var(--font-display);font-weight:900;color:var(--ink);letter-spacing:0;line-height:1.05}
.hd-brand .brand{font-size:26px}
.clock{font-size:13px;font-weight:500;letter-spacing:.04em;line-height:1.35;color:var(--muted)}
.clock .sim{border-radius:0;background:var(--gold);color:var(--ink)}
@media (max-width:360px){.hd-brand .brand{font-size:22px}}
header.top .icon-btn{border-radius:0;color:var(--ink)}
.nbadge{min-width:22px;height:22px;top:-9px;right:-9px;padding:0 5px;border:2px solid var(--bg);border-radius:0;background:var(--alert);color:#fff;font-size:12px}
.nbadge.hdr{top:3px;right:1px;min-width:20px;height:20px;padding:0 4px;border-width:0}
/* 下一層頁面的標題欄：左邊返回鍵、右邊 ⋮（案件詳情） */
header.top.sub{justify-content:flex-start}
header.top.sub>.icon-btn:first-child{margin-left:-8px}
.morewrap{position:relative;flex:none;margin-right:-8px}
.moremenu{position:absolute;right:0;top:calc(100% + 6px);z-index:8;min-width:168px;display:flex;flex-direction:column;background:var(--surface);border:3px solid var(--ink)}
.moremenu>button{appearance:none;display:flex;align-items:center;gap:10px;min-height:48px;padding:10px 14px;border:0;background:none;font:inherit;font-size:15px;font-weight:600;color:var(--ink);text-align:left;cursor:pointer}
.moremenu>button+button{border-top:1px solid var(--ink)}
.moremenu>button.on svg path{fill:currentColor}
@media (hover:hover){.moremenu>button:hover{background:var(--lime)}}

/* 下方分頁：只有文字，選中的分頁整塊反黑 */
nav.tabs{background:var(--surface);border-top:3px solid var(--ink);box-shadow:0 -8px 0 var(--bg)}
nav.tabs button{flex-direction:row;justify-content:center;gap:6px;padding:0 0 env(safe-area-inset-bottom,0px);min-height:54px;font-size:15px;font-weight:700;letter-spacing:.04em;color:var(--muted)}
nav.tabs svg{display:none}
nav.tabs button.on{background:transparent;color:var(--ink);box-shadow:inset 0 5px 0 var(--ink);font-weight:900}
nav.tabs button.on::before{display:none}
.badge{border-radius:0;min-width:20px;height:20px}
nav.tabs .badge{position:absolute;top:0;right:0;left:auto;min-width:18px;height:18px;padding:0 4px;letter-spacing:0}
nav.tabs button{padding-top:6px}


/* 版面：格與格之間是固定的白縫 */
main{gap:16px}
#blist{gap:10px}
#blist>.small:first-child{display:flex;align-items:center;gap:10px;color:var(--ink);font-weight:600;margin-bottom:-2px}
#blist>.small:first-child::after{content:"";flex:1;min-width:16px;height:1px;background:var(--ink)}
#blist:has(>.card.task)::after,.grp:last-of-type:has(>.card.task)::after{content:"";align-self:center;width:9px;height:9px;margin-top:6px;background:var(--ink)}

/* 案件卡片：漫畫的格。左邊日期欄鋪網點、放大數字；右邊時間、地點、標價 */
.card{border:3px solid var(--ink);border-radius:0;background:var(--surface);padding:16px;box-shadow:none}
.card.task{padding:0}
.card.task:hover{border-color:var(--ink)}
.tc-open{border-radius:0}
.tc-body{display:grid;grid-template-columns:72px minmax(0,1fr);padding:0;gap:0}
.tc-date{display:contents}
.tc-d{grid-column:1;grid-row:1/3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:12px 0;border-right:1px solid var(--ink);
  background:#f1e9d6;font-family:var(--font-display);font-weight:900;line-height:1;text-align:center}
.tc-d .dm,.tc-d .dw{font-family:var(--font-body);font-size:12px;font-weight:600}
.tc-d{background:var(--surface)}
/* 我是本體／我是替身：卡片左上角突出的索引標籤（本體黑底、替身白底黑框），和日期分開 */
.card.task.is-poster,.card.task.is-worker{margin-top:20px}
.tc-tab{position:absolute;left:-3px;bottom:calc(100% + 3px);height:22px;padding:0 10px;display:flex;align-items:center;box-sizing:border-box;
  font-size:12px;font-weight:800;letter-spacing:.06em;white-space:nowrap;background:var(--ink);color:var(--surface)}
.card.task.is-worker .tc-tab{background:var(--surface);color:var(--ink);border:3px solid var(--ink);border-bottom:0;padding:0 7px}
.tc-who{font-size:14px;font-weight:600;color:var(--ink)}
.tc-d .dnum{font-size:46px;line-height:.86;padding-bottom:2px}
.tc-d .dday{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.dnum{font-family:var(--font-display);font-style:normal;font-weight:700;letter-spacing:-.02em}
.tc-time{grid-column:2;grid-row:1;padding:14px 50px 0 16px;font-family:var(--font-body);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.tc-row{grid-column:2;grid-row:2;padding:2px 16px 14px;align-items:flex-end}
.tc-place{color:var(--ink);font-size:15px}
.tc-side .price{font-family:var(--font-body);font-size:20px;font-weight:600;line-height:1}
.tc-side .price .muted{font-family:var(--font-body);font-size:15px;font-weight:600;color:var(--ink)}
.tc-bottom{gap:8px}
.tc-bar{padding:9px 16px;font-size:13px}
.tc-bar.bottom{border-radius:0;background:var(--surface);color:var(--muted);font-weight:600;border-top:1px solid var(--ink)}
.tc-bar.bottom.todo{background:var(--ink);color:var(--surface);font-weight:700;border-top-color:var(--ink)}
.tc-dot{width:11px;height:11px;border-radius:0;transform:rotate(45deg);background:var(--alert)}
section[aria-label="待你處理"]>.grp-h .badge{display:none}

/* 待你處理的第一件（最急）放大成主角格 */
.favbtn{border-radius:0;color:var(--ink)}
.favbtn:hover{background:transparent}
.favbtn.on{color:var(--ink)}
.favbtn.on svg path{fill:var(--ink)}
.gtxt,.gtag{border:0;border-radius:0;background:transparent;color:var(--ink);font-size:13px;font-weight:700;padding:0}
.gtxt.male,.gtxt.female{color:var(--ink);background:transparent}
.gtag.any{color:var(--ink);font-weight:400;font-size:inherit}

/* 標籤：細框、不傾斜；唯一的例外是「你已出價」金色印章 */
.pill{border-radius:0;border:1px solid currentColor;padding:0 7px;background:transparent}
.s-open,.s-assigned,.s-wait,.s-good,.s-bad,.s-off{background:transparent}
.s-off{color:var(--muted)}
.pill.s-good,.pill.s-assigned{color:var(--ink)}
.offer .pill{padding:2px 8px;font-size:13px;border:0;background:#ece3cf}
.pill.s-bid{background:transparent;color:var(--ink);border:0;padding:0;font-size:13px;font-weight:700}

/* 按鈕：主要按鈕才有硬陰影；滑過時浮起微斜並出現放射速度線；按下去換成螢光綠；次要按鈕只有底線 */
.btn{border:2px solid var(--ink);border-radius:0;background:var(--ink);color:var(--surface);box-shadow:none;letter-spacing:.04em;transition:transform .1s cubic-bezier(.3,1.7,.5,1),box-shadow .1s}
.btn:not(.sm):not(.ghost):not(.quiet):not(.danger):not(.danger-solid):not(:disabled){border-width:2px}
.cmt-form .btn:not(:disabled){border-width:2px;box-shadow:none}
.btn.sm{background:var(--ink);color:var(--surface);min-height:38px;padding:6px 14px}
.btn.ghost,.btn.danger,.btn.ghost.sm{background:transparent;color:var(--ink);border:0;border-bottom:2px solid var(--ink);padding-left:4px;padding-right:4px}
.btn.danger{color:var(--bad)}
.btn.ghost.block{width:auto;align-self:center;min-width:120px}
.btn.danger-solid{background:var(--bad);color:#fff;border-color:var(--ink)}
.btn.quiet{border:0;box-shadow:none;background:transparent;color:var(--muted);letter-spacing:0}
.btn:disabled{opacity:1;background:transparent;color:#857d6b;border-color:#b5ad98;box-shadow:none}
@media (hover:hover){
  .btn:not(.quiet):not(:disabled):hover{transform:translate(-2px,-2px) skewX(-5deg);box-shadow:4px 4px 0 var(--lime)}
  .btn:not(.sm):not(.ghost):not(.quiet):not(.danger):not(.danger-solid):not(:disabled):hover{background-image:repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,252,244,.26) 0deg 3deg,transparent 3deg 11deg)}
  .btn.ghost:not(:disabled):hover,.btn.danger:not(:disabled):hover{background:var(--ink);color:var(--surface);box-shadow:none}

  .card.task{transition:transform .12s cubic-bezier(.3,1.7,.5,1),box-shadow .12s}
  .card.task:hover{transform:translate(-3px,-3px);box-shadow:4px 4px 0 var(--ink)}
  .card.linkrow:not(.me-card):hover{background:var(--ink);color:var(--surface)}
  .card.linkrow:not(.me-card):hover .muted,.card.linkrow:not(.me-card):hover .cnt{color:var(--surface)}
  .favbtn{transition:transform .12s}
  .favbtn:hover{transform:rotate(-14deg) scale(1.12)}
  .icon-btn:not(:disabled):hover,header.top .icon-btn:hover,.tool:hover{background:var(--lime)}
  .tagbtn:hover,.chip:hover,.opt-row:not(.on):hover,.tagmenu>button:hover,.acct-row:hover,.note:hover{background:var(--lime)}
  .dt-btn:hover{border-bottom-color:var(--cobalt)}
}
.btn:not(.quiet):active:not(:disabled){transform:translate(3px,3px);box-shadow:none;background:var(--lime);color:var(--ink)}
.card.task:active{transform:translate(2px,2px)}

/* 表單：只有底線；欄位名稱是不加字距的小字 */
input,select,textarea{border:1px solid var(--ink);border-radius:0;background:var(--surface);padding:8px 10px;min-height:44px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--cobalt);box-shadow:0 0 0 1px var(--cobalt)}
.field{gap:4px}
.field label,.field .lbl{font-size:13px;color:var(--ink);font-weight:700}
.req,.opt{border-radius:0;background:transparent;border:0;padding:0;margin-left:6px;font-weight:500}
.req{color:var(--bad)}.opt{color:var(--muted)}
.mail-in{border:1px solid var(--ink);border-radius:0;background:var(--surface);padding-right:10px}
.mail-in input{border:0}
.mail-in:focus-within{outline:none;border-color:var(--cobalt);box-shadow:0 0 0 1px var(--cobalt)}
.code-in{font-family:var(--font-display);font-size:34px}
.pc-input input{font-family:var(--font-display);font-size:36px;font-weight:700}
.dt-btn{border:1px solid var(--ink);border-radius:0;background:var(--surface);box-shadow:none;padding:8px 10px;font-weight:600}
.dt-btn svg{color:var(--ink)}
form[data-form="post"] .two+p.small{margin-top:-16px}
form[data-form="post"] .dt-btn{font-family:var(--font-display);font-size:22px;font-weight:900;min-height:52px}
form[data-form="post"].stack{gap:16px;counter-reset:sec}
form[data-form="post"].card{border-top:0!important;padding-top:0!important}
form[data-form="post"]>:is(.field:first-child,.field:has(#p-b),.field:has([aria-labelledby="p-g"]),.field:has(#p-budget)){counter-increment:sec;border-top:3px solid var(--ink);padding-top:10px;margin-top:8px}
form[data-form="post"]>.field:first-child{margin-top:0}
form[data-form="post"]>:is(.field:first-child,.field:has(#p-b),.field:has([aria-labelledby="p-g"]),.field:has(#p-budget))>:first-child::before{content:counter(sec,decimal-leading-zero);font-family:var(--font-display);font-weight:900;font-size:22px;margin-right:10px;vertical-align:-2px}
/* 二選一、三選一：一排文字，選中反黑，不放單選圓點 */
.checks{gap:0}
.checks label{position:relative;border:1px solid var(--ink);border-radius:0;margin-left:-1px;padding:8px 16px;font-size:15px;font-weight:600;color:var(--ink);background:transparent}
.checks label:first-child{margin-left:0}
.checks input{position:absolute;opacity:0;width:1px;height:1px;margin:0;pointer-events:none}
.checks label.gm,.checks label.gf{color:var(--ink)}
.checks label:has(input:checked){background:var(--ink);color:var(--surface)}
.checks label:has(input:focus-visible){outline:3px solid var(--cobalt);outline-offset:2px;z-index:1}
.ferr{color:var(--bad)}
/* 工具列：搜尋只有底線，排序、篩選是文字按鈕 */
.toolbar{gap:0;align-items:stretch;border:1px solid var(--ink);background:var(--surface)}
.search{border:0;border-radius:0;background:transparent;color:var(--ink);box-shadow:none;padding:0 4px 0 12px}
.search input{min-height:44px;border:0}
.search:focus-within{outline:3px solid var(--cobalt);outline-offset:0}
.tool{width:auto;height:46px;padding:0 12px;gap:5px;border:0;border-left:1px solid var(--ink);border-radius:0;color:var(--ink);box-shadow:none;background:transparent;font:inherit;font-size:14px;font-weight:700}
.tool svg{width:16px;height:16px}
.tool.active{background:var(--ink);color:var(--surface)}
.tool .badge{position:static;background:var(--lime);color:var(--ink);margin-left:1px}
.btn .badge{background:var(--lime);color:var(--ink)}
.seg{border:3px solid var(--ink);border-radius:0;padding:0;gap:0;box-shadow:none;background:var(--surface)}
.seg button{border-radius:0;color:var(--ink);font-weight:600;min-height:44px}
.seg button+button{border-left:1px solid var(--ink)}
.seg button.on{background:var(--ink);color:var(--surface)}
.seg button.on .muted{color:var(--surface)}
.chip{border:1px solid var(--ink);border-radius:0;font-weight:600}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.optlist{gap:0;border-top:1px solid var(--ink)}
.opt-row{border:0;border-bottom:1px solid var(--ink);border-radius:0;background:transparent}
.opt-row.on{background:var(--ink);color:var(--surface)}
.opt-row.on .tm-check{color:var(--lime)}
.banner{border:1px solid var(--ink);border-radius:0;background:transparent;color:var(--ink)}
.banner.info{background:transparent;color:var(--ink);border-color:var(--ink)}
.banner.warn{background:var(--sun-soft);color:var(--ink);border-color:var(--ink)}
.banner.bad{background:transparent;color:var(--bad);border-color:var(--bad)}

/* 進度條：黑色資訊格最上緣的五段平面線段（不是按鈕）。完成＝象牙白、目前＝階段色、還沒到＝暗灰；標籤靠左對齊內容邊界 */
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:0 3px;margin:-16px -16px 0;padding:12px 16px 0;background:var(--ink);border:0}
.steps li{position:relative;align-items:flex-start;text-align:left;gap:0;padding:7px 0 0;font-size:13px;font-weight:500;color:#9c968a}
.steps li::before,.steps li:first-child::before{display:block;content:"";position:absolute;top:0;left:0;right:0;width:auto;height:4px;background:#3a372f}
.steps .dot,.steps li.past .dot,.steps li.cur .dot{display:none}
.steps li.past{color:#d9d3c4}
.steps li.past::before{background:#d9d3c4}
.steps li.cur{color:var(--surface);font-weight:800}
.steps li.cur::before{background:var(--stg-bg,var(--surface))}
.steps+.card.sum{margin-top:-10px}
main>.card.sum:first-child{margin-top:-16px}

/* 案件詳情頂端：黑色資訊格。由上到下照閱讀順序：月份小標 → 大號日期 → 時間 → 標價 */
.stg-summon{--stg-bg:var(--lime)}
.stg-clean{--stg-bg:#4f74ff}
.stg-check{--stg-bg:var(--magenta)}
.stg-pay{--stg-bg:var(--gold)}
.stg-done{--stg-bg:#fffcf4}
.stg-off{--stg-bg:#bdb5a3}
.card.sum{padding:0;gap:0;border:0;background:transparent;overflow:visible;margin:0 -16px}
.card.sum>.pill{align-self:flex-start;margin:16px 16px 10px}
.sum-top{position:relative;display:flex;flex-direction:column;gap:0;padding:12px 16px 14px;background:var(--ink);color:var(--surface)}
.sum-top .grow{align-self:stretch;display:flex;flex-direction:column;gap:6px}
.sum-date{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:8px;font-weight:900;line-height:1;color:var(--surface)}
.sum-date .dm{flex-basis:100%;margin-bottom:4px;font-size:15px;font-weight:700;color:#d9d3c4}
.sum-date .dnum{font-family:var(--font-display);font-weight:900;font-size:62px;line-height:.82;letter-spacing:-.02em;margin-left:-2px}
.sum-date .dday,.sum-date .dw{font-size:18px;font-weight:700}
.sum-date .dday{margin-left:-6px}
.sum-date .dw{margin-left:-14px}
.sum-time{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:10px;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.sum-top .muted,.sum-time .small{color:rgba(255,252,244,.72)}
.sum-time .small{font-size:14px;font-weight:500}
.sum-price,.card.sum.has-fav .sum-price{flex-direction:row;justify-content:space-between;align-items:baseline;gap:12px;align-self:stretch;margin-top:10px;padding:8px 0 0;border-top:1px solid #4a463c}
.sum-price .small{font-size:14px;font-weight:500}
.sum-price .price{font-family:var(--font-body);font-size:30px;font-weight:600;line-height:1}
.sum-price .price .cur{vertical-align:.5em;font-size:12px;margin-right:4px}
.sum-price .price .muted{font-size:20px;font-weight:500;color:rgba(255,252,244,.72)}
@media (max-width:360px){.sum-date .dnum{font-size:54px}.sum-time{font-size:19px}.sum-price .price{font-size:26px}.steps li{font-size:12px}}
.sum-role{position:absolute;top:12px;right:16px;padding:2px 8px;font-size:13px;font-weight:700;line-height:1.4;border:1.5px solid var(--surface)}
.sum-role.is-poster{background:var(--surface);color:var(--ink)}
.sum-role.is-worker{background:transparent;color:var(--surface)}
.sum-who{align-self:stretch;display:flex;flex-wrap:wrap;align-items:baseline;column-gap:8px;row-gap:2px;margin-top:2px;padding-top:8px;border-top:1px solid #4a463c;font-size:14px}
.sum-who-l{color:rgba(255,252,244,.72)}
.sum-who-n{font-size:18px;font-weight:700}
.sum-who .idline{font-size:14px;color:rgba(255,252,244,.72)}

}
body{background:var(--md-surface);color:var(--md-on-surface);font-size:16px;line-height:1.5}
:focus-visible{outline:3px solid var(--md-secondary);outline-offset:2px}
.small{font-size:14px;line-height:20px;letter-spacing:.25px}
.badge{font-size:12px}
/* 圖示：mask 畫在偽元素上，顏色跟著文字 */
nav.tabs button::after,header.top .bell::after,.favbtn::after,.tc-tab::before,.tc-bar.todo::after,.seg button.on::before,main>h1.vh+p.small::before{
  content:"";flex:none;width:24px;height:24px;background:currentColor;-webkit-mask:var(--ic) center/contain no-repeat;mask:var(--ic) center/contain no-repeat}
/* 按下時的水波紋（程式在 pointerdown 時加進按鈕裡） */
.k-ripple{position:absolute;border-radius:50%;background:currentColor;pointer-events:none;transform:scale(0);opacity:.12;animation:kRipple .55s var(--md-ease-decel) forwards}
@keyframes kRipple{65%{transform:scale(1);opacity:.12}100%{transform:scale(1);opacity:0}}

/* 上方應用程式列（small top app bar）：往下捲時換成 surface-container 色 */
body::before{background:var(--md-surface)}
header.top{min-height:64px;padding:8px 4px 8px 16px;gap:4px;background:var(--md-surface);border-bottom:0;box-shadow:none;transition:background-color .2s var(--md-ease)}
header.top.scrolled{background:var(--md-surface-container)}
body:has(header.top.scrolled)::before{background:var(--md-surface-container)}
.brand,.hd-brand .brand{font-family:var(--font-display);font-size:22px;line-height:28px;font-weight:500;letter-spacing:0;color:var(--md-on-surface)}
.clock{font-size:12px;line-height:16px;letter-spacing:.4px;color:var(--md-on-surface-variant)}
.clock .sim{border-radius:4px;background:var(--md-tertiary-container);color:var(--md-on-tertiary-container);font-weight:500}
@media (max-width:360px){header.top{padding:8px 4px 8px 12px}.hd-brand .brand{font-size:20px}header.top .icon-btn{width:40px;height:40px}}
.icon-btn{position:relative;width:40px;height:40px;border-radius:50%;color:var(--md-on-surface-variant);transition:background-color .15s linear}
@media (hover:hover){.icon-btn:hover:not(:disabled){background:var(--st-hover)}}
header.top .bell svg{display:none}
header.top .bell::after{--ic:var(--ic-bell)}
.nbadge.hdr{top:6px;right:auto;left:21px;min-width:16px;height:16px;padding:0 4px;border:0;border-radius:8px;font-size:12px;line-height:16px}

/* 下方導覽列（navigation bar）：圖示在 64×32 的膠囊裡，選中的分頁膠囊有底色、圖示換成實心 */
nav.tabs{background:var(--md-surface-container);border-top:0;box-shadow:none}
nav.tabs button{min-height:80px;padding:12px 0 16px;gap:4px;justify-content:flex-start;font-size:12px;line-height:16px;font-weight:500;letter-spacing:.5px;color:var(--md-on-surface-variant)}
nav.tabs svg{display:none}
nav.tabs button::before,nav.tabs button.on::before{content:"";display:block;position:static;flex:none;width:64px;height:32px;border-radius:16px;background-color:transparent;transition:background-color .2s var(--md-ease)}
nav.tabs button.on::before{background-color:var(--md-secondary-container)}
nav.tabs button::after{position:absolute;top:16px;left:50%;margin-left:-12px}
nav.tabs button.on{color:var(--md-on-surface);font-weight:700}
nav.tabs button.on::after{background:var(--md-on-secondary-container)}
nav.tabs [data-v="browse"]::after{--ic:var(--ic-search)}
nav.tabs [data-v="post"]::after{--ic:var(--ic-add)}
nav.tabs [data-v="post"].on::after{--ic:var(--ic-addF)}
nav.tabs [data-v="mine"]::after{--ic:var(--ic-task)}
nav.tabs [data-v="mine"].on::after{--ic:var(--ic-taskF)}
nav.tabs [data-v="me"]::after{--ic:var(--ic-person)}
nav.tabs [data-v="me"].on::after{--ic:var(--ic-personF)}
@media (hover:hover){nav.tabs button:hover::before{background-image:linear-gradient(var(--st-hover),var(--st-hover))}}
nav.tabs button:active::before{background-image:linear-gradient(var(--st-press),var(--st-press))}  /* 底部分頁沒有水波紋，按下時膠囊變深 */
nav.tabs button.on.k-in::before{animation:kPill .3s var(--md-ease) both}  /* 換到這個分頁時，膠囊從中間展開 */
@keyframes kPill{from{transform:scaleX(.35);opacity:.2}}
nav.tabs .badge{top:12px;left:calc(50% + 4px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;font-size:12px;line-height:16px;font-weight:500;letter-spacing:0}

/* 版面 */
main{padding-top:8px;gap:12px}
.grp{gap:12px}
.grp-h{margin:16px 0 0;font-size:22px;line-height:28px;font-weight:500;letter-spacing:0;color:var(--md-on-surface)}
section[aria-label="待你處理"]>.grp-h{margin-top:8px}
.grp-h .badge{display:none}
.grp-h.sub{margin:8px 0 -4px;font-size:14px;line-height:20px;font-weight:500;letter-spacing:.1px;color:var(--md-primary)}
/* 沒有待辦時的一句話：放在淺色容器裡，前面一個打勾圖示 */
main>h1.vh+p.small.muted{display:flex;align-items:center;gap:12px;margin-top:8px;padding:12px 16px;border-radius:12px;background:var(--md-surface-container-low);color:var(--md-on-surface-variant)}
main>h1.vh+p.small::before{--ic:var(--ic-checkCircle);color:var(--md-primary)}

/* 分段按鈕（segmented button）：選中的那一段有底色和勾勾 */
.seg{height:40px;padding:0;gap:0;background:transparent;border:1px solid var(--md-outline);border-radius:20px;overflow:hidden;box-shadow:none}
.seg button{position:relative;overflow:hidden;min-height:0;height:100%;padding:0 12px;gap:8px;border-radius:0;font-size:14px;line-height:20px;font-weight:500;letter-spacing:.1px;color:var(--md-on-surface)}
.seg button+button{border-left:1px solid var(--md-outline)}
.seg button.on{background:var(--md-secondary-container);color:var(--md-on-secondary-container);font-weight:500}
.seg button.on::before{width:18px;height:18px;--ic:var(--ic-check)}
.seg button .muted{color:inherit;font-weight:400}
@media (hover:hover){.seg button:hover{background-image:linear-gradient(var(--st-hover),var(--st-hover))}}
.seg button.on.k-in::before{animation:kCheck .25s var(--md-ease) both}  /* 切換時勾勾長出來 */
@keyframes kCheck{from{width:0;margin-right:-8px;opacity:0}}

/* 案件卡片（elevated card）：左邊日期方塊，右邊身分標籤 → 時間 → 地點、標價；底部是狀態列 */
.card.task{display:grid;grid-template-columns:56px minmax(0,1fr);column-gap:16px;align-items:start;padding:16px;margin:0;
  background:var(--md-surface-container-low);border:0;border-radius:12px;box-shadow:var(--md-elev-1);transition:box-shadow .2s var(--md-ease)}
.card.task.is-poster,.card.task.is-worker{margin-top:0}
.tc-body,.tc-date{display:contents}
.tc-open{border-radius:12px;overflow:hidden;color:var(--md-on-surface);transition:background-color .15s linear}
@media (hover:hover){.card.task:hover{box-shadow:var(--md-elev-2)}.tc-open:hover{background:var(--st-hover)}}
.tc-open:focus-visible{outline:3px solid var(--md-secondary);outline-offset:2px}
/* 我是本體／我是替身：卡片內容區最上面的小標籤（本體是淺綠底＋房子，替身是外框＋掃具），和日期方塊分開 */
.tc-tab{grid-column:2;grid-row:1;justify-self:start;display:inline-flex;align-items:center;gap:4px;height:24px;margin:0 44px 8px 0;padding:0 8px 0 6px;
  border-radius:8px;font-size:12px;line-height:16px;font-weight:500;letter-spacing:.5px;white-space:nowrap}
.tc-tab::before{width:16px;height:16px}
.card.task.is-poster .tc-tab{background:var(--md-primary-container);color:var(--md-on-primary-container)}
.card.task.is-poster .tc-tab::before{--ic:var(--ic-home)}
.card.task.is-worker .tc-tab{border:1px solid var(--md-outline);padding:0 7px 0 5px;color:var(--md-on-surface-variant)}
.card.task.is-worker .tc-tab::before{--ic:var(--ic-clean)}
/* 日期方塊：月／日／週幾（文字內容仍是「11月19日（四）」） */
.tc-d{grid-column:1;grid-row:1/4;display:flex;flex-direction:column;align-items:center;padding:8px 0;border-radius:12px;background:var(--md-surface-container-highest);color:var(--md-on-surface);text-align:center}
.tc-d .dm,.tc-d .dw{font-size:12px;line-height:16px;font-weight:500;letter-spacing:.5px;color:var(--md-on-surface-variant)}
.tc-d .dnum{font-family:var(--font-body);font-size:24px;line-height:32px;font-weight:400;font-variant-numeric:tabular-nums}
.tc-d .dday,.tc-d .pa{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tc-d .dw::before{content:"週";content:"週"/""}
.tc-time{grid-column:2;grid-row:2;font-size:16px;line-height:24px;font-weight:500;letter-spacing:.15px;font-variant-numeric:tabular-nums;color:var(--md-on-surface)}
.tc-row{grid-column:2;grid-row:3;display:flex;align-items:flex-end;gap:12px;padding:0}
.tc-main{gap:0}
.tc-place{font-size:14px;line-height:20px;letter-spacing:.25px;color:var(--md-on-surface-variant)}
.tc-who{margin-top:2px;font-size:14px;line-height:20px;font-weight:500;letter-spacing:.1px;color:var(--md-on-surface)}
.tc-g{margin-top:8px;min-height:0}
.gtxt,.gtxt.male,.gtxt.female{height:24px;padding:0 8px;border:1px solid currentColor;border-radius:8px;background:transparent;font-size:12px;line-height:22px;font-weight:500;letter-spacing:.5px}
.gtxt.male{color:var(--md-male)}
.gtxt.female{color:var(--md-female)}
.tc-side{gap:4px}
.tc-bottom{gap:4px}
.price{font-family:var(--font-body);font-weight:500;font-variant-numeric:tabular-nums}
.tc-side .price{font-size:20px;line-height:28px;color:var(--md-on-surface)}
.tc-side .price .muted{font-size:14px;line-height:20px;font-weight:500;letter-spacing:.1px;color:var(--md-on-surface-variant)}
.cur{font-size:12px;font-weight:500;letter-spacing:.5px;color:var(--md-on-surface-variant)}
.pill{border-radius:8px;font-size:12px;line-height:16px;font-weight:500;letter-spacing:.5px;padding:4px 8px}
.pill.s-bid{background:var(--md-tertiary-container);color:var(--md-on-tertiary-container)}
.pill.s-bad{background:transparent;color:var(--md-error);border:1px solid currentColor}
/* 收藏（standard icon button）：選中時是實心星星 */
.favbtn{top:8px;right:8px;width:40px;height:40px;border-radius:50%;color:var(--md-on-surface-variant);transition:background-color .15s linear}
.favbtn svg{display:none}
.favbtn::after{--ic:var(--ic-star)}
.favbtn.on{color:var(--md-primary)}
.favbtn.on::after{--ic:var(--ic-starF)}
@media (hover:hover){.favbtn:hover{background:var(--st-hover)}}
/* 新留言數（large badge）：卡片右上角外側 */
.nbadge{top:-6px;right:-6px;min-width:20px;height:20px;padding:0 6px;border:2px solid var(--md-surface);border-radius:10px;background:var(--md-error);color:var(--md-on-error);font-size:12px;line-height:16px;font-weight:500}
/* 狀態列：平常是灰字；輪到你時是淺紅底（error container）＋紅點＋箭頭 */
.tc-bar,.tc-bar.bottom{grid-column:1/-1;grid-row:4;display:flex;align-items:center;gap:12px;min-height:44px;margin:16px -16px -16px;padding:10px 16px;
  border:0;border-top:1px solid var(--md-outline-variant);border-radius:0 0 12px 12px;background:transparent;
  font-size:14px;line-height:20px;font-weight:400;letter-spacing:.25px;color:var(--md-on-surface-variant)}
.tc-bar.bottom.todo{background:var(--md-error-container);border-top-color:transparent;color:var(--md-on-error-container);font-weight:500}
.tc-bar.todo::after{--ic:var(--ic-chev);width:20px;height:20px;margin-right:-4px}
.tc-dot{width:8px;height:8px;border-radius:50%;background:var(--md-error)}

/* 按鈕：filled（主要）、outlined（次要）；全圓角，高 40 */
.btn{position:relative;overflow:hidden;min-height:40px;padding:10px 24px;border:0;border-radius:20px;background:var(--md-primary);color:var(--md-on-primary);
  font-size:14px;line-height:20px;font-weight:500;letter-spacing:.1px;transition:box-shadow .2s var(--md-ease)}
.btn.sm{min-height:40px;padding:10px 16px;font-size:14px}
@media (hover:hover){.btn:hover:not(:disabled){box-shadow:var(--md-elev-1);background-image:linear-gradient(rgba(255,255,255,.08),rgba(255,255,255,.08))}}
.btn:active:not(:disabled){box-shadow:none}
.btn.ghost,.btn.danger{background:transparent;color:var(--md-primary);border:1px solid var(--md-outline);padding:9px 23px}
.btn.ghost.sm,.btn.danger.sm{padding:9px 15px}
.btn.danger{color:var(--md-error)}
@media (hover:hover){.btn.ghost:hover:not(:disabled),.btn.danger:hover:not(:disabled){box-shadow:none;background-image:linear-gradient(var(--st-p-hover),var(--st-p-hover))}}
.btn.danger-solid{background:var(--md-error);color:var(--md-on-error)}
.btn.quiet{background:transparent;border:0;color:var(--md-error);padding:10px 12px;text-decoration:none}
.btn:disabled{opacity:1;background:rgba(23,29,27,.12);color:rgba(23,29,27,.38)}
.btn.ghost:disabled{background:transparent;border-color:rgba(23,29,27,.12)}

/* 空白狀態、示範工具 */
.empty{gap:8px;padding:32px 16px;color:var(--md-on-surface-variant);font-size:14px;line-height:20px}
.empty b{font-size:16px;line-height:24px;font-weight:500;color:var(--md-on-surface)}
.empty .btn{align-self:center;margin-top:8px}
.demo-entry{border-top:1px dashed var(--md-outline-variant)}

/* 從下面滑出的視窗（bottom sheet）：28px 圓角、上方一條拖曳把手 */
.scrim{background:rgba(0,0,0,.32)}
.sheet{gap:12px;padding:0 16px 24px;background:var(--md-surface-container-low);border-radius:28px 28px 0 0;box-shadow:var(--md-elev-1)}
.sheet::before{content:"";flex:none;align-self:center;width:32px;height:4px;margin:16px 0 4px;border-radius:2px;background:var(--md-on-surface-variant);opacity:.4}
.sheet h2{font-size:22px;line-height:28px;font-weight:500}
.sheet h3{margin-top:8px;font-size:14px;line-height:20px;font-weight:500;letter-spacing:.1px;color:var(--md-on-surface-variant)}
.m-layer .sheet.fx-in{animation:kSheet .2s var(--md-ease-decel) backwards}
@keyframes kSheet{from{transform:translateY(100%)}}
.notes,.acct-list{gap:0;margin:0 -16px}
.note,.acct-row{position:relative;overflow:hidden;border:0;border-radius:0;background:transparent;padding:12px 24px;transition:background-color .15s linear}
.note+.note{border-top:1px solid var(--md-outline-variant)}
.note-txt{font-size:16px;line-height:24px;color:var(--md-on-surface)}
.note.new{border-color:var(--md-outline-variant)}
.note.new .note-txt{font-weight:500}

input,select,textarea{min-height:56px;padding:15px 16px;border:1px solid var(--md-outline);border-radius:4px;background:transparent;font-size:16px}

@media (prefers-reduced-motion:reduce){

function demoQR(tag){

  const n=25,cell=8,pd=16,size=n*cell+pd*2,inF=(x,y)=>(x<8&&y<8)||(x>=n-8&&y<8)||(x<8&&y>=n-8);
  let r='';
  for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(!inF(x,y)&&rnd()<0.47)r+='<rect x="'+(pd+x*cell)+'" y="'+(pd+y*cell)+'" width="'+cell+'" height="'+cell+'"/>';

  const svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+size+' '+(size+26)+'"><rect width="'+size+'" height="'+(size+26)+'" fill="#fff"/><g fill="#111">'+r+f(0,0)+f(n-7,0)+f(0,n-7)+'</g><text x="'+(size/2)+'" y="'+(size+16)+'" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#06c755">LINE Pay 收款碼（示範）</text></svg>';
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}

function genderOk(t,x){return t.gender==='不限'||(t.gender==='限男生'&&x.gender==='男')||(t.gender==='限女生'&&x.gender==='女');}
function span(ms){const a=Math.abs(ms),m=Math.round(a/M);if(m<60)return Math.max(1,m)+' 分鐘';const h=Math.round(a/H);if(h<24)return h+' 小時';return Math.round(a/D)+' 天';}
/* 時間說法：開工前「22 小時後開工」、開工後「已開工 30 分鐘」、結束後「已結束」 */
function when(t){const n=now();return n<t.start?span(t.start-n)+'後開工':n<t.end?'已開工 '+span(n-t.start):'已結束';}
/* 「待開工」開工後改叫「打掃中」 */
function endWord(t){return t.status==='cancelled'?'取消':'完成';}
function stLabel(t){return t.status==='assigned'&&now()>=t.start?'打掃中':ST[t.status].label;}
function deptLine(x){return x.cls||'';}
function suspended(x){return x.suspendedUntil>now();}
function canCancel(t){return now()<t.start;}
function role(t,id){if(!id)return 'viewer';return t.poster===id?'poster':t.assignee===id?'worker':'viewer';}
function avatar(x,sz){let h=0;for(const c of x.id)h+=c.charCodeAt(0);return '<span class="av '+(sz||'')+'" style="background:'+AV[h%AV.length]+'" aria-hidden="true">'+esc(x.name[0])+'</span>';}
function v(f,n){return f.elements[n].value.trim();}
function empty(t,s){return '<div class="empty"><b>'+t+'</b><span class="small">'+s+'</span></div>';}
let tt;
/* 方案 I：重大動作後的閃屏。整個畫面瞬間反轉成強烈配色（用「差異」混色，底下的畫面還看得到），
   中間一個漫畫音效字，停格一下再斜切退場。只是裝飾：不擋點擊、螢幕閱讀器不唸、系統設定減少動態時不出現 */
function fx(color,word){
  try{if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;}catch(e){}
  document.querySelectorAll('.fx-flash,.fx-sfx').forEach(x=>x.remove());
  const a=document.createElement('div'),b=document.createElement('div');
  a.className='fx-flash '+color;b.className='fx-sfx';b.innerHTML='<b>'+word+'</b>';
  [a,b].forEach(x=>{x.setAttribute('aria-hidden','true');document.body.appendChild(x);});
  setTimeout(()=>{a.remove();b.remove();},700);
}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('show'),2600);return false;}
/* 表單錯誤：直接顯示在欄位下方的紅字。找不到欄位時才用畫面上方的提示。 */
function ferr(el,msg){
  if(el&&!el.tagName&&el.length)el=el[0];
  if(!el)return toast(msg);
  const scope=el.closest('.sheet,section,main')||document;
  scope.querySelectorAll('.ferr').forEach(x=>x.remove());scope.querySelectorAll('[aria-invalid="true"]').forEach(x=>x.removeAttribute('aria-invalid'));
  const p=document.createElement('p');p.className='ferr';p.setAttribute('role','alert');p.textContent=msg;
  const after=el.closest('[data-errafter]'),box=after?null:el.closest('.field');
  if(box)box.appendChild(p);else (after||el).insertAdjacentElement('afterend',p);
  if(el.matches('input:not([type=file]):not([type=radio]):not([type=checkbox]),textarea,select')){el.setAttribute('aria-invalid','true');try{el.focus({preventScroll:true});}catch(x){}}
  p.scrollIntoView({block:'nearest'});
  return false;
}
function clearErr(el){const scope=el&&el.closest&&el.closest('.sheet,section,main');if(!scope||!scope.querySelector('.ferr'))return;scope.querySelectorAll('.ferr').forEach(x=>x.remove());scope.querySelectorAll('[aria-invalid="true"]').forEach(x=>x.removeAttribute('aria-invalid'));}
function ask(title,body,ok,fn,danger,cancel){ui.modal={type:'confirm',title,body,ok,danger:!!danger,cancel:cancel||'返回'};ui.pending=fn;}

/* 待辦：只算「現在就能做、而且輪到你」的事 */
function todo(t,id){
  const r=role(t,id),s=t.status;
  return (s==='open'&&r==='poster'&&t.offers.length>0)||(s==='pending'&&r==='worker')||(s==='assigned'&&r==='worker'&&now()>=t.start)||
    (s==='done'&&r==='poster')||(s==='confirmed'&&r==='poster')||(s==='paid'&&r==='worker');
}
/* 卡片底部橫條的文字：依看的人寫一句（本體看到／替身看到） */
function barText(t,id){
  const r=role(t,id),s=t.status,mine=t.offers.find(o=>o.user===id),left=()=>'（還剩 '+span(deadline(t)-now())+'）';
  if(s==='open'&&r==='poster')return t.offers.length?t.offers.length+' 人出價，請選替身':'還沒有人出價';
  if(s==='open'&&mine)return '已出價 NT$ '+money(mine.price)+'，等本體選人';
  if(s==='pending'&&r==='poster')return '等'+u(t.assignee).name+'確認'+left();
  if(s==='pending'&&r==='worker')return '本體選了你，請確認'+left();
  if(s==='pending'&&mine)return '本體已選其他人';
  if(s==='assigned'&&r!=='viewer'){
    if(now()<t.start)return when(t);
    if(r==='worker')return '打掃完成後請按「打掃完成」';
    return now()<t.end?'打掃中':'已過結束時間，替身還沒按完成';
  }
  if(s==='cancelled'){const k=endShort(t,r);return '已取消'+(k?'・'+k:'');}
  if(r!=='viewer'){
    if(s==='done')return r==='poster'?'請驗收':'等本體驗收';
    if(s==='confirmed')return r==='poster'?'請付款 NT$ '+money(t.price):'等本體付款';
    if(s==='paid')return r==='poster'?'等替身確認收款':'本體已付款，請確認收款';
  }
  return stLabel(t);
}
/* 取消的原因（cancelKind）：卡片橫條用短句、詳情頁用整句，都從看的人的角度寫 */
function endShort(t,r){
  switch(t.cancelKind){
    case 'poster':return r==='poster'?'你取消了':'本體取消了';
    case 'expired':return '沒有確定替身';
    case 'noconfirm':return r==='worker'?'你沒確認':'替身沒確認';
    case 'fail':return r==='worker'?'你無法完成':r==='poster'?'替身無法完成':'';
    case 'notdone':return r==='worker'?'本體表示你未完成':r==='poster'?'替身未完成':'';
    case 'unpaid':return r==='worker'?'沒收到款項':r==='poster'?'替身沒收到款項':'';
  }
  return '';
}
function endReason(t,r){
  const at=t.cancelAt?fmtTime(t.cancelAt)+' ':'';
  switch(t.cancelKind){
    case 'poster':return (r==='poster'?'你在 ':'本體在 ')+at+'取消了案件。';
    case 'expired':return '開工時間到了還沒有確定替身，案件已自動取消。';
    case 'noconfirm':return r==='worker'?'你沒有在開工前確認，案件已自動取消。':'替身沒有在開工前確認，案件已自動取消。';
    case 'fail':return r==='worker'?'你表示無法完成，案件已取消。':r==='poster'?'替身表示無法完成，案件已取消，你不用付款。':'案件已取消。';
    case 'notdone':return r==='worker'?'本體結束了案件，表示你未完成。':r==='poster'?'你結束了案件：替身未完成。':'案件已取消。';
    case 'unpaid':return r==='worker'?'你結束了案件：沒收到款項。':r==='poster'?'替身結束了案件，表示沒收到款項。':'案件已取消。';
  }
  return t.cancelReason||'已取消。';
}
/* 待辦的截止時間，用來排序「待你處理」 */
function dueAt(t){
  if(t.status==='pending')return deadline(t);
  if(t.status==='open')return t.start;
  if(t.status==='assigned')return t.end;
  if(t.confirmedAt)return t.confirmedAt+24*H;
  return (t.requestedAt||t.start)+24*H;
}

/* ---------- 網址與返回 ----------
   每個畫面都有自己的網址（#browse、#task-t3…），手機的返回鍵、重新整理、分享連結都能正常運作。 */
const TAB_HASH={browse:'#browse',post:'#post',mine:'#mine',me:'#me'};
const ME_SUBS=['profile','bank','favs','past','tags'];
const GATE={post:['發案','登入後才能發案。'],mine:['我的案件','登入後才能查看你的案件。'],me:['我的','登入後才能管理個人資料、收款方式和收藏。']};
let navStack=[],applied=null;const scrollMem={};
function curHash(){return location.hash&&location.hash!=='#'?location.hash:'#browse';}
function parseHash(h){
  h=String(h||'').replace(/^#/,'');
  if(h.indexOf('task-')===0)return {view:'detail',id:h.slice(5)};
  if(h==='history'||h==='cancelled')return {view:'list',tab:'me',sub:'past',kind:h};  /* 舊網址照樣能用 */
  if(ME_SUBS.indexOf(h)>=0)return {view:'list',tab:'me',sub:h};
  if(h==='post'||h==='mine'||h==='me')return {view:'list',tab:h,sub:'main'};
  return {view:'list',tab:'browse'};
}
function markSeen(t){
  if(!t||!S.me)return;
  t.seen=t.seen||{};t.seen[S.me]=now();
  (S.notes||[]).forEach(n=>{if(n.to===S.me&&n.taskId===t.id&&n.kind==='cmt')n.read=true;});
  save();
}
function applyRoute(){
  const r=parseHash(curHash());
  ui.modal=null;ui.pending=null;ui.dlg=null;ui.tagMenu=null;ui.tagCustom=false;ui.moreMenu=false;
  if(r.view==='detail'){
    const t=T(r.id);
    if(!ui.routed&&t&&S.me&&role(t,S.me)!=='viewer')ui.tab='mine';
    ui.view='detail';ui.detailId=r.id;markSeen(t);
  }else{
    ui.view='list';ui.tab=r.tab;
    if(r.tab==='me'){ui.meSub=r.sub;ui.editing=false;ui.payOpen=null;if(r.kind)ui.pastKind=r.kind;if(r.sub==='tags')ui.tagMenu=null;}
  }
  ui.routed=true;
}
function go(h,replace){
  if(h===curHash()){applyRoute();ui.top=true;return;}
  scrollMem[curHash()]=window.scrollY;
  if(replace){navStack[navStack.length-1]=h;location.replace(h);}else{navStack.push(h);location.hash=h;}
  applied=h;applyRoute();ui.top=true;
}
function goBack(fallback){
  if(navStack.length>1){
    /* 0.4 秒內網址都沒有變過，才當作上一頁不存在、改用備用網址（用次數判斷，避免使用者很快又回到同一頁時被誤判） */
    const seq=hashSeq;history.back();
    setTimeout(()=>{if(hashSeq===seq){go(fallback,true);render();}},400);
    return false;
  }
  go(fallback,true);
}
let hashSeq=0;
window.addEventListener('hashchange',()=>{
  hashSeq++;
  const h=curHash();
  if(h===applied)return;
  const i=navStack.lastIndexOf(h),isBack=i>=0&&i<navStack.length-1;
  if(isBack)navStack=navStack.slice(0,i+1);else navStack.push(h);
  applied=h;applyRoute();render();
  window.scrollTo(0,isBack&&scrollMem[h]!=null?scrollMem[h]:0);
});

function headerView(){
  const m=me(),n=m?unreadNotes():0;
  /* 仿 Google Play：四個主分頁的標題欄是刊頭（左邊品牌名和時間，右邊鈴鐺；未登入時是「登入」）；
     下一層頁面（案件詳情、「我的」底下的頁面）是工具列：左邊返回鍵、沒有品牌名；案件詳情右邊是「⋮」，選單裡有分享和收藏。
     標題欄固定一排；示範工具不放這裡，放在每一頁內容的最下面。螢幕太窄時時間會用「…」省略，不會換行 */
  const detail=ui.view==='detail',sub=ui.view==='list'&&ui.tab==='me'&&S.me&&ui.meSub&&ui.meSub!=='main';
  if(detail||sub){
    const t=detail?T(ui.detailId):null,fav=t&&S.me&&isFav(t.id);

      (ui.moreMenu?'<div class="moremenu" role="menu"><button role="menuitem" data-act="share" data-id="'+t.id+'">'+IC.share+'<span>分享</span></button>'+
        (S.me?'<button role="menuitem" class="'+(fav?'on':'')+'" data-act="fav" data-id="'+t.id+'">'+IC.star+'<span>'+(fav?'取消收藏':'收藏')+'</span></button>':'')+'</div>':'')+'</span>':'';
    return '<header class="top sub"><button class="icon-btn" data-act="'+(detail?'back':'backMe')+'" aria-label="'+(detail?'返回':'返回我的')+'">'+IC.back+'</button><span class="grow"></span>'+more+'</header>';
  }
  return '<header class="top">'+
  '<div class="hd-brand"><div class="brand">替身掃者</div><div class="clock">'+(S.clockOffset?'<span class="sim">模擬</span>':'')+fmtTime(now())+'</div></div>'+
  '<div class="hd-act">'+(m?'<button class="icon-btn bell" data-act="openNotes" aria-label="通知'+(n?'，'+n+' 則未讀':'')+'">'+IC.bell+(n?'<span class="nbadge hdr">'+n+'</span>':'')+'</button>':'<button class="btn sm" data-act="login">登入</button>')+'</div></header>';
}

function fdef(){return {from:'',to:'',tmin:'',tmax:'',pmin:'',pmax:'',genders:GENDERS.slice()};}
const SORTS=[['created','desc','刊登時間：新到舊'],['created','asc','刊登時間：舊到新'],['price','desc','標價：高到低'],['price','asc','標價：低到高'],['start','asc','開工時間：近到遠'],['start','desc','開工時間：遠到近']];
function sortText(){const o=SORTS.find(x=>x[0]===ui.sort&&x[1]===ui.dir);return o?o[2]:'';}
function filterCount(){const f=ui.f;return (f.from||f.to?1:0)+(f.tmin!==''||f.tmax!==''?1:0)+(f.pmin!==''||f.pmax!==''?1:0)+(f.genders.length<GENDERS.length?1:0);}
function matchBrowse(t){
  const f=ui.f;
  if(f.from&&t.start<new Date(f.from+'T00:00').getTime())return false;
  if(f.to&&t.start>=new Date(f.to+'T00:00').getTime()+D)return false;
  if(f.pmin!==''||f.pmax!==''){
    if(!t.budget)return false;
    if(f.pmin!==''&&t.budget<Number(f.pmin))return false;
    if(f.pmax!==''&&t.budget>Number(f.pmax))return false;
  }
  if(f.genders.indexOf(t.gender)<0)return false;
  if(f.tmin!==''||f.tmax!==''){const d=new Date(t.start),e=new Date(t.end),sm=d.getHours()*60+d.getMinutes(),em=e.getHours()*60+e.getMinutes();
    if(f.tmin!==''&&sm<Number(f.tmin))return false;if(f.tmax!==''&&em>Number(f.tmax))return false;}
  const q=ui.q.trim().toLowerCase();
  if(q&&(t.building+' '+t.meet+' '+t.note).toLowerCase().indexOf(q)<0)return false;
  return true;
}

function pfdef(){const d=new Date(now()+D);return {date:toDate(d),month:toDate(d).slice(0,7),start:'10:00',end:'11:00',building:'',meet:'',gender:'不限',budget:'',note:''};}
function toMin(s){const p=s.split(':');return Number(p[0])*60+Number(p[1]);}
function fromMin(n){return pad(Math.floor(n/60))+':'+pad(n%60);}
function durLabel(n){const h=Math.floor(n/60),m=n%60;return (h?h+' 小時':'')+(h&&m?' ':'')+(m?m+' 分鐘':'');}
function slotOk(date,time){return new Date(date+'T'+time).getTime()>now()+H;}
function firstSlot(date){for(let n=0;n<=23*60;n+=5){const s=fromMin(n);if(slotOk(date,s))return s;}return null;}
const MAXEND=23*60+59;
function timeCol(which,part,sel,isDis){
  const vals=part==='h'?Array.from({length:24},(_,i)=>i):Array.from({length:60},(_,i)=>i);
  return '<div class="tcol" role="listbox" aria-label="'+(which==='start'?'開工':'結束')+(part==='h'?'小時':'分鐘')+'">'+vals.map(n=>{
    const dis=isDis(n),on=n===sel;
    return '<button type="button" role="option" aria-selected="'+on+'" class="tcell'+(on?' on':'')+'" data-act="pickTime" data-w="'+which+'" data-p="'+part+'" data-v="'+n+'"'+(dis?' disabled':'')+'>'+pad(n)+'</button>';
  }).join('')+'</div>';
}
function calendar(){
  const pf=ui.pf,ym=pf.month.split('-').map(Number),y=ym[0],mo=ym[1];
  const lead=new Date(y,mo-1,1).getDay(),days=new Date(y,mo,0).getDate();
  const today=toDate(new Date(now())),maxDate=toDate(new Date(now()+60*D));
  let cells='';
  for(let i=0;i<lead;i++)cells+='<span></span>';
  for(let d=1;d<=days;d++){
    const ds=toDate(new Date(y,mo-1,d)),dis=ds<today||ds>maxDate||!firstSlot(ds),sel=ds===pf.date,isT=ds===today;
    cells+='<button type="button" class="cal-day'+(sel?' on':'')+(isT?' today':'')+'" data-act="pickDate" data-v="'+ds+'"'+(dis?' disabled':'')+' aria-pressed="'+sel+'" aria-label="'+mo+' 月 '+d+' 日'+(isT?'，今天':'')+'">'+d+'</button>';
  }
  return '<div class="cal"><div class="cal-head"><button type="button" class="cal-nav" data-act="calMonth" data-v="-1"'+(pf.month>today.slice(0,7)?'':' disabled')+' aria-label="上個月">‹</button>'+
    '<b>'+y+' 年 '+mo+' 月</b><button type="button" class="cal-nav" data-act="calMonth" data-v="1"'+(pf.month<maxDate.slice(0,7)?'':' disabled')+' aria-label="下個月">›</button></div>'+
    '<div class="cal-grid">'+'日一二三四五六'.split('').map(w=>'<span class="cal-wd">'+w+'</span>').join('')+cells+'</div></div>';
}
function timePicker(){
  const pf=ui.pf,s=toMin(pf.start),e=toMin(pf.end),sh=Math.floor(s/60),sm=s%60,eh=Math.floor(e/60),em=e%60;
  const okS=n=>slotOk(pf.date,fromMin(n));
  const startH=h=>{for(let m=0;m<60;m++)if(okS(h*60+m)&&h*60+m<MAXEND)return false;return true;};
  const startM=m=>!okS(sh*60+m)||sh*60+m>=MAXEND;
  const endH=h=>h*60+59<=s;
  const endM=m=>eh*60+m<=s;
  const blk=(w,label,val,h,mm,hd,md)=>'<div class="tblock"><div class="tb-head"><label class="small muted" for="tin-'+w+'">'+label+'</label><input id="tin-'+w+'" class="tb-input" data-w="'+w+'" inputmode="numeric" maxlength="5" value="'+val+'" aria-describedby="tp-help"></div>'+
    '<div class="tcols">'+timeCol(w,'h',h,hd)+'<span class="tsep">:</span>'+timeCol(w,'m',mm,md)+'</div></div>';
  return '<div class="tpick">'+blk('start','開工',pf.start,sh,sm,startH,startM)+blk('end','結束',pf.end,eh,em,endH,endM)+'</div>'+
    '<p class="small muted center" id="tp-help">共 '+durLabel(e-s)+'。可以捲動點選，也可以直接在上面的時間輸入，例如 1435。</p>';
}
function parseTime(str){
  const d=String(str).replace(/[^0-9]/g,'');let h,m;
  if(d.length===3){h=+d[0];m=+d.slice(1);}else if(d.length===4){h=+d.slice(0,2);m=+d.slice(2);}else if(d.length<=2&&d.length>0){h=+d;m=0;}else return null;
  return h<24&&m<60?h*60+m:null;
}
function setTime(which,t){
  const pf=ui.pf;
  if(which==='start'){
    if(!slotOk(pf.date,fromMin(t)))return '開工時間至少要在 1 小時後';
    if(t>=MAXEND)return '開工時間太晚了';
    pf.start=fromMin(t);if(toMin(pf.end)<=t)pf.end=fromMin(Math.min(t+60,MAXEND));
  }else{
    if(t<=toMin(pf.start))return '結束時間要晚於開工時間';
    pf.end=fromMin(t);
  }
  return true;
}

function notifyCmt(to,t,from,text,nimg){

  const n=S.notes.find(x=>x.to===to&&x.taskId===t.id&&x.kind==='cmt'&&!x.read);
  if(n){

    S.notes.splice(S.notes.indexOf(n),1);S.notes.unshift(n);

function deadline(t){return Math.min(t.pendingAt+24*H,t.start);}
function sweep(){
  let ch=false;
  S.tasks.forEach(t=>{
    if(t.status==='pending'&&now()>=deadline(t)){
      ch=true;const w=t.assignee;
      if(now()>=t.start){t.status='cancelled';t.cancelKind='noconfirm';t.cancelAt=t.start;t.cancelReason='到了開工時間替身還沒確認，案件已自動取消';
        notify(t.poster,'替身沒有在開工前確認，案件已自動取消',t.id);notify(w,'你沒有在開工前確認，案件已自動取消',t.id);}
      else{t.offers=t.offers.filter(o=>o.user!==w);t.status='open';t.assignee=null;t.price=null;t.matchNote='替身沒有在期限內確認，這次選擇已自動撤銷，請改選其他出價。';
        notify(t.poster,'替身沒有在期限內確認，這次選擇已自動撤銷，請改選其他人',t.id);notify(w,'你沒有在期限內確認，這次選擇已自動撤銷',t.id);}
    }
    /* 到了開工時間還沒有確定替身 → 自動取消 */
    if(t.status==='open'&&now()>=t.start){
      ch=true;t.status='cancelled';t.cancelKind='expired';t.cancelAt=t.start;t.cancelReason='開工時間到了還沒有確定替身，案件已自動取消';
      notify(t.poster,'開工時間到了還沒有確定替身，案件已自動取消',t.id);
      t.offers.forEach(o=>notify(o.user,'案件到了開工時間還沒選替身，已自動取消',t.id));
    }
    /* 開工時間結束 24 小時後，替身還沒按「打掃完成」→ 自動算打掃完成 */
    if(t.status==='assigned'&&now()>=t.end+24*H){
      ch=true;t.status='done';t.requestedAt=t.end+24*H;t.autoDone=true;
      notify(t.poster,'替身沒有按打掃完成，已自動算打掃完成，請驗收',t.id);notify(t.assignee,'你沒有按打掃完成，已自動算打掃完成',t.id);
    }
    /* 自動驗收前 1 天提醒本體 */
    if(t.status==='done'&&!t.autoWarned&&t.requestedAt&&now()>=t.requestedAt+2*D&&now()<t.requestedAt+3*D){
      ch=true;t.autoWarned=true;notify(t.poster,'1 天後會自動驗收完成，請盡快驗收',t.id);
    }
    /* 替身打掃完成 3 天後，本體還沒驗收 → 自動驗收完成 */
    if(t.status==='done'&&t.requestedAt&&now()>=t.requestedAt+3*D){
      ch=true;t.status='confirmed';t.confirmedAt=t.requestedAt+3*D;t.autoConfirmed=true;
      notify(t.poster,'3 天內沒有驗收，已自動驗收完成，請付款 NT$ '+money(t.price),t.id);
      notify(t.assignee,'本體 3 天內沒有驗收，已自動驗收完成，接下來會付款 NT$ '+money(t.price),t.id);
    }
    if((t.status==='confirmed'||t.status==='paid')&&!t.payWarned&&t.confirmedAt&&now()>t.confirmedAt+24*H){
      ch=true;t.payWarned=true;
      notify(t.poster,t.status==='confirmed'?'已超過 24 小時還沒付款，請盡快付款並按「我已付款」':'已超過 24 小時，替身還沒確認收款',t.id);
      notify(t.assignee,t.status==='confirmed'?'已超過 24 小時，本體還沒付款':'已超過 24 小時還沒確認收款，收到款項後請按「我已收款」',t.id);
    }
    /* 驗收 7 天後還沒完成付款 → 提醒替身（只建議溝通，不主動提結束案件） */
    if((t.status==='confirmed'||t.status==='paid')&&!t.pay7Warned&&t.confirmedAt&&now()>=t.confirmedAt+7*D){
      ch=true;t.pay7Warned=true;
      notify(t.assignee,t.status==='confirmed'?'驗收已超過 7 天還沒收到款項，建議先在留言板跟本體確認':'驗收已超過 7 天，收到款項後請按「我已收款」',t.id);
    }
    /* 案件完成或取消 7 天後，所有照片（打掃證明、留言板、結束案件的照片證明）自動刪除，節省儲存空間 */
    const endedAt=t.status==='closed'?t.closedAt:t.status==='cancelled'?t.cancelAt:0;
    if(endedAt&&now()>endedAt+7*D&&!t.imgsCleared){
      ch=true;t.imgsCleared=true;
      if(t.photos&&t.photos.length){t.photos=[];t.photosGone=true;}
      (t.comments||[]).forEach(c=>{if(c.imgs&&c.imgs.length){c.imgs=[];c.imgsGone=true;}});
      if(t.endNote&&t.endNote.photos&&t.endNote.photos.length){t.endNote.photos=[];t.endNote.photosGone=true;}
    }
  });
  if(ch)save();
}

    (who?'<div class="sum-who"><span class="sum-who-l">本體</span><b class="sum-who-n">'+esc(who.name)+'</b>'+idLine(who)+'</div>':'')+'</div>'+
    (mine?'<span class="sum-role '+(mine==='poster'?'is-poster':'is-worker')+'">'+(mine==='poster'?'我是本體':'我是替身')+'</span>':'')+
    '<div class="sum-price"><span class="small muted">'+pl+'</span><b class="price">'+pv+'</b></div></div>'+
    '<dl class="facts"><dt>地點</dt><dd>'+esc(t.building)+'</dd><dt>集合位置</dt><dd>'+esc(t.meet)+'</dd><dt>替身性別</dt><dd>'+genderText(t.gender)+'</dd><dt>備註</dt><dd>'+note+'</dd></dl></section>';
}
/* 付款進度：從看的人的角度寫（你／本體／替身） */
function payBanner(t,r){
  const paid=t.status==='paid',late=t.confirmedAt&&now()>t.confirmedAt+24*H;
  const a=r==='poster'?(paid?'你已付款':'你付款'):(paid?'本體已付款':'本體付款');
  const b=r==='poster'?'替身確認收款':'你確認收款';
  return '<div class="chosen paysteps"><span class="'+(paid?'ok':'')+'">'+a+'</span><span>'+b+'</span>'+(late?'<span class="small late">已經超過 24 小時，請雙方盡快確認。</span>':'')+'</div>';

/* 「你的下一步」：一張卡、一個主要按鈕。輪到你做事時，卡片外框會變成主色。 */
function nextStep(t,r){
  const m=me(),w=t.assignee?u(t.assignee):null;
  const card=(title,body,act)=>'<section class="card next'+(act?' act':'')+'">'+(title?'<h2>'+title+'</h2>':'')+body+'</section>';
  if(t.status==='open'){
    if(r==='poster')return card('收到的出價（'+t.offers.length+'）',(t.matchNote?'<div class="banner warn">'+esc(t.matchNote)+'</div>':'')+
      (t.offers.length?'<div>'+t.offers.slice().sort((a,b)=>a.price-b.price).map((o,i)=>offerRow(t,o,i,true)).join('')+'</div>':'<p class="small muted">還沒有人出價。</p>'),t.offers.length>0);
    if(!m)return card('出價','<button class="btn block" data-act="login" data-why="登入後才能出價或接受本體標價。">登入後出價</button>',true);
    const mine=t.offers.find(o=>o.user===m.id),took=mine&&t.budget&&mine.price===t.budget,ok=!suspended(m)&&genderOk(t,m)&&hasPay(m);
    let b=mine?'<div class="banner info center">你目前的出價 <b class="price">NT$ '+money(mine.price)+'</b><br><span class="small">等本體選人，選中後會通知你確認接案。</span></div>':'';
    if(suspended(m))b+='<div class="banner bad">你目前停權中，'+fmtTime(m.suspendedUntil)+' 後才能出價。</div>';
    else if(!genderOk(t,m))b+='<div class="banner warn">這個案件'+gLabel(t.gender)+'，'+(m.gender?'你沒辦法出價。':'你的個人資料沒有填性別，所以沒辦法出價。')+'</div>';
    else if(!hasPay(m))b+='<p class="small muted">出價前要先設定收款方式。</p><button class="btn block" data-act="setupPay" data-id="'+t.id+'">設定收款方式</button>';
    else{
      if(t.budget)b+='<button class="btn block" data-act="acceptPrice" data-id="'+t.id+'"'+(took?' disabled':'')+'>'+(took?'已接受本體標價':'接受本體標價')+'</button>';
      b+='<button class="btn block'+(t.budget?' ghost':'')+'" data-act="openBid" data-id="'+t.id+'">'+(mine?'修改出價':'自行出價')+'</button>';

  if(t.status==='pending'){
