/* ---------- 工具 ---------- */
function now(){return Date.now()+S.clockOffset;}
function u(id){return S.users.find(x=>x.id===id);}   /* 用 id 找使用者 */
function me(){return u(S.me);}                         /* 目前登入的人（未登入是 undefined） */
function T(id){return S.tasks.find(t=>t.id===id);}     /* 用 id 找案件 */
function offerOf(t,uid){return t.offers.find(o=>o.user===uid);}  /* 某人在這個案件的出價（沒有是 undefined） */
function nid(p){S.seq++;return p+S.seq;}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function pad(n){return String(n).padStart(2,'0');}
function priceOk(n){return Number.isInteger(n)&&n>=PRICE_MIN&&n<=PRICE_MAX;}  /* 標價、出價都是 NT$ 1～5,000 的整數 */
function money(n){return Number(n).toLocaleString('zh-TW');}
function mdw(d){return (d.getMonth()+1)+'月'+d.getDate()+'日（'+'日一二三四五六'[d.getDay()]+'）';}
function fmtTime(ts){const d=new Date(ts);return (d.getMonth()+1)+'月'+d.getDate()+'日（'+'日一二三四五六'[d.getDay()]+'）'+pad(d.getHours())+':'+pad(d.getMinutes());}
function fmtShort(ts){const d=new Date(ts);return (d.getMonth()+1)+'月'+d.getDate()+'日 '+pad(d.getHours())+':'+pad(d.getMinutes());}
function toDate(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function fmtRange(t){const e=new Date(t.end);return fmtTime(t.start)+' 至 '+pad(e.getHours())+':'+pad(e.getMinutes());}
function label(t){return t.building+'・'+fmtRange(t);}  /* 「第二宿舍・11月24日（二）14:00 至 16:00」：通知第二行、時間重疊提醒 */
function genderOk(t,x){return t.gender==='不限'||(t.gender==='限男生'&&x.gender==='男')||(t.gender==='限女生'&&x.gender==='女');}
function span(ms){const a=Math.abs(ms),m=Math.round(a/M);if(m<60)return Math.max(1,m)+' 分鐘';const h=Math.round(a/H);if(h<24)return h+' 小時';return Math.round(a/D)+' 天';}
/* 時間說法：開工前「距開工 22 小時」、開工後「已開工 30 分鐘」、結束後「已結束」 */
function when(t){const n=now();return n<t.start?'距開工 '+span(t.start-n):n<t.end?'已開工 '+span(n-t.start):'已結束';}
/* 「待開工」開工後改叫「打掃中」 */
function endWord(t){return t.status==='cancelled'?'取消':'完成';}
function stLabel(t){return t.status==='assigned'&&now()>=t.start?'打掃中':ST[t.status].label;}
function deptLine(x){return x.cls||'';}
function canCancel(t){return now()<t.start;}
function role(t,id){if(!id)return 'viewer';return t.poster===id?'poster':t.assignee===id?'worker':'viewer';}
function v(f,n){return f.elements[n].value.trim();}  /* 讀表單欄位的文字（去掉前後空白） */
function empty(t,s){return '<div class="empty"><b>'+t+'</b><span class="small">'+s+'</span></div>';}
let tt;
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('show'),2600);return false;}
/* 表單錯誤：直接顯示在欄位下方的紅字。找不到欄位時才用畫面上方的提示。 */
function ferr(el,msg){
  if(el&&!el.tagName&&el.length)el=el[0];
  if(!el)return toast(msg);
  const scope=el.closest('.sheet,section,main')||document;
  scope.querySelectorAll('.ferr').forEach(x=>x.remove());scope.querySelectorAll('[aria-invalid="true"]').forEach(x=>x.removeAttribute('aria-invalid'));
  const p=document.createElement('p');p.className='ferr';p.setAttribute('role','alert');p.textContent=msg;
  const after=el.closest('[data-errafter]'),box=after?null:el.closest('.field');
  if(box)box.appendChild(p);else (after||el).insertAdjacentElement('afterend',p);
  if(el.matches('input:not([type=file]):not([type=radio]):not([type=checkbox]),textarea,select')){el.setAttribute('aria-invalid','true');try{el.focus({preventScroll:true});}catch(x){}}
  p.scrollIntoView({block:'nearest'});
  return false;
}
function clearErr(el){const scope=el&&el.closest&&el.closest('.sheet,section,main');if(!scope||!scope.querySelector('.ferr'))return;scope.querySelectorAll('.ferr').forEach(x=>x.remove());scope.querySelectorAll('[aria-invalid="true"]').forEach(x=>x.removeAttribute('aria-invalid'));}
function ask(title,body,ok,fn,danger,cancel){ui.modal={type:'confirm',title,body,ok,danger:!!danger,cancel:cancel||'返回'};ui.pending=fn;}

/* 待辦：只算「現在就能做、而且輪到你」的事 */
function todo(t,id){
  const r=role(t,id),s=t.status;
  return (s==='open'&&r==='poster'&&t.offers.length>0)||(s==='pending'&&r==='worker')||(s==='assigned'&&r==='worker'&&now()>=t.start)||
    (s==='done'&&r==='poster')||(s==='confirmed'&&r==='poster'&&hasPay(u(t.assignee)))||(s==='confirmed'&&r==='worker'&&!hasPay(u(t.assignee)))||(s==='paid'&&r==='worker');  /* 替身沒有收款方式時，本體不能付款，改成輪到替身設定 */
}
/* 卡片底部橫條的文字：依看的人寫一句（本體看到／替身看到） */
function barText(t,id){
  const r=role(t,id),s=t.status,mine=offerOf(t,id),left=()=>'（還剩 '+span(t.start-now())+'）';  /* 確認期限就是開工時間 */
  if(s==='open'&&r==='poster')return t.offers.length?t.offers.length+' 人出價，請選替身（距開工 '+span(t.start-now())+'）':'還沒有人出價';
  if(s==='open'&&mine)return '已出價 NT$ '+money(mine.price)+'，等本體選人';
  if(s==='pending'&&r==='poster')return '等'+u(t.assignee).name+'確認（距開工 '+span(t.start-now())+'）';  /* 本體這邊寫距開工多久，不寫「還剩」，以免誤會成本體要做決定的期限 */
  if(s==='pending'&&r==='worker')return '本體選了你，請確認'+left();
  if(s==='pending'&&mine)return '本體已選其他人';
  if(s==='assigned'&&r!=='viewer'){
    if(now()<t.start)return when(t);
    if(r==='worker')return '打掃完成後請按「打掃完成」';
    return now()<t.end?'打掃中':'已過結束時間，替身還沒按完成';
  }
  if(s==='cancelled'){const k=endShort(t,r);return '已取消'+(k?'・'+k:'');}
  if(r!=='viewer'){
    if(s==='done')return r==='poster'?'請驗收（'+span(autoCheckAt(t)-now())+'後自動驗收）':'等本體驗收';
    if(s==='confirmed'&&!hasPay(u(t.assignee)))return r==='poster'?'等替身設定收款方式':'請設定收款方式，本體才能付款';
    if(s==='confirmed')return r==='poster'?'請付款 NT$ '+money(t.price)+(t.confirmedAt&&now()>=payRemindAt(t)?'（已過 '+span(now()-t.confirmedAt)+'）':''):'等本體付款';
    if(s==='paid')return r==='poster'?'等替身確認收款':'本體已付款，請確認收款';
  }
  return stLabel(t);
}
/* 取消的原因（cancelKind）：卡片橫條用短句、詳情頁用整句，都從看的人的角度寫 */
function endShort(t,r){
  switch(t.cancelKind){
    case 'poster':return r==='poster'?'你取消了':'本體取消了';
    case 'expired':return '沒有確定替身';
    case 'noconfirm':return r==='worker'?'你沒確認':'替身沒確認';
    case 'fail':return r==='worker'?'你無法完成':r==='poster'?'替身無法完成':'';
    case 'notdone':return r==='worker'?'本體表示你未完成':r==='poster'?'替身未完成':'';
    case 'unpaid':return r==='worker'?'沒收到款項':r==='poster'?'替身沒收到款項':'';
  }
  return '';
}
function endReason(t,r){
  const at=t.cancelAt?fmtTime(t.cancelAt)+' ':'';
  switch(t.cancelKind){
    case 'poster':return (r==='poster'?'你在 ':'本體在 ')+at+'取消了案件。';
    case 'expired':return '開工時間到了還沒有確定替身，案件已自動取消。';
    case 'noconfirm':return r==='worker'?'你沒有在開工前確認，案件已自動取消。':'替身沒有在開工前確認，案件已自動取消。';
    case 'fail':return r==='worker'?'你表示無法完成，案件已取消。':r==='poster'?'替身表示無法完成，案件已取消，你不用付款。':'案件已取消。';
    case 'notdone':return r==='worker'?'本體結束了案件，表示你未完成。':r==='poster'?'你結束了案件：替身未完成。':'案件已取消。';
    case 'unpaid':return r==='worker'?'你結束了案件：沒收到款項。':r==='poster'?'替身結束了案件，表示沒收到款項。':'案件已取消。';
  }
  return t.cancelReason||'已取消。';
}
/* 各種期限的時間點（常數在最上面） */
function reselectAt(t){return t.pendingAt+RESELECT_WAIT;}    /* 本體可以重新選擇替身 */
function autoDoneAt(t){return t.end+AUTO_DONE_AFTER;}         /* 自動算打掃完成；本體可以結束案件：替身未完成 */
function autoCheckAt(t){return t.requestedAt+AUTO_CHECK_AFTER;}  /* 自動驗收完成 */
function payRemindAt(t){return t.confirmedAt+PAY_REMIND_AFTER;}  /* 提醒付款 */
function unpaidAt(t){return t.confirmedAt+UNPAID_AFTER;}      /* 替身可以結束案件：沒收到款項 */
function endedAt(t){return t.status==='closed'?t.closedAt:t.status==='cancelled'?t.cancelAt:0;}  /* 完成或取消的時間（還沒結束是 0） */
function canEndNotDone(t){return (t.status==='assigned'||t.status==='done')&&now()>=autoDoneAt(t);}  /* 本體可以「結束案件：替身未完成」 */
function photosGoneAt(t){return endedAt(t)+PHOTO_KEEP;}      /* 照片自動刪除 */
/* 待辦的截止時間，用來排序「待你處理」 */
function dueAt(t){
  if(t.status==='pending'||t.status==='open')return t.start;
  if(t.status==='assigned')return t.end;
  if(t.confirmedAt)return payRemindAt(t);
  return (t.requestedAt||t.start)+D;
}

/* ---------- 網址與返回 ----------
   每個畫面都有自己的網址（#browse、#task-t3…），手機的返回鍵、重新整理、分享連結都能正常運作。 */
const TAB_HASH={browse:'#browse',post:'#post',mine:'#mine',me:'#me'};
const ME_SUBS=['profile','bank','favs','past','tags'];
const GATE={post:['發案','登入後才能發案。'],mine:['我的案件','登入後才能查看你的案件。'],me:['我的','登入後才能管理個人資料。']};
let navStack=[],applied=null;const scrollMem={};
function curHash(){return location.hash&&location.hash!=='#'?location.hash:'#browse';}
function parseHash(h){
  h=String(h||'').replace(/^#/,'');
  if(h.indexOf('task-')===0)return {view:'detail',id:h.slice(5)};
  if(h==='history'||h==='cancelled')return {view:'list',tab:'me',sub:'past',kind:h};  /* 舊網址照樣能用 */
  if(ME_SUBS.indexOf(h)>=0)return {view:'list',tab:'me',sub:h};
  if(h==='post'||h==='mine'||h==='me')return {view:'list',tab:h,sub:'main'};
  return {view:'list',tab:'browse'};
}
function markSeen(t){
  if(!t||!S.me)return;
  t.seen=t.seen||{};t.seen[S.me]=now();
  (S.notes||[]).forEach(n=>{if(n.to===S.me&&n.taskId===t.id&&n.kind==='cmt')n.read=true;});
  save();
}
function applyRoute(){
  const r=parseHash(curHash());
  if(ui.view==='list'&&ui.tab!=='post')ui.lastTab=ui.tab;
  ui.modal=null;ui.pending=null;ui.dlg=null;ui.tagMenu=null;ui.tagCustom=false;ui.moreMenu=false;
  if(r.view==='detail'){
    const t=T(r.id);
    if(!ui.routed&&t&&S.me&&role(t,S.me)!=='viewer')ui.tab='mine';
    ui.view='detail';ui.detailId=r.id;markSeen(t);
  }else{
    ui.view='list';ui.tab=r.tab;
    if(r.tab==='me'){ui.meSub=r.sub;ui.payOpen=null;if(r.kind)ui.pastKind=r.kind;if(r.sub==='tags')ui.tagMenu=null;}
  }
  ui.routed=true;
}
function go(h,replace){
  if(h===curHash()){applyRoute();ui.top=true;return;}
  scrollMem[curHash()]=window.scrollY;
  if(replace){navStack[navStack.length-1]=h;location.replace(h);}else{navStack.push(h);location.hash=h;}
  applied=h;applyRoute();ui.top=true;
}
function goBack(fallback){
  if(navStack.length>1){
    /* 0.4 秒內網址都沒有變過，才當作上一頁不存在、改用備用網址（用次數判斷，避免使用者很快又回到同一頁時被誤判） */
    const seq=hashSeq;history.back();
    setTimeout(()=>{if(hashSeq===seq){go(fallback,true);render();}},400);
    return false;
  }
  go(fallback,true);
}
let hashSeq=0;
window.addEventListener('hashchange',()=>{
  hashSeq++;
  const h=curHash();
  if(h===applied)return;
  const i=navStack.lastIndexOf(h),isBack=i>=0&&i<navStack.length-1;
  if(isBack)navStack=navStack.slice(0,i+1);else navStack.push(h);
  applied=h;applyRoute();render();
  window.scrollTo(0,isBack&&scrollMem[h]!=null?scrollMem[h]:0);
});

function headerView(){

/* 發案畫面打開、關掉時的滑動（M3 full-screen dialog）：把目前的畫面複製一份固定在原地，
   打開時新畫面從下面滑上來蓋住它；關掉時複本（發案畫面）往下滑走，露出底下的頁面。0.3 秒後拿掉複本。手機設定「減少動態效果」時不滑 */
function ghost(kind){
  try{if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;}catch(x){}
  const app=document.getElementById('app'),g=document.createElement('div');
  g.className='k-ghost '+kind;  /* 不能叫 ghost：外框按鈕已經用了 .btn.ghost */g.setAttribute('aria-hidden','true');g.inert=true;
  g.innerHTML='<div class="k-ghost-app">'+app.innerHTML+'</div>';
  g.querySelectorAll('[id]').forEach(e=>e.removeAttribute('id'));  /* 複本裡不能有重複的 id */
  g.querySelectorAll('.slide-up,.fx-in,.k-in').forEach(e=>e.classList.remove('slide-up','fx-in','k-in'));g.querySelectorAll('.k-ripple').forEach(e=>e.remove());  /* 複本不重播動畫 */
  const y=window.scrollY;document.body.appendChild(g);g.scrollTop=y;
  setTimeout(()=>g.remove(),kind==='over'?260:320);
}

function fdef(){return {from:'',to:'',days:[],tmin:'',tmax:'',pmin:'',pmax:'',genders:GENDERS.slice()};}
/* 記住篩選條件和排序：存在瀏覽器（這台裝置一份），重新整理後還在；日期已經過了的那一端自動拿掉 */
function loadFilter(){
  try{const d=JSON.parse(localStorage.getItem(FILTER_KEY)||'null');if(!d||!d.f)return null;
    const f=Object.assign(fdef(),d.f),today=toDate(new Date(now()));
    if(f.to&&f.to<today){f.from='';f.to='';}else if(f.from&&f.from<today)f.from='';
    if(!Array.isArray(f.days))f.days=[];if(!Array.isArray(f.genders)||!f.genders.length)f.genders=GENDERS.slice();
    return {f:f,sort:SORTS.some(x=>x[0]===d.sort&&x[1]===d.dir)?d.sort:'start',dir:SORTS.some(x=>x[0]===d.sort&&x[1]===d.dir)?d.dir:'asc'};}catch(e){return null;}
}
let filterSaved='';
function saveFilter(){const v=JSON.stringify({f:ui.f,sort:ui.sort,dir:ui.dir});if(v===filterSaved)return;filterSaved=v;
  try{if(v===JSON.stringify({f:fdef(),sort:'start',dir:'asc'}))localStorage.removeItem(FILTER_KEY);else localStorage.setItem(FILTER_KEY,v);}catch(e){}}  /* 沒有任何條件時就不存 */
function sortText(){const o=SORTS.find(x=>x[0]===ui.sort&&x[1]===ui.dir);return o?o[2]:'';}
function filterCount(){const f=ui.f;return (f.from||f.to?1:0)+(f.days&&f.days.length?1:0)+(f.tmin!==''||f.tmax!==''?1:0)+(f.pmin!==''||f.pmax!==''?1:0)+(f.genders.length<GENDERS.length?1:0);}
function matchBrowse(t){
  const f=ui.f;
  if(f.from&&t.start<new Date(f.from+'T00:00').getTime())return false;
  if(f.to&&t.start>=new Date(f.to+'T00:00').getTime()+D)return false;
  if((f.pmin!==''||f.pmax!=='')&&t.budget){  /* 自由出價的案件沒有標價，不管標價區間怎麼設都照樣顯示 */
    if(f.pmin!==''&&t.budget<Number(f.pmin))return false;
    if(f.pmax!==''&&t.budget>Number(f.pmax))return false;
  }
  if(f.genders.indexOf(t.gender)<0)return false;
  if(f.days&&f.days.length&&f.days.indexOf(new Date(t.start).getDay())<0)return false;
  if(f.tmin!==''||f.tmax!==''){const d=new Date(t.start),e=new Date(t.end),sm=d.getHours()*60+d.getMinutes(),em=e.getHours()*60+e.getMinutes();
    if(f.tmin!==''&&sm<Number(f.tmin))return false;if(f.tmax!==''&&em>Number(f.tmax))return false;}
  const q=ui.q.trim().toLowerCase();
  if(q&&(t.building+' '+t.meet+' '+t.note).toLowerCase().indexOf(q)<0)return false;
  return true;
}

function isBlackPoster(t){if(!S.me||t.poster===S.me)return false;const g=tagOf(t.poster);return !!g&&g.type==='black';}

function browseList(){
  const match=S.tasks.filter(t=>t.status==='open'&&matchBrowse(t)),hid=match.filter(isBlackPoster).length;
  const list=match.filter(browseVisible);

    if(s==='price'){
      if(!a.budget!==!b.budget)return a.budget?-1:1;
      if(a.budget&&b.budget&&a.budget!==b.budget)return sg*(a.budget-b.budget);
      return a.start-b.start;

  });
  const total=S.tasks.filter(t=>t.status==='open'&&browseVisible(t)).length;

function filterChips(){

  if(f.from||f.to)out.push(['date',f.from&&f.to?dd(f.from)+' 至 '+dd(f.to):f.from?dd(f.from)+' 起':'到 '+dd(f.to)]);
  if(f.days&&f.days.length)out.push(['days',[1,2,3,4,5,6,0].filter(d=>f.days.indexOf(d)>=0).map(d=>'週'+'日一二三四五六'[d]).join('、')]);

  if(f.pmin!==''||f.pmax!=='')out.push(['price',f.pmin!==''&&f.pmax!==''?'NT$ '+money(f.pmin)+' 至 '+money(f.pmax):f.pmin!==''?'NT$ '+money(f.pmin)+' 以上':'NT$ '+money(f.pmax)+' 以下']);

function pfdef(){const d=new Date(now()+D);return {date:toDate(d),start:'10:00',end:'11:00',building:'',meet:'',gender:'不限',budget:'',note:''};}
function toMin(s){const p=s.split(':');return Number(p[0])*60+Number(p[1]);}
function fromMin(n){return pad(Math.floor(n/60))+':'+pad(n%60);}
function durLabel(n){const h=Math.floor(n/60),m=n%60;return (h?h+' 小時':'')+(h&&m?' ':'')+(m?m+' 分鐘':'');}
function slotOk(date,time){return new Date(date+'T'+time).getTime()>now()+POST_LEAD;}
function firstSlot(date){for(let n=0;n<=23*60;n+=5){const s=fromMin(n);if(slotOk(date,s))return s;}return null;}
const MAXEND=23*60+59;
function setTime(which,t){
  const pf=ui.pf;
  if(which==='start'){
    if(!slotOk(pf.date,fromMin(t)))return '開工時間至少要在 1 小時後';
    if(t>=MAXEND)return '開工時間太晚了';
    pf.start=fromMin(t);if(toMin(pf.end)<=t)pf.end=fromMin(Math.min(t+60,MAXEND));
  }else{
    if(t<=toMin(pf.start))return '結束時間要晚於開工時間';
    pf.end=fromMin(t);
  }
  return true;
}

  const gopts=[['不限','不限'],['限男生','限男'],['限女生','限女']];
  return '<h1 class="vh">發案</h1>'+
  '<form data-form="post" class="card stack" novalidate>'+

/* 通知文字只寫發生什麼事；是哪個案件（地點・時間）在列表第二行顯示 */
function notify(to,text,taskId){if(!to)return;S.notes=S.notes||[];S.notes.unshift({id:nid('n'),to:to,text:text,taskId:taskId||null,at:now(),read:false});}
/* 新留言通知：同一個案件還沒讀的留言通知會合併成一則 */
function notifyCmt(to,t,from,text,nimg){
  if(!to)return;S.notes=S.notes||[];
  const ex=text?'「'+(text.length>30?text.slice(0,30)+'…':text)+'」':'';
  const one=text?from.name+'留言：'+ex+(nimg?'（附 '+nimg+' 張照片）':''):from.name+'傳了 '+nimg+' 張照片';
  const n=S.notes.find(x=>x.to===to&&x.taskId===t.id&&x.kind==='cmt'&&!x.read);
  if(n){
    n.count=(n.count||1)+1;n.text=from.name+'留了 '+n.count+' 則新留言'+(ex?'，最新一則：'+ex:'');n.at=now();
    S.notes.splice(S.notes.indexOf(n),1);S.notes.unshift(n);
  }else S.notes.unshift({id:nid('n'),to:to,kind:'cmt',count:1,text:one,taskId:t.id,at:now(),read:false});
}

function sweep(){
  let ch=false;
  S.tasks.forEach(t=>{
    /* 到了開工時間替身還沒確認 → 整個案件自動取消 */
    if(t.status==='pending'&&now()>=t.start){
      ch=true;const w=t.assignee;
      t.status='cancelled';t.cancelKind='noconfirm';t.cancelAt=t.start;t.cancelReason='到了開工時間替身還沒確認，案件已自動取消';
      notify(t.poster,'替身沒有在開工前確認，案件已自動取消',t.id);notify(w,'你沒有在開工前確認，案件已自動取消',t.id);
    }
    /* 開工前 5 小時還沒選替身：有人出價的話提醒本體一次（沒人出價不提醒） */
    if(t.status==='open'&&!t.remind5&&now()>=t.start-REMIND_BEFORE&&now()<t.start){
      ch=true;t.remind5=true;
      if(t.offers.length)notify(t.poster,when(t)+'，請盡快選替身，開工時還沒確定替身，案件會自動取消',t.id);
    }
    /* 到了開工時間還沒有確定替身 → 自動取消 */
    if(t.status==='open'&&now()>=t.start){
      ch=true;t.status='cancelled';t.cancelKind='expired';t.cancelAt=t.start;t.cancelReason='開工時間到了還沒有確定替身，案件已自動取消';
      notify(t.poster,'開工時間到了還沒有確定替身，案件已自動取消',t.id);
      t.offers.forEach(o=>notify(o.user,'案件到了開工時間還沒選替身，已自動取消',t.id));
    }
    /* 開工時間結束 24 小時後，替身還沒按「打掃完成」→ 自動算打掃完成 */
    if(t.status==='assigned'&&now()>=autoDoneAt(t)){
      ch=true;t.status='done';t.requestedAt=autoDoneAt(t);t.autoDone=true;
      notify(t.poster,'替身沒有按打掃完成，已自動算打掃完成，請驗收',t.id);notify(t.assignee,'你沒有按打掃完成，已自動算打掃完成',t.id);
    }
    /* 自動驗收前 1 天提醒本體 */
    if(t.status==='done'&&!t.autoWarned&&t.requestedAt&&now()>=t.requestedAt+CHECK_REMIND_AFTER&&now()<autoCheckAt(t)){
      ch=true;t.autoWarned=true;notify(t.poster,'1 天後會自動驗收完成，請盡快驗收',t.id);
    }
    /* 替身打掃完成 3 天後，本體還沒驗收 → 自動驗收完成 */
    if(t.status==='done'&&t.requestedAt&&now()>=autoCheckAt(t)){
      ch=true;t.status='confirmed';t.confirmedAt=autoCheckAt(t);t.autoConfirmed=true;
      notify(t.poster,'3 天內沒有驗收，已自動驗收完成，請付款 NT$ '+money(t.price),t.id);
      notify(t.assignee,'本體 3 天內沒有驗收，已自動驗收完成，接下來會付款 NT$ '+money(t.price),t.id);
    }
    if((t.status==='confirmed'||t.status==='paid')&&!t.payWarned&&t.confirmedAt&&now()>payRemindAt(t)){
      ch=true;t.payWarned=true;
      notify(t.poster,t.status==='confirmed'?'已超過 24 小時還沒付款，請盡快付款並按「我已付款」':'已超過 24 小時，替身還沒確認收款',t.id);
      notify(t.assignee,t.status==='confirmed'?'已超過 24 小時，本體還沒付款':'已超過 24 小時還沒確認收款，收到款項後請按「我已收款」',t.id);
    }
    /* 驗收 7 天後還沒完成付款 → 提醒替身（只建議溝通，不主動提結束案件） */
    if((t.status==='confirmed'||t.status==='paid')&&!t.pay7Warned&&t.confirmedAt&&now()>=unpaidAt(t)){
      ch=true;t.pay7Warned=true;
      notify(t.assignee,t.status==='confirmed'?'驗收已超過 7 天還沒收到款項，建議先在留言板跟本體確認':'驗收已超過 7 天，收到款項後請按「我已收款」',t.id);
    }
    /* 案件完成或取消 7 天後，所有照片（打掃證明、留言板、結束案件的照片證明）自動刪除，節省儲存空間 */
    if(endedAt(t)&&now()>photosGoneAt(t)&&!t.imgsCleared){
      ch=true;t.imgsCleared=true;
      if(t.photos&&t.photos.length){t.photos=[];t.photosGone=true;}
      (t.comments||[]).forEach(c=>{if(c.imgs&&c.imgs.length){c.imgs=[];c.imgsGone=true;}});
      if(t.endNote&&t.endNote.photos&&t.endNote.photos.length){t.endNote.photos=[];t.endNote.photosGone=true;}
    }
  });
  if(ch)save();
}
const TAGS=[['trust','可信賴'],['black','黑名單'],['custom','自訂內容']];
/* 設定你對某人的標記：type 是 trust（可信賴）、black（黑名單）或 custom（自訂內容，text 是內容） */
function setTagOf(uid,type,text){(S.tags[S.me]=S.tags[S.me]||{})[uid]={type,text:text||'',at:now()};}
function tagOf(uid){return (S.tags[S.me]||{})[uid]||null;}
function tagText(g){return g.type==='trust'?'可信賴':g.type==='black'?'黑名單':g.text;}
/* 標記的小標籤：書籤符號＋標記內容，顏色跟資訊卡右上角的標記按鈕一樣（可信賴綠、黑名單紅、自訂淡紫） */
function tagChip(g){
  if(!g)return '';
  return '<span class="tagchip tg-'+g.type+'"><span class="vh">你的標記：</span>'+IC.bookmark+'<span class="tg-lbl">'+esc(tagText(g))+'</span></span>';
}
function tagButton(uid){
  const g=tagOf(uid),open=ui.tagMenu===uid;
  return '<span class="tagwrap"><button class="tagbtn tg-'+(g?g.type:'none')+'" data-act="tagMenu" data-uid="'+uid+'" aria-haspopup="menu" aria-expanded="'+open+'" aria-label="標記'+(g?'，目前是「'+esc(tagText(g))+'」':'')+'">'+
    IC.bookmark+'<span class="tg-lbl">'+(g?esc(tagText(g)):'標記')+'</span></button>'+(open?tagMenuHTML(uid,g,''):'')+'</span>';
}
/* 資訊卡裡的標記：右上角一顆書籤圖示的按鈕「標記」，按了才出現說明和選項；標記後同一顆按鈕改成標記的內容（實心書籤＋標記顏色） */
function tagLine(uid,who){
  const g=tagOf(uid),open=ui.tagMenu===uid;
  const note=who==='本體'?'只有你看得到。之後打開這位本體的案件時會提醒你；標成黑名單的本體，案件在案件大廳會自動隱藏。':'只有你看得到。之後這位替身出價時會提醒你。';
  return '<div class="tagline"><span class="tagwrap">'+
    '<button class="taglink'+(g?' tagged tg-'+g.type:'')+'" data-act="tagMenu" data-uid="'+uid+'" aria-haspopup="menu" aria-expanded="'+open+'" aria-label="'+(g?'更改標記，目前是「'+esc(tagText(g))+'」':'標記這位'+who)+'">'+
      IC.bookmark+'<span class="tg-lbl">'+(g?'<span class="vh">你的標記：</span>'+esc(tagText(g)):'標記')+'</span></button>'+
    (open?tagMenuHTML(uid,g,note):'')+'</span></div>';
}
function tagMenuHTML(uid,g,note){
  return '<div class="tagmenu" role="menu">'+(note?'<p class="tm-note small muted">'+note+'</p>':'')+
      '<button role="menuitemradio" aria-checked="'+(!!g&&g.type==='trust')+'" data-act="setTag" data-uid="'+uid+'" data-type="trust"><span class="tm-dot trust"></span>可信賴'+(g&&g.type==='trust'?'<span class="tm-check">✓</span>':'')+'</button>'+
      '<button role="menuitemradio" aria-checked="'+(!!g&&g.type==='black')+'" data-act="setTag" data-uid="'+uid+'" data-type="black"><span class="tm-dot black"></span>黑名單'+(g&&g.type==='black'?'<span class="tm-check">✓</span>':'')+'</button>'+
      (ui.tagCustom?'<form data-form="tag" data-uid="'+uid+'" class="tm-custom" data-errafter novalidate><input name="text" maxlength="30" placeholder="輸入自訂內容" aria-label="自訂標記內容" value="'+esc(g&&g.type==='custom'?g.text:'')+'"><button class="btn sm" type="submit">儲存</button></form>'
        :'<button role="menuitemradio" aria-checked="'+(!!g&&g.type==='custom')+'" data-act="tagCustom" data-uid="'+uid+'"><span class="tm-dot custom"></span>'+(g&&g.type==='custom'?'自訂：'+esc(g.text):'自訂內容…')+'</button>')+
      (g?'<button role="menuitem" class="tm-remove" data-act="untag" data-uid="'+uid+'">撤銷標記</button>':'')+
    '</div>';
}
const CMT_OPEN=['assigned','done','confirmed','paid'];
function unread(t){
  if(!S.me||!t.comments||!t.comments.length)return 0;
  const seen=(t.seen||{})[S.me]||0;
  return t.comments.filter(c=>c.user!==S.me&&c.at>seen).length;
}
function commentSection(t,r){
  if(r==='viewer'||!t.assignee)return '';
  const can=CMT_OPEN.indexOf(t.status)>=0,list=t.comments||[];
  if(!can&&!list.length)return '';
  return '<section class="card" id="cmt-sec"><div class="row between"><h2>留言板</h2><span class="small muted">只有你們兩人看得到</span></div>'+
    (list.length?'<div class="cmts">'+list.map(c=>{const mine=c.user===S.me,x=u(c.user);
      return '<div class="cmt'+(mine?' mine':'')+'"><div class="cmt-meta">'+(mine?'你':esc(x.name))+'・'+fmtShort(c.at)+'</div>'+(c.text?'<div class="cmt-txt">'+esc(c.text)+'</div>':'')+
        (c.imgs&&c.imgs.length?'<div class="cmt-imgs">'+c.imgs.map((src,i)=>'<img src="'+src+'" alt="留言照片 '+(i+1)+'" data-act="viewImg">').join('')+'</div>':'')+
        (c.imgsGone?'<div class="cmt-meta">照片已在案件'+endWord(t)+' 7 天後自動刪除</div>':'')+'</div>';}).join('')+'</div>'
      :'<p class="small muted">還沒有留言。</p>')+
    (can?(()=>{const pre=ui.cimg[t.id]||[];
      return (pre.length?'<div class="cmt-pre">'+pre.map((src,i)=>'<div class="ph"><img src="'+src+'" alt="要傳的照片 '+(i+1)+'"><button class="ph-x" data-act="rmCimg" data-id="'+t.id+'" data-i="'+i+'" aria-label="移除這張">×</button></div>').join('')+'</div>':'')+
      '<form data-form="comment" data-id="'+t.id+'" class="cmt-form" data-errafter novalidate><label class="cmt-ph icon-btn" for="cmt-f" aria-label="加照片">'+IC.image+'<input class="vh" id="cmt-f" type="file" accept="image/*" multiple data-upload="cimg" data-id="'+t.id+'"></label>'+
      '<textarea id="cmt-in" name="text" rows="2" maxlength="300" placeholder="輸入留言" aria-label="輸入留言">'+esc(ui.cdraft[t.id]||'')+'</textarea><button class="btn" type="submit">送出</button></form>';})()
      :'<p class="small muted">案件已經'+(t.status==='closed'?'完成':'取消')+'，留言板只能查看。</p>')+
  '</section>';
}
function personCard(title,x,self){
  return '<section class="card mini"><div class="row between"><span class="mini-role">'+title+'</span>'+(self?'<span class="small muted">你</span>':'')+'</div>'+
  idBlock(x)+(self?'':tagLine(x.id,title))+'</section>';
}
function offerRow(t,o,i,canChoose){
  const x=u(o.user),full=jobsFull(x.id),g=tagOf(x.id);
  return '<div class="offer"><div class="row between offer-row"><div class="grow">'+idBlock(x)+(g?'<div class="offer-tag">'+tagChip(g)+'</div>':'')+'</div>'+
    '<div class="offer-side"><span class="price">'+ntd(o.price)+'</span>'+(!canChoose?'':full?'<span class="pill s-off">已滿 '+MAX_JOBS+' 件，不能選</span>':'<button class="btn sm" data-act="choose" data-id="'+t.id+'" data-oid="'+o.id+'">選這位</button>')+'</div></div></div>';
}
/* ---------- 案件詳情 ----------
   由上到下：進度條（只有當事人）→ 摘要 → 你的下一步 → 留言板 → 對方資訊 → 取消或退出 */
function photoBlock(t,editable){
  const ph=t.photos||[];
  if(!editable&&!ph.length)return t.photosGone?'<p class="small muted">打掃證明已在案件'+endWord(t)+' 7 天後自動刪除。</p>':'';
  const del=endedAt(t)?'照片會在 '+fmtTime(photosGoneAt(t))+' 自動刪除，需要的話請點開照片下載。':'照片只有你們兩人看得到。';
  return '<div class="stack-s"><div class="row between"><b class="small">打掃證明</b><span class="small muted">'+(editable?'選填・'+ph.length+'／'+PH_MAX+' 張':ph.length+' 張')+'</span></div><div class="photos">'+
  ph.map((p,i)=>'<div class="ph"><img src="'+p.src+'" alt="打掃證明 '+(i+1)+'" data-act="viewPhoto" data-id="'+t.id+'" data-i="'+i+'"><span class="ph-time">'+fmtShort(p.at)+'</span>'+
    (editable?'<button class="ph-x" data-act="rmPhoto" data-id="'+t.id+'" data-i="'+i+'" aria-label="刪除這張">×</button>':'')+'</div>').join('')+
  (editable&&ph.length<PH_MAX?'<label class="ph add" for="f-ph">＋ 加照片<input class="vh" id="f-ph" type="file" accept="image/*" multiple data-upload="photos" data-id="'+t.id+'"></label>':'')+'</div>'+
  '<p class="small muted">'+del+'</p></div>';
}
/* 你當替身、而且同一段時間已經確定（或等你確認）的其他案件：出價和確認接案時提醒一句 */
function clashes(t,uid){return S.tasks.filter(x=>x.id!==t.id&&x.assignee===uid&&(x.status==='pending'||x.status==='assigned')&&x.start<t.end&&t.start<x.end);}
function clashNote(t){const c=S.me?clashes(t,S.me):[];return c.length?'<div class="banner warn clash">這段時間你已經有'+(c.length>1?' '+c.length+' 個':'')+'案件：'+c.map(x=>esc(label(x))).join('、')+'</div>':'';}
/* 出價前的檢查（接受本體標價、自行出價共用）：可以出價回傳空字串，不行回傳原因 */
function bidProblem(t,m){
  if(!genderOk(t,m))return '這個案件有指定性別，你沒辦法出價';
  if(!hasPay(m))return '出價前要先設定收款方式';
  if(!offerOf(t,m.id)&&jobsFull(m.id))return fullNote('再出價');  /* 已經出過價的仍可以修改 */
  return '';
}
/* 送出或更新出價：出過價就改金額，沒有就新增並通知本體。新增回傳 true */
function placeBid(t,price,noteText){
  const ex=offerOf(t,S.me);
  if(ex){ex.price=price;ex.at=now();return false;}
  t.offers.push({id:nid('o'),user:S.me,price,at:now()});notify(t.poster,noteText,t.id);return true;
}
/* 一個人同時進行的案件（當替身、待開工或打掃中）最多 MAX_JOBS 件，讓很多人各接一些 */
function activeJobs(uid){return S.tasks.filter(t=>t.assignee===uid&&t.status==='assigned').length;}
function jobsFull(uid){return activeJobs(uid)>=MAX_JOBS;}
function fullNote(then){return '你同時進行的案件已經有 '+MAX_JOBS+' 件（待開工或打掃中），打掃完成一件後才能'+then+'。';}
function hhmm(ts){const d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes());}
function summaryCard(t){
  const live=t.status==='open'||t.status==='pending'||t.status==='assigned';
  /* 瀏覽的人（包括沒被選上的替身）只看得到本體標價；本體和替身看成交價，替身還沒確認接案時叫「選中的出價」 */
  const deal=role(t,S.me)!=='viewer'&&!!t.price;
  const pl=deal?(t.status==='pending'?'選中的出價':'成交價'):'本體標價';
  const pv=deal?ntd(t.price):t.budget?ntd(t.budget):'<span class="muted">自由出價</span>';
  const orig=deal&&t.budget&&t.price!==t.budget?'<span class="sum-orig">原標價 '+ntd(t.budget)+'</span>':'';
  const clamp=t.note&&!(t.status==='open'||t.status==='pending'),exp=!!ui.expanded[t.id];
  const note=!t.note?'<span class="muted">無</span>'
    :clamp?'<div class="clamp'+(exp?' open':'')+'"><span class="clamp-txt">'+esc(t.note)+'</span><button class="tc-more" data-act="toggleNote" data-id="'+t.id+'" aria-expanded="'+exp+'">'+(exp?'收合':'展開')+'</button></div>'
    :esc(t.note);
  const me_=S.me,mine=t.poster===me_?'poster':(t.assignee===me_||!!offerOf(t,me_))&&me_?'worker':'';
  const who=me_&&t.assignee===me_&&t.status!=='pending'?u(t.poster):null;  /* 替身確認接案後才看得到本體資料 */
  return '<section class="card sum stg-'+stg(t)+'" aria-label="案件摘要">'+
    (t.status==='cancelled'?'<span class="pill s-off" style="align-self:flex-start">已取消</span>':'')+
    '<div class="sum-top" data-d="'+new Date(t.start).getDate()+'"><div class="grow"><div class="sum-date">'+dayHTML(new Date(t.start))+'</div><div class="sum-time"><span>'+hhmm(t.start)+' 至 '+hhmm(t.end)+'</span>'+(live?'<span class="small muted">'+when(t)+'</span>':'')+'</div>'+
    (who?'<div class="sum-who"><span class="sum-who-l">本體</span><b class="sum-who-n">'+esc(who.name)+'</b><span class="num">'+esc(who.sid)+'</span></div>':'')+'</div>'+
    (mine?'<span class="sum-role '+(mine==='poster'?'is-poster':'is-worker')+'">'+(mine==='poster'?'我是本體':'我是替身')+'</span>':'')+
    '</div>'+
    '<dl class="facts"><dt>地點</dt><dd>'+esc(t.building)+'</dd><dt>集合位置</dt><dd>'+esc(t.meet)+'</dd><dt>替身性別</dt><dd>'+genderText(t.gender)+'</dd>'+(t.note?'<dt>備註</dt><dd>'+note+'</dd>':'')+'</dl>'+
    '<div class="sum-price">'+orig+'<span class="small muted sum-pl">'+pl+'</span><b class="price">'+pv+'</b></div></section>';
}
/* 付款進度：從看的人的角度寫（你／本體／替身） */
function payBanner(t,r){
  const paid=t.status==='paid',late=t.confirmedAt&&now()>payRemindAt(t);
  const a=r==='poster'?(paid?'你已付款':'你付款'):(paid?'本體已付款':'本體付款');
  const b=r==='poster'?'替身確認收款':'你確認收款';
  return '<div class="chosen paysteps"><span class="'+(paid?'ok':'')+'">'+a+'</span><span>'+b+'</span>'+(late?'<span class="small late">已經超過 24 小時，請雙方盡快確認。</span>':'')+'</div>';
}
/* 「你的下一步」：一張卡、一個主要按鈕。輪到你做事時，卡片外框會變成主色。 */
function nextStep(t,r){
  const m=me(),w=t.assignee?u(t.assignee):null;
  const card=(title,body,act)=>'<section class="card next'+(act?' act':'')+'">'+(title?'<h2>'+title+'</h2>':'')+body+'</section>';
  if(t.status==='open'){
    if(r==='poster')return card('收到的出價（'+t.offers.length+'）',(t.matchNote?'<div class="banner warn">'+esc(t.matchNote)+'</div>':'')+
      (t.offers.length?'<div>'+t.offers.slice().sort((a,b)=>a.price-b.price).map((o,i)=>offerRow(t,o,i,true)).join('')+'</div>':'<p class="small muted">還沒有人出價。</p>'),t.offers.length>0);
    if(!m)return card('出價','<button class="btn block" data-act="login" data-why="登入後才能出價或接受本體標價。">登入後出價</button>',true);
    const mine=offerOf(t,m.id),took=mine&&t.budget&&mine.price===t.budget,full=jobsFull(m.id),ok=genderOk(t,m)&&hasPay(m)&&!full;
    let b=mine?'<div class="banner info center">你目前的出價 <b class="price">NT$ '+money(mine.price)+'</b><br><span class="small">等本體選人，選中後會通知你確認接案。</span></div>':'';
    if(!genderOk(t,m))b+='<div class="banner warn">這個案件'+gLabel(t.gender)+'，'+(m.gender?'你沒辦法出價。':'你的個人資料沒有填性別，所以沒辦法出價。')+'</div>';
    else if(full)b+='<div class="banner warn">'+fullNote('再出價')+'</div>'+(mine?'<button class="btn ghost block" data-act="openBid" data-id="'+t.id+'">修改出價</button>':'');  /* 已經出過價的，仍可以修改或撤回 */
    else if(!hasPay(m))b+='<p class="small muted">出價前要先設定收款方式。</p><button class="btn block" data-act="setupPay" data-id="'+t.id+'">設定收款方式</button>';
    else{
      b+=clashNote(t);
      if(t.budget)b+='<button class="btn block" data-act="acceptPrice" data-id="'+t.id+'"'+(took?' disabled':'')+'>'+(took?'已接受本體標價':mine?'改接受本體標價':'接受本體標價')+'</button>';
      b+='<button class="btn block'+(t.budget?' ghost':'')+'" data-act="openBid" data-id="'+t.id+'">'+(mine?'修改出價':'自行出價')+'</button>';
    }
    return card('出價',b,ok&&!mine);
  }
  if(t.status==='pending'){
    const left=span(t.start-now()),unAt=reselectAt(t),canUn=now()>=unAt;
    if(r==='worker'){
      const re=canUn?'本體現在可以重新選擇替身了。':'本體 1 小時後可以重新選擇替身（還剩 '+span(unAt-now())+'）。';
      return card('確認接案','<p class="np-lead">本體選了你！</p>'+
        '<dl class="facts np"><dt>你的出價</dt><dd><b class="price">NT$ '+money(t.price)+'</b></dd><dt>確認期限</dt><dd><b>開工前</b><span class="nw">（還剩 '+left+'）</span></dd></dl>'+
        '<p class="small muted">開工時還沒確認，案件會自動取消。'+re+'</p>'+clashNote(t)+(jobsFull(S.me)?'<div class="banner warn">'+fullNote('確認接案')+'</div>':'')+
        '<button class="btn block" data-act="acceptMatch" data-id="'+t.id+'"'+(jobsFull(S.me)?' disabled':'')+'>確認接案</button><button class="btn ghost block" data-act="declineMatch" data-id="'+t.id+'">婉拒</button>',true);
    }
    if(r==='poster'){
      const re=canUn?'你現在可以重新選擇替身。':'你在 1 小時後可以重新選擇替身（還剩 '+span(unAt-now())+'）。';
      /* 選中的替身：排法和出價清單一樣（姓名、學號，標記在學號下面；出價在右上角） */
      return card('待替身確認接案','<div class="pickbox"><div class="grow">'+idBlock(w)+tagLine(w.id,'替身')+'</div><b class="price">'+ntd(t.price)+'</b></div>'+
        '<p class="small muted">'+re+'</p>'+
        '<button class="btn ghost block" data-act="unchoose" data-id="'+t.id+'"'+(canUn?'':' disabled')+'>重新選擇替身</button>',false);
    }
    const mine=m?offerOf(t,m.id):null;
    return card('',(mine?'<div class="row between pc-row"><span class="muted">你的出價</span><span class="price">'+ntd(mine.price)+'</span></div>':'')+
      '<p class="small muted center">本體已選其他人，正在等對方確認接案。對方婉拒或本體重新選擇替身的話，案件會重新召喚替身。</p>'+
      (mine?'<button class="btn quiet" data-act="withdrawPending" data-id="'+t.id+'">撤回出價</button>':''),false);  /* 沒被選上的替身，不想等也可以撤回 */
  }
  if(t.status==='assigned'){
    const begun=now()>=t.start,over=now()>=t.end,autoAt=fmtTime(autoDoneAt(t));
    if(r==='worker')return card('打掃完成後',photoBlock(t,true)+
      '<button class="btn block" data-act="requestPay" data-id="'+t.id+'"'+(begun?'':' disabled')+'>打掃完成</button>'+
      '<p class="small muted">'+(!begun?'開工時間 '+fmtTime(t.start)+' 到了才能按（'+when(t)+'）。':over?'已過結束時間。沒有按的話，'+autoAt+' 會自動算打掃完成。':'按下後會通知本體驗收。提早完成也可以直接按。')+'</p>',begun);
    if(r==='poster')return card(begun?'打掃中':'待開工','<p class="small muted">'+(over?'已過結束時間，替身還沒按「打掃完成」。'+autoAt+' 會自動算打掃完成。':'替身完成後會通知你驗收。')+'</p>',false);
    return '';
  }
  if(t.status==='done'){
    const autoAt=autoCheckAt(t),auto=fmtTime(autoAt)+' 會自動驗收完成（還剩 '+span(autoAt-now())+'）。';
    if(r==='poster')return card('驗收',(t.autoDone?'<p class="small muted">替身沒有按打掃完成，已在結束時間 24 小時後自動算打掃完成。</p>':'')+photoBlock(t,false)+
      '<p class="small muted">驗收完成後會顯示替身的收款方式。沒有驗收的話，'+auto+'</p><button class="btn block" data-act="confirmDone" data-id="'+t.id+'">驗收完成</button>',true);
    if(r==='worker')return card('等本體驗收','<p class="small muted">'+(t.autoDone?'你沒有按打掃完成，已自動算打掃完成。':'已通知本體驗收。')+'本體沒有驗收的話，'+auto+'</p>'+photoBlock(t,false),false);
    return '';
  }
  if(t.status==='confirmed'){

/* 取消或退出：放在最下面，樣式淡一點。
   開工前的取消、退出是正常選項；開工後的「結束案件」不鼓勵使用，只在條件到了才出現，並收在「案件遇到問題？」裡 */
function exitArea(t,r){
  const s=t.status,n=now(),q=(act,label)=>'<button class="btn quiet" data-act="'+act+'" data-id="'+t.id+'">'+label+'</button>',tip=x=>'<p class="small muted center">'+x+'</p>';
  if(n<t.start){
    /* 本體的「取消案件」也收在「案件遇到問題？」裡（2026-11 使用者要求），正常流程的按鈕比較顯眼 */
    if(r==='poster'&&(s==='open'||s==='pending'||s==='assigned'))return '<div class="exit"><details class="trouble"><summary>案件遇到問題？</summary>'+
      tip(s==='assigned'?'建議先在留言板跟替身說明。開工前都可以取消案件，替身會收到通知。':'開工前都可以取消案件'+(t.offers.length?'，出價的人會收到通知。':'。'))+q('cancelTask','取消案件')+'</details></div>';
    if(r==='worker'&&s==='assigned')return '<div class="exit"><details class="trouble"><summary>案件遇到問題？</summary>'+tip('建議先在留言板跟本體說明。開工前都可以退出案件，本體會收到通知。')+q('withdrawAssign','退出案件')+'</details></div>';  /* 2026-11 使用者要求：退出也收起來 */
    return '';
  }
  /* 開工後（替身收款問題：驗收後）就出現「案件遇到問題？」；還不能結束案件時，只說明什麼時候可以，先引導溝通 */
  let trouble='';
  if(r==='worker'&&s==='assigned')
    trouble=tip('建議先在留言板跟本體說明。如果真的無法完成，可以結束案件，案件會直接取消。')+q('failTask','結束案件：無法完成');
  else if(r==='poster'&&(s==='assigned'||s==='done')){
    const at=autoDoneAt(t);
    trouble=n>=at?tip('建議先在留言板跟替身確認。如果替身真的沒有完成，可以結束案件，需要寫原因並附上照片。')+q('openNotDone','結束案件：替身未完成')
      :tip('有疑慮請先在留言板跟替身溝通。開工時間結束 24 小時後，也就是 '+fmtTime(at)+' 之後，如果替身真的沒有完成，才能選擇「結束案件：替身未完成」。');
  }else if(r==='worker'&&(s==='confirmed'||s==='paid')&&t.confirmedAt){
    const at=unpaidAt(t);
    trouble=n>=at?tip('建議先在留言板跟本體確認。如果一直沒收到款項，可以結束案件。')+q('unpaid','結束案件：沒收到款項')
      :tip('有疑慮請先在留言板跟本體確認。驗收 7 天後，也就是 '+fmtTime(at)+' 之後，如果還沒收到款項，才能選擇「結束案件：沒收到款項」。');
  }
  const note=s==='assigned'&&(r==='poster'||r==='worker')?'<p class="small muted">已經開工，不能'+(r==='worker'?'退出':'取消')+'了。有狀況請在留言板說明。</p>':'';
  if(!trouble)return note?'<div class="exit">'+note+'</div>':'';
  return '<div class="exit">'+note+'<details class="trouble"><summary>案件遇到問題？</summary>'+trouble+'</details></div>';
}
function detailView(){

function dialHTML(g){return '<div class="dial" aria-hidden="true">'+dialInner(g)+'</div>';}
/* 錶盤裡面的數字、指針（拖曳時只換這些，不換掉手指按著的錶盤本身） */
function dialInner(g){
  const C=120,RO=92,RI=58,rad=a=>a*Math.PI/180;
  const pos=(a,R)=>'left:'+(C+R*Math.sin(rad(a))).toFixed(1)+'px;top:'+(C-R*Math.cos(rad(a))).toFixed(1)+'px';
  let labels='',ang,R,knob;
  if(g.mode==='h'){
    for(let i=0;i<12;i++){
      labels+='<span class="dial-n'+(g.h===i?' on':'')+'" style="'+pos(i*30,RO)+'">'+pad(i)+'</span>';
      labels+='<span class="dial-n in'+(g.h===i+12?' on':'')+'" style="'+pos(i*30,RI)+'">'+(i+12)+'</span>';
    }
    ang=(g.h%12)*30;R=g.h>=12?RI:RO;knob=pad(g.h);
  }else{
    for(let i=0;i<12;i++)labels+='<span class="dial-n'+(g.m===i*5?' on':'')+'" style="'+pos(i*30,RO)+'">'+pad(i*5)+'</span>';
    ang=g.m*6;R=RO;knob=pad(g.m);
  }
  return labels+'<span class="dial-hand" style="top:'+(C-R)+'px;height:'+R+'px;transform:rotate('+ang+'deg)"></span>'+
    '<span class="dial-knob'+(R===RI?' in':'')+'" style="'+pos(ang,R)+'">'+knob+'</span><span class="dial-c"></span>';
}

function parseDateIn(target){

function dialSet(e){
  const el=document.querySelector('.dial');if(!el||!ui.dlg)return;
  const r=el.getBoundingClientRect(),x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2);
  let a=Math.atan2(x,-y)*180/Math.PI;if(a<0)a+=360;
  const g=ui.dlg,idx=Math.round(a/30)%12,dist=Math.hypot(x,y)*(240/r.width);
  if(g.mode==='h')g.h=idx+(dist<75?12:0);else g.m=Math.round(a/6)%60;
  /* 手機上如果把手指按著的元素換掉，放開的訊號就收不到，所以這裡只更新錶盤內容和上方的數字 */
  el.innerHTML=dialInner(g);
  const bh=document.querySelector('.tbox[data-v="h"]'),bm=document.querySelector('.tbox[data-v="m"]');
  if(bh)bh.textContent=pad(g.h);if(bm)bm.textContent=pad(g.m);
}

/* ---------- 方案 K（Material Design 3）的互動 ---------- */
/* 空的輸入框：標上 k-empty，欄位名稱就顯示在框裡；打字或有內容時浮到外框上緣 */
function kFields(){document.querySelectorAll('.field>input,.field>textarea,.field>.mail-in>input').forEach(i=>{const f=i.closest('.field');if(f)f.classList.toggle('k-empty',!i.value);});}
document.addEventListener('input',e=>{const i=e.target;if(i.matches&&i.matches('.field>input,.field>textarea,.field>.mail-in>input'))i.closest('.field').classList.toggle('k-empty',!i.value);});
/* 上方應用程式列：往下捲時換底色（M3 的捲動狀態） */
function topScrolled(){const h=document.querySelector('header.top');if(h)h.classList.toggle('scrolled',window.scrollY>0);}
window.addEventListener('scroll',topScrolled,{passive:true});
/* 發案按鈕：往下捲時縮成只有「＋」，往上捲或回到最上面時再展開（M3 extended FAB 的做法，少蓋住一點卡片） */
let fabY=0,fabMini=false;
function fabScroll(){const y=window.scrollY;if(Math.abs(y-fabY)<8&&y>56)return;fabMini=y>fabY&&y>56;fabY=y;const f=document.querySelector('.fab');if(f)f.classList.toggle('mini',fabMini);}
window.addEventListener('scroll',fabScroll,{passive:true});
/* 底部分頁的膠囊、分段按鈕的勾勾：只在「換了」的那一次播放動畫，其他原因重畫畫面時不重播 */
let kPrev=null;
function kMotion(){
  const cur={tab:ui.tab,seg:ui.mineRole};
  if(kPrev){
    const sel=cur.tab!==kPrev.tab?'nav.tabs button.on':cur.seg!==kPrev.seg?'.seg button.on':'';
    const el=sel&&document.querySelector(sel);if(el)el.classList.add('k-in');
  }
  kPrev=cur;
}
/* 按下時的水波紋（Material 的按壓回饋）：圓形圖示按鈕從中間擴散，其他從手指的位置擴散 */
document.addEventListener('pointerdown',e=>{
  if(e.button>0)return;
  const el=e.target.closest&&e.target.closest('.tc-open,.fab,.seg button,.btn,.icon-btn,.tool,.note,.acct-row,.card.linkrow,.opt-row,.acc-h,.moremenu>button,.chip,.checks label,.tagmenu>button,.dd');
  if(!el||el.disabled)return;
  try{if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;}catch(x){}
  const r=el.getBoundingClientRect(),round=el.matches('.icon-btn,.tool,.dd');
  const x=round?r.width/2:e.clientX-r.left,y=round?r.height/2:e.clientY-r.top;
  const d=round?Math.max(r.width,r.height):2*Math.hypot(Math.max(x,r.width-x),Math.max(y,r.height-y));
  const s=document.createElement('span');s.className='k-ripple';s.setAttribute('aria-hidden','true');
  s.style.cssText='width:'+d+'px;height:'+d+'px;left:'+(x-d/2)+'px;top:'+(y-d/2)+'px';
  el.appendChild(s);setTimeout(()=>s.remove(),600);
},{passive:true});

  /* 下載照片：在 claude.ai 的 artifact 裡用它的下載功能（會先問使用者），其他地方用瀏覽器一般的下載。
     檔名用英文（photo-日期-時間），有些瀏覽器不接受中文檔名，會變成「download」 */
  dlImg(){const src=ui.modal&&ui.modal.src;if(!src)return false;
    const mime=(src.match(/^data:([^;,]+)/)||[])[1]||'image/jpeg',ext=mime==='image/svg+xml'?'svg':mime==='image/png'?'png':'jpg';
    const name='photo-'+toDate(new Date(now())).replace(/-/g,'')+'-'+pad(new Date().getHours())+pad(new Date().getMinutes())+pad(new Date().getSeconds())+'.'+ext,blob=dataBlob(src);

/* ---------- 表單 ---------- */
const F={
  offer(f,d){
    const t=T(d.id),err=bidProblem(t,me());if(err)return ferr(f.elements.price,err);
    const raw=v(f,'price'),price=Math.round(Number(raw));
    if(!raw)return ferr(f.elements.price,'請輸入出價金額');
    if(!priceOk(price))return ferr(f.elements.price,'出價請在 NT$ '+money(PRICE_MIN)+' 到 '+money(PRICE_MAX)+' 之間');
    const isNew=placeBid(t,price,'有人出價 NT$ '+money(price));
    ui.modal=null;save();toast(isNew?'已送出出價，等本體選人':'已更新出價');
  },
  post(f){
    const pf=ui.pf;
    if(!pf.date||!pf.start||!pf.end)return ferr(f.querySelector('[data-act="openDate"]'),'請選日期、開工和結束時間');
    const start=new Date(pf.date+'T'+pf.start).getTime(),end=new Date(pf.date+'T'+pf.end).getTime();
    if(!(end>start))return ferr(f.querySelector('[data-w="end"]'),'結束時間要晚於開工時間');
    if(!(start>now()+POST_LEAD))return ferr(f.querySelector('[data-w="start"]'),'開工時間至少要在 1 小時後');
    if(!v(f,'building'))return ferr(f.elements.building,'請填地點');
    if(!v(f,'meet'))return ferr(f.elements.meet,'請填集合位置');
    const g=f.querySelector('input[name=gender]:checked');if(!g)return ferr(f.elements.gender,'請選擇替身性別');
    const bs=v(f,'budget');let budget=null;
    if(bs){budget=Math.round(Number(bs));if(!priceOk(budget))return ferr(f.elements.budget,'標價請在 NT$ '+money(PRICE_MIN)+' 到 '+money(PRICE_MAX)+' 之間');}
    /* 案件發布後不能修改，所以先給本體看一次摘要，確認後才發布 */
    ui.postDraft={building:v(f,'building'),meet:v(f,'meet'),gender:g.value,start,end,budget,note:v(f,'note')};ui.modal={type:'postConfirm'};
  },
  pay(f,d){
    const t=T(d.id);
    const sel=f.querySelector('input[name=method]:checked'),w=u(t.assignee);
    if(!hasPay(w))return toast('替身還沒設定收款方式，現在不能付款');
    if(!sel)return ferr(f.querySelector('.pay-acc'),'請選擇付款方式');
    if(!w[sel.value==='bank'?'bank':'linepay'])return ferr(f.querySelector('.pay-acc'),'替身已經移除這種收款方式，請重新選擇');
    if(sel.value==='bank'){const x=v(f,'last5');if(!/^\d{5}$/.test(x))return ferr(f.elements.last5,'請輸入 5 位數字');t.payment={last5:x,method:'銀行轉帳',at:now()};}
    else t.payment={last5:null,method:'LINE Pay',at:now()};
    t.status='paid';notify(t.assignee,'本體已付款 NT$ '+money(t.price)+'，收到後請按「我已收款」',t.id);save();toast('已通知替身確認收款');
  },
  /* 登入第 1 步：輸入學校信箱（只要打學號，也接受貼上整個信箱） */
  loginEmail(f){
    const sid=v(f,'sid').toLowerCase().replace(MAIL_DOMAIN,'');
    if(!/^[a-z]\d{8}$/.test(sid))return ferr(f.elements.sid,'請輸入學號，例如 s15330124');
    ui.login={step:'code',sid:sid.toUpperCase(),email:sid+MAIL_DOMAIN};sendCode();
  },
  /* 登入第 2 步：輸入驗證碼 */
  loginCode(f){
    const L=ui.login,code=v(f,'code').replace(/\s/g,'');
    if(!L||!L.code)return toast('請重新寄送驗證碼');
    if(now()>L.sentAt+10*M)return ferr(f.elements.code,'驗證碼已過期，請按「重新寄送」');
    if(code!==L.code)return ferr(f.elements.code,'驗證碼不對，請再確認一次');
    const x=S.users.find(x=>x.email===L.email);
    if(x)return loginAs(x.id);
    L.step='profile';
  },
  /* 登入第 3 步（只有第一次）：填姓名和性別，學號從信箱來 */
  loginProfile(f){
    const L=ui.login,name=v(f,'name'),g=f.querySelector('input[name=gender]:checked');
    if(!name)return ferr(f.elements.name,'請填姓名');
    if(!g)return ferr(f.elements.gender,'請選擇性別');
    const x={id:nid('u'),name,sid:L.sid,email:L.email,gender:g.value,cls:v(f,'cls').toUpperCase(),bank:null};
    S.users.push(x);loginAs(x.id);
  },
  profile(f){
    const m=me(),name=v(f,'name'),g=f.querySelector('input[name=gender]:checked');
    if(!name)return ferr(f.elements.name,'請填姓名');
    if(!g||!g.value)return ferr(f.elements.gender,'請選擇性別');
    /* 姓名、性別 30 天內各只能改一次（第一次登入填的不算） */
    const nameNew=name!==m.name,genderNew=!!m.gender&&g.value!==m.gender;
    if(nameNew&&m.nameAt&&now()<m.nameAt+PROFILE_LOCK)return ferr(f.elements.name,'姓名 30 天內只能改一次，'+fmtTime(m.nameAt+PROFILE_LOCK)+' 之後才能再改');
    if(genderNew&&m.genderAt&&now()<m.genderAt+PROFILE_LOCK)return ferr(f.elements.gender,'性別 30 天內只能改一次，'+fmtTime(m.genderAt+PROFILE_LOCK)+' 之後才能再改');
    if(m.bank&&m.bank.name!==name)return ferr(f.elements.name,'姓名要和收款方式的戶名相同，請先到「收款方式」修改或移除');
    if(nameNew)m.nameAt=now();
    if(genderNew)m.genderAt=now();
    Object.assign(m,{name,gender:g.value,cls:v(f,'cls').toUpperCase()});
    save();toast('資料已更新');return goBack('#me');
  },
  bank(f){
    const m=me(),code=v(f,'code'),acct=v(f,'acct').replace(/[\s-]/g,''),bname=v(f,'bname');
    if(!code)return ferr(f.elements.code,'請選擇銀行');
    if(!/^\d{10,16}$/.test(acct))return ferr(f.elements.acct,'帳號請輸入 10 到 16 位數字');
    if(bname!==m.name)return ferr(f.elements.bname,'戶名必須和姓名「'+m.name+'」相同');
    const had=hasPay(m);m.bank={code,acct,name:bname};payReady(had);ui.payOpen=null;save();
    if(ui.payReturn){const id=ui.payReturn;ui.payReturn=null;toast('收款方式已儲存，現在可以出價了');return goBack('#task-'+id);}
    toast('收款方式已儲存');
  },
  filter(f){
    const fd=ui.fd||ui.f,from=fd.from,to=fd.to,tmin=fd.tmin,tmax=fd.tmax,pmin=v(f,'pmin'),pmax=v(f,'pmax');
    if(tmin!==''&&tmax!==''&&Number(tmax)<=Number(tmin))return ferr(f.querySelector('[data-w="tmax"]'),'最晚結束時間要晚於最早開工時間');
    if(from&&to&&to<from)return ferr(f.querySelector('[data-w="to"]'),'最晚日期不能早於最早日期');
    /* 標價區間：NT$ 1～5,000 的整數，或不填 */
    for(const k of ['pmin','pmax']){const x=k==='pmin'?pmin:pmax;if(x!==''&&!priceOk(Number(x)))return ferr(f.elements[k],'標價區間請填 NT$ 1 到 5,000 的整數，或不填');}
    if(pmin!==''&&pmax!==''&&Number(pmax)<Number(pmin))return ferr(f.elements.pmax,'最高標價不能低於最低標價');
    const genders=Array.from(f.querySelectorAll('input[name=g]:checked')).map(x=>x.value);
    if(!genders.length)return ferr(f.elements.g,'至少勾選一種替身性別');
    const days=Array.from(f.querySelectorAll('input[name=d]:checked')).map(x=>Number(x.value));
    ui.f={from,to,days,tmin,tmax,pmin,pmax,genders};ui.fd=null;ui.modal=null;
  },
  comment(f,d){
    const t=T(d.id),text=v(f,'text'),imgs=(ui.cimg[t.id]||[]).slice();
    if(!text&&!imgs.length)return ferr(f.elements.text,'請輸入留言或加上照片');
    if(CMT_OPEN.indexOf(t.status)<0)return toast('這個案件的留言板已經關閉');
    t.comments=t.comments||[];t.comments.push({id:nid('c'),user:S.me,text,imgs,at:now()});
    notifyCmt(S.me===t.poster?t.assignee:t.poster,t,me(),text,imgs.length);
    t.seen=t.seen||{};t.seen[S.me]=now();ui.cdraft[t.id]='';ui.cimg[t.id]=[];save();
  },
  /* 本體結束案件：替身未完成（必須寫原因、附至少 1 張照片） */
  notdone(f,d){
    const t=T(d.id),dr=ui.endDraft||{text:'',photos:[]},text=v(f,'text');
    if(!canEndNotDone(t))return toast('現在不能結束案件');
    if(!text)return ferr(f.elements.text,'請寫下原因');
    if(!dr.photos.length)return ferr(f.querySelector('#nd-f'),'請至少附上 1 張照片');
    t.status='cancelled';t.cancelKind='notdone';t.cancelAt=now();t.cancelReason='本體結束了案件：替身未完成';
    t.endNote={text,photos:dr.photos.slice(),at:now()};
    notify(t.assignee,'本體結束了案件，表示你未完成，請到案件裡查看原因',t.id);
    ui.modal=null;ui.endDraft=null;save();toast('已結束案件');
  },
  tag(f,d){
    const text=v(f,'text');if(!text)return ferr(f.elements.text,'請輸入自訂內容');
    setTagOf(d.uid,'custom',text);
    ui.tagMenu=null;ui.tagCustom=false;save();toast('已儲存標記');
  }
};

/* ---------- 照片 ---------- */
function dataBlob(src){
  const i=src.indexOf(','),head=src.slice(5,i),body=src.slice(i+1),mime=head.split(';')[0]||'application/octet-stream';
  if(/;base64$/.test(head)){const b=atob(body),a=new Uint8Array(b.length);for(let k=0;k<b.length;k++)a[k]=b.charCodeAt(k);return new Blob([a],{type:mime});}
  return new Blob([decodeURIComponent(body)],{type:mime});
}
function shrink(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{const max=640,s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');
      c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',0.7));};
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('bad image'));};
    img.src=url;
  });
}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(ui.tagMenu&&!e.target.closest('.tagwrap')){ui.tagMenu=null;ui.tagCustom=false;if(!el){render();return;}}
  if(ui.moreMenu&&!e.target.closest('.morewrap')){ui.moreMenu=false;if(!el){render();return;}}
  if(!el)return;
  const fn=A[el.dataset.act];if(!fn)return;
  if(el.dataset.act!=='scrim'&&el.dataset.act!=='dlgScrim')e.preventDefault();  /* 點在視窗背景上時不擋預設動作，視窗裡的 label 才點得到 */
  if(fn(el.dataset,el,e)!==false)render();
});
document.addEventListener('submit',e=>{
  const f=e.target;if(!f.dataset||!f.dataset.form)return;
  e.preventDefault();
  if(F[f.dataset.form](f,f.dataset)!==false)render();
});
document.addEventListener('input',e=>{
  clearErr(e.target);
  const el=e.target,pf=el.form&&el.form.dataset.form==='post';
  if(el.id==='m-cls'||el.id==='lp-cls'){const p=el.selectionStart,up=el.value.toUpperCase();if(up!==el.value){el.value=up;try{el.setSelectionRange(p,p);}catch(x){}}return;}
  if(el.id==='cmt-in'&&el.form){ui.cdraft[el.form.dataset.id]=el.value;return;}
  if(el.id==='nd-text'&&ui.endDraft){ui.endDraft.text=el.value;return;}
  if(el.id==='lg-code'&&el.form&&el.value.replace(/\D/g,'').length===6){if(el.form.requestSubmit)el.form.requestSubmit();else el.form.dispatchEvent(new Event('submit',{cancelable:true,bubbles:true}));return;}
  if(el.form&&el.form.dataset.form==='filter'&&ui.fd){if(el.name==='pmin'||el.name==='pmax')ui.fd[el.name]=el.value;if(el.name==='g')ui.fd.genders=Array.from(el.form.querySelectorAll('input[name=g]:checked')).map(x=>x.value);if(el.name==='d')ui.fd.days=Array.from(el.form.querySelectorAll('input[name=d]:checked')).map(x=>Number(x.value));return;}
  if(pf&&['building','meet','budget','note','gender'].indexOf(el.name)>=0){ui.pf[el.name]=el.value;saveDraft();return;}
  if(el.id!=='q')return;
  ui.q=el.value;const box=document.getElementById('blist');if(box){box.innerHTML=browseList();fixNotes();}
});
window.addEventListener('resize',()=>fixNotes());
document.addEventListener('change',async e=>{
  const el=e.target;
  if(el.form&&el.form.dataset.form==='post'&&el.name==='gender'){ui.pf.gender=el.value;return;}
  if(!el.dataset||!el.dataset.upload)return;
  const files=Array.from(el.files||[]),kind=el.dataset.upload,id=el.dataset.id;if(!files.length)return;
  const out=[];let bad=0;
  for(const file of files){try{out.push(await shrink(file));}catch(err){bad++;}}
  /* 打掃證明直接存進案件；留言照片和結束案件的照片先放草稿，按送出才存 */
  if(kind==='linepay'){if(!out.length)return toast('讀不到這張圖片');const had=hasPay(me());me().linepay={qr:out[0],at:now()};payReady(had);ui.payOpen=null;save();
    if(ui.payReturn){const rid=ui.payReturn;ui.payReturn=null;toast('收款方式已儲存，現在可以出價了');goBack('#task-'+rid);render();return;}
    render();toast('已儲存 LINE Pay 收款碼');return;}
  /* 照片張數上限：打掃證明、留言照片每個案件各 12 張，結束案件的照片證明 6 張 */
  let cut=false;
  if(kind==='cimg'){const t=T(id),used=(t.comments||[]).reduce((a,c)=>a+((c.imgs||[]).length),0)+(ui.cimg[id]||[]).length,room=Math.max(0,PH_MAX-used);cut=out.length>room;ui.cimg[id]=(ui.cimg[id]||[]).concat(out.slice(0,room));render();if(cut)toast('留言照片每個案件最多 '+PH_MAX+' 張');}
  else if(kind==='endnote'){if(ui.endDraft){const room=Math.max(0,END_MAX-ui.endDraft.photos.length);cut=out.length>room;ui.endDraft.photos=ui.endDraft.photos.concat(out.slice(0,room));}renderModal();if(cut)toast('照片證明最多 '+END_MAX+' 張');}
  else{const t=T(id),room=Math.max(0,PH_MAX-t.photos.length);cut=out.length>room;out.slice(0,room).forEach(src=>t.photos.push({src,at:now()}));save();render();if(cut)toast('打掃證明最多 '+PH_MAX+' 張');else if(!bad)toast('已上傳 '+Math.min(out.length,room)+' 張');}
  if(bad)toast('有 '+bad+' 張讀不到');
});
document.addEventListener('pointerdown',e=>{const d=e.target.closest&&e.target.closest('.dial');if(!d)return;ui.drag=true;e.preventDefault();try{d.setPointerCapture(e.pointerId);}catch(x){}dialSet(e);});

navStack=[curHash()];applied=curHash();applyRoute();
if(S.me)ui.pf=loadDraft(S.me)||ui.pf;
if(!introSeen()){ui.modal={type:'intro',step:0};markIntro();}
render();
