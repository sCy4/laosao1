<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>替身掃者</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* 主要色票、字型在最後「方案 K」那一段（Material Design 3）；這裡只放那一段沒有蓋過的 */
  --good:#146c2e; --good-soft:#d4f5d9; --bad:#ba1a1a; --bad-soft:#ffdad6; --info:#00639c; --info-soft:#d9e2ff;
  --line-green:#06c755;
  --font-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light; /* 全站一律淺色模式，不跟著手機的深色設定 */
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
#app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-size:22px;font-weight:700}
h2{font-size:16px;font-weight:700}
h3{font-size:14px;font-weight:700;color:var(--muted);margin-top:8px}
p{margin:0}
.small{font-size:14px}
.muted{color:var(--muted)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.center{text-align:center}
.grow{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:8px}
.row.between{justify-content:space-between}
.row.end{justify-content:flex-end}
.row.wrap{flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-s{display:flex;flex-direction:column;gap:8px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0)}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;min-height:61px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{font-family:var(--font-display);font-size:22px;font-weight:700;color:var(--accent);letter-spacing:.06em;line-height:1.2}
.brand.big{font-size:44px}
.clock{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
/* 標題欄固定一排，不換行 */
.hd-brand{flex:1;min-width:0;white-space:nowrap}
.hd-brand .brand,.hd-brand .clock{overflow:hidden;text-overflow:ellipsis}
.hd-act{flex:none;display:flex;align-items:center;gap:8px}
.demo-entry{margin-top:auto;padding-top:16px;border-top:1px dashed var(--line);display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.clock .sim{display:inline-block;margin-right:4px;padding:0 5px;border-radius:4px;background:var(--sun-soft);color:var(--warn);font-weight:700}
@media (max-width:360px){header.top{padding:10px 12px;gap:6px}header.top .icon-btn{width:36px;height:36px}.hd-act{gap:4px}.hd-brand .brand{font-size:20px}}
.acct{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 4px;font:inherit;font-size:14px;color:var(--ink);cursor:pointer;min-height:40px}

main{flex:1;padding:16px 16px 104px;display:flex;flex-direction:column;gap:12px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}

nav.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:grid;background:var(--surface);border-top:1px solid var(--line);z-index:6;padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs.n3{grid-template-columns:repeat(3,1fr)}
nav.tabs.n2{grid-template-columns:repeat(2,1fr)}
nav.tabs button{position:relative;appearance:none;background:none;border:0;font:inherit;font-size:12px;color:var(--muted);padding:9px 0 12px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;min-height:56px}
nav.tabs button.on{color:var(--accent);font-weight:700}
nav.tabs button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--alert);color:#fff;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}
nav.tabs .badge{position:absolute;top:4px;left:calc(50% + 8px)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card.task{appearance:none;text-align:left;width:100%;font:inherit;color:inherit;cursor:pointer;gap:4px}
.card.task{padding:0;gap:0;overflow:visible;position:relative}
.nbadge{position:absolute;top:-8px;right:-8px;z-index:3;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--alert);color:#fff;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;border:2px solid var(--bg);font-variant-numeric:tabular-nums;pointer-events:none}
.tc-open{position:absolute;inset:0;z-index:1;width:100%;border:0;background:transparent;cursor:pointer;border-radius:14px;padding:0}
.tc-open:focus-visible{outline:3px solid var(--sun);outline-offset:-3px}
.tc-body{display:flex;flex-direction:column;gap:4px;padding:14px}
.tc-row{display:flex;gap:12px;align-items:flex-end}
.tc-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.tc-g{display:flex;align-items:center;min-height:22px}
.tc-more{position:relative;z-index:2;flex:none;appearance:none;border:0;background:none;color:var(--accent);font:inherit;font-size:13px;font-weight:700;padding:0 2px;cursor:pointer;min-height:24px}
.tc-side{flex:none;display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;gap:8px;text-align:right}
.tc-bottom{margin-top:auto;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.tc-bar{border-radius:13px 13px 0 0}
.tc-bar.bottom{border-radius:0 0 13px 13px}
.tc-date{font-size:17px;font-weight:700;padding-right:36px;display:flex;flex-wrap:wrap;column-gap:12px;row-gap:2px;align-items:baseline}
.tc-date .tc-time{font-size:16px;font-weight:700}
.gtxt{display:inline-flex;align-items:center;font-size:13px;font-weight:700;border-radius:6px;padding:1px 8px}
.gtxt.male{color:#2563c9;background:#e1ebfb}
.gtxt.female{color:#d0384f;background:#fbe3e7}
.idblock{display:flex;flex-direction:column;gap:2px;min-width:0}
.id-name{font-size:16px}
.idblock.big .id-name{font-size:20px}
.idline{display:flex;flex-wrap:wrap;gap:2px 6px;font-size:14px;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.idblock.big .idline{font-size:15px}
#m-cls{text-transform:uppercase}
.tc-time{font-size:15px;font-variant-numeric:tabular-nums}
.tc-place{font-size:15px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.checks label.gm{color:#2563c9}
.checks label.gf{color:#d0384f}
.checks label svg{display:block}
.when{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.cal{border:1px solid var(--line);border-radius:12px;padding:10px}
.tagwrap{position:relative;display:inline-flex}
.tagbtn{appearance:none;display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:4px 8px;min-height:34px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;max-width:180px}
.tagbtn .tg-lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tagbtn.tg-trust{color:var(--good);border-color:var(--good);background:var(--good-soft)}
.tagbtn.tg-black{color:var(--bad);border-color:var(--bad);background:var(--bad-soft)}
.tagbtn.tg-custom{color:var(--info);border-color:var(--info);background:var(--info-soft)}
.tagbtn:not(.tg-none) svg path{fill:currentColor}
.tagmenu{position:absolute;right:0;top:calc(100% + 6px);z-index:8;min-width:200px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:6px;display:flex;flex-direction:column}
.tagmenu>button{appearance:none;border:0;background:none;color:var(--ink);font:inherit;font-size:14px;text-align:left;padding:10px;border-radius:8px;display:flex;align-items:center;gap:8px;cursor:pointer}
.tagmenu>button:hover{background:var(--bg)}
.tm-dot{width:10px;height:10px;border-radius:50%;flex:none}
.tm-dot.trust{background:var(--good)}.tm-dot.black{background:var(--bad)}.tm-dot.custom{background:var(--info)}
.tm-check{margin-left:auto;color:var(--accent);font-weight:700}
.tm-remove{color:var(--bad)!important;border-top:1px solid var(--line)!important;border-radius:0 0 8px 8px!important}
.tm-custom{display:flex;gap:6px;padding:6px}
.tm-custom input{min-height:36px;padding:6px 10px}
/* 資訊卡裡的標記：平常一個低調的「標記」，按了才出現說明和選項 */
.tagline{margin-top:8px}
.tagline .tagwrap{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;font-size:14px}
.taglink{appearance:none;border:0;background:none;padding:6px 0;font:inherit;font-size:14px;font-weight:700;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.tagline .tagmenu{position:static;flex-basis:100%;max-width:340px;margin-top:2px;box-shadow:none}  /* 在原位往下展開，不浮在別的內容上 */
.tm-note{margin:0;padding:6px 10px 8px;line-height:1.5;border-bottom:1px solid var(--line)}
.tagmenu{scroll-margin:80px 0 96px}
.card.mini{overflow:visible}
.tc-side .price{font-size:21px;line-height:1.2}
.pc-row{font-size:15px}
.pc-row .price{font-size:16px}
.pc-label{text-align:center;font-size:13px;color:var(--muted)}
.pc-input{display:flex;align-items:center;justify-content:center;gap:8px;font-size:22px;font-weight:700;color:var(--muted)}
.pc-input input{width:150px;text-align:center;font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;padding:8px 10px;min-height:52px}
.banner.center{text-align:center}
.optlist{display:flex;flex-direction:column;gap:6px}
.opt-row{appearance:none;display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:15px;text-align:left;padding:12px 14px;border-radius:12px;cursor:pointer;min-height:48px}
.opt-row.on{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.tc-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 14px;font-size:13px;font-weight:700;border:0;border-radius:0}
.tc-bar.bottom{background:var(--bg);color:var(--muted);border-top:1px solid var(--line)}
.tc-bar.bottom.todo{background:var(--alert-soft);color:var(--alert-ink);border-top-color:transparent}
.tc-dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--alert)}
.tc-bar .grow{min-width:0}
.card.mini{padding:12px 14px;gap:4px}
.mini-role{font-size:13px;font-weight:700;color:var(--accent)}
.range{display:flex;align-items:center;gap:8px}
.range input{flex:1;min-width:0}
.range span{color:var(--muted);font-size:14px}
.card.task:hover{border-color:var(--accent)}
.card.task .grow{display:flex;flex-direction:column;gap:2px}
.card.task .time{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.chev{flex:none;font-size:22px;color:var(--muted)}
.idline .dot{color:var(--line);font-weight:700;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.dt-btn{appearance:none;display:flex;align-items:center;gap:10px;width:100%;min-height:48px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;border-radius:10px;padding:8px 12px;cursor:pointer;text-align:left}
.dt-btn svg{color:var(--accent);flex:none}
.dt-btn:hover{border-color:var(--accent)}
.scrim.center{align-items:center;padding:16px}
.sheet.dlg{max-width:360px;border-radius:24px;padding:20px 18px 14px;gap:10px}
.dlg-title{font-size:14px;color:var(--muted)}
.dlg-big{font-size:28px;font-weight:500;font-variant-numeric:tabular-nums}
.dlg-month{font-size:14px}
.icon-btn{appearance:none;border:0;background:transparent;color:var(--ink);width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer}
.icon-btn:hover:not(:disabled){background:var(--bg)}
.icon-btn:disabled{opacity:.3;cursor:not-allowed}
.dd-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.dd-wd{font-size:13px;color:var(--muted);padding:6px 0}
.dd{appearance:none;border:1px solid transparent;background:transparent;color:var(--ink);font:inherit;font-size:15px;font-variant-numeric:tabular-nums;width:40px;height:40px;margin:0 auto;border-radius:50%;cursor:pointer}
.dd:hover:not(:disabled){background:var(--bg)}
.dd.today{border-color:var(--accent);color:var(--accent)}
.dd.on,.dd.on:hover:not(:disabled){background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.dd:disabled{color:var(--line);cursor:not-allowed}
.dlg-input{font-size:20px;text-align:center;font-variant-numeric:tabular-nums}
.dlg-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:4px}
.tbig{display:flex;align-items:center;justify-content:center;gap:8px}
.tbox{appearance:none;border:0;width:88px;height:72px;border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;font-size:44px;font-variant-numeric:tabular-nums;cursor:pointer}
.tbox.on{background:var(--accent-soft);color:var(--accent)}
.tcolon{font-size:40px;font-weight:700}
.tbig-in{display:flex;flex-direction:column;align-items:center;gap:2px}
.tbig-in input{width:88px;height:72px;font-size:40px;text-align:center;font-variant-numeric:tabular-nums;border-radius:12px}
.dial{position:relative;width:240px;height:240px;border-radius:50%;background:var(--bg);margin:8px auto 0;touch-action:none;cursor:pointer;user-select:none;-webkit-user-select:none}
.dial-n{position:absolute;transform:translate(-50%,-50%);font-size:15px;font-variant-numeric:tabular-nums;pointer-events:none;color:var(--ink)}
.dial-n.on{visibility:hidden}
.dial-n.in{font-size:13px;color:var(--muted)}
.dial-hand{position:absolute;left:119px;top:28px;width:2px;height:92px;background:var(--accent);transform-origin:50% 100%;pointer-events:none}
.dial-knob{position:absolute;transform:translate(-50%,-50%);width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;pointer-events:none}
.dial-knob.in{width:34px;height:34px;font-size:14px}
.dial-c{position:absolute;left:116px;top:116px;width:8px;height:8px;border-radius:50%;background:var(--accent);pointer-events:none}
.chosen{display:flex;flex-direction:column;gap:8px;background:var(--bg);border-radius:12px;padding:12px}
.bell{position:relative;flex:none}
.nbadge.hdr{top:-2px;right:-4px;border-color:var(--surface)}
.notes{display:flex;flex-direction:column;gap:6px}
.note{appearance:none;display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;border-radius:12px;padding:10px 12px;cursor:pointer}
.note.new{border-color:var(--alert)}
.note.new .note-txt::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--alert);margin-right:6px;vertical-align:middle}
.note-txt{font-size:14px}
.note-time{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.paysteps .late{color:var(--warn);font-weight:500}
.paysteps{display:flex;flex-direction:column;gap:2px;margin-top:4px;font-size:14px}
.paysteps .ok{color:var(--good);font-weight:700}
.pill.s-ownt{background:var(--accent-soft);color:var(--accent)}
.cmts{display:flex;flex-direction:column;gap:8px;max-height:320px;overflow-y:auto;padding:2px}
.cmt{max-width:85%;align-self:flex-start;background:var(--bg);border-radius:12px 12px 12px 4px;padding:8px 12px}
.cmt.mine{align-self:flex-end;background:var(--accent-soft);border-radius:12px 12px 4px 12px}
.cmt-meta{font-size:12px;color:var(--muted)}
.cmt-txt{font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.cmt-form{display:flex;gap:8px;align-items:flex-end}
.cmt-form textarea{flex:1;min-height:44px}
#m-sid{text-transform:uppercase}
.pill.s-bid{background:var(--sun);color:#2b1d00}
.gtag.own{color:var(--accent);background:var(--accent-soft)}
.card.linkrow{appearance:none;font:inherit;color:inherit;text-align:left;width:100%;flex-direction:row;align-items:center;cursor:pointer}
.card.linkrow .grow{display:flex;flex-direction:column;gap:2px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.gtag.any{color:var(--muted);background:var(--bg)}
.gtag{display:inline-flex;align-items:center;font-size:12px;font-weight:700;color:var(--info);background:var(--info-soft);border-radius:6px;padding:1px 7px}
.price{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}

.pill{display:inline-flex;align-items:center;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.s-open{background:var(--accent-soft);color:var(--accent)}
.s-assigned{background:var(--info-soft);color:var(--info)}
.s-wait{background:var(--sun-soft);color:var(--warn)}
.s-good{background:var(--good-soft);color:var(--good)}
.s-off{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.s-bad{background:var(--bad-soft);color:var(--bad)}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{appearance:none;font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.btn{appearance:none;border:1px solid transparent;border-radius:10px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer;background:var(--accent);color:var(--accent-ink);min-height:44px}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
.btn.block{width:100%}
.btn.ghost{background:transparent;color:var(--accent);border-color:var(--line)}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--line)}
.btn.danger-solid{background:var(--bad);color:#fff}
.btn:disabled{opacity:.42;cursor:not-allowed}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

.field{display:flex;flex-direction:column;gap:6px}
.mail-in{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding-right:12px}
.mail-in input{border:0;flex:1;min-width:0;background:transparent}
.mail-in input:focus{outline:none}
.mail-in:focus-within{outline:3px solid var(--sun);outline-offset:1px}
.mail-in span{color:var(--muted);flex:none}
.code-in{font-size:24px;letter-spacing:.3em;text-align:center;font-variant-numeric:tabular-nums}
.ferr{margin:2px 0 0;color:var(--bad);font-size:13px;font-weight:700}
[aria-invalid="true"]{border-color:var(--bad)}
.field label,.field .lbl{font-size:14px;color:var(--muted);font-weight:500}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-height:44px}
textarea{resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;color:var(--ink)}
.checks input{width:auto;min-height:0;accent-color:var(--accent)}
.checks label:has(input:checked){background:var(--accent-soft);border-color:var(--accent)}

.banner{border-radius:12px;padding:10px 12px;font-size:14px;background:var(--bg);border:1px solid var(--line)}
.banner.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.banner.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}

.steps li:first-child::before{display:none}
.steps .dot{width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--line);z-index:1}

.offer .btn{align-self:flex-start}

.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ph{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--bg)}

.ph-x{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:16px;cursor:pointer}
.ph.add{display:flex;align-items:center;justify-content:center;border:2px dashed var(--line);color:var(--accent);font-weight:700;font-size:14px;cursor:pointer;background:transparent}
.big-photo{width:100%;border-radius:12px;display:block}

.bank{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:var(--bg);border-radius:12px;padding:12px}

.acc > .acc-h ~ .acc-h,.acc > .acc-b ~ .acc-h{border-top:1px solid var(--line)}
.acc-t{flex:1;font-size:16px;font-weight:700}

.acc-b{padding:0 14px 16px}
.pay-acc{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.pway + .pway{border-top:1px solid var(--line)}
.pway .acc-h{color:var(--ink);margin:0}
.pway-b{display:none}
.pway input:checked ~ .pway-b{display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.pway-b .bank,.pway-b .field{align-self:stretch}
.pway input:checked + .acc-h .chev{transform:rotate(90deg)}
.pway input:focus-visible + .acc-h{outline:3px solid var(--sun);outline-offset:-3px}
.radio-dot{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--line);background:var(--surface)}
.pway input:checked + .acc-h .radio-dot{border-color:var(--accent);background:var(--accent);box-shadow:inset 0 0 0 3px var(--surface)}
.offer-row{align-items:flex-start}
.offer-side{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:8px}

.profile-form{border-top:1px solid var(--line);padding-top:12px}
.req,.opt{font-size:11px;font-weight:700;border-radius:4px;padding:0 4px;margin-left:2px}
.req{color:var(--bad);background:var(--bad-soft)}
.opt{color:var(--muted);background:var(--bg)}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{appearance:none;border:0;background:transparent;font:inherit;font-size:14px;color:var(--muted);border-radius:9px;padding:8px 4px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px}

.empty{text-align:center;padding:32px 16px;display:flex;flex-direction:column;gap:6px;color:var(--muted)}

.lead{font-size:18px}
.intro{display:flex;flex-direction:column;gap:16px;min-height:280px}
.intro-hero{text-align:center;padding:16px 0 4px;display:flex;flex-direction:column;gap:6px}
.intro-roles{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;margin:0;font-size:16px}

.intro-list{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:10px;font-size:15px}

.scrim{position:fixed;inset:0;background:rgba(8,20,17,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}

.sheet{background:var(--surface);width:100%;max-width:480px;max-height:88%;overflow:auto;border-radius:18px 18px 0 0;padding:20px 16px 24px;display:flex;flex-direction:column;gap:12px}
.acct-list{display:flex;flex-direction:column;gap:6px}
.acct-row{appearance:none;font:inherit;color:inherit;text-align:left;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer}

.sum{gap:12px}

.card.next.act{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}

.trouble{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:4px}

.trouble[open] summary{color:var(--ink)}
.trouble p{max-width:30em}
.endnote-photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.cmt-imgs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}

.link-btn{appearance:none;border:0;background:none;color:var(--accent);font:inherit;font-size:13px;font-weight:700;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

.exit{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;padding:4px 0 8px}
.btn.quiet{background:transparent;border-color:transparent;color:var(--bad);font-weight:500;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.toolbar{display:flex;align-items:center;gap:8px}
.toolbar .search{flex:1;min-width:0}
.tool{position:relative;flex:none;width:46px;height:46px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--accent)}
.tool:hover{border-color:var(--accent)}

/* ---------- 字與基本元素 ---------- */
body{background:var(--md-surface);color:var(--md-on-surface);font-size:16px;line-height:1.5}
p,dd,li,.cmt-txt{text-wrap:pretty}
h1{font-size:24px;line-height:32px;font-weight:500}
h2{font-size:22px;line-height:28px;font-weight:500}
h3{margin-top:8px;font-size:14px;line-height:20px;font-weight:500;letter-spacing:.1px;color:var(--md-on-surface-variant)}
.small{font-size:14px;line-height:20px;letter-spacing:.25px}
.muted{color:var(--md-on-surface-variant)}
.badge{font-size:12px}
.price{font-weight:500;font-variant-numeric:tabular-nums}
.cur{font-size:max(13px,.6em);font-weight:500;letter-spacing:.5px;color:var(--md-on-surface-variant);margin-right:1px}
p .cur,.banner .cur{font-size:inherit;color:inherit;letter-spacing:0}
:focus-visible{outline:3px solid var(--md-secondary);outline-offset:2px}
.idline .dot{color:var(--md-outline)}
.link-btn,.tc-more{color:var(--md-primary);font-weight:500;text-decoration:none}
.link-btn{min-height:40px;padding:0 4px;font-size:14px}

/* ---------- 圖示 ---------- */
.i-f{display:none}
nav.tabs button.on .i-o,.moremenu>button.on .i-o{display:none}
nav.tabs button.on .i-f,.moremenu>button.on .i-f{display:inline}
.tc-tab::before,.sum-role::before,.seg button.on::before,.checks label:has(input:checked)::before,.chip.on::before,
main>h1.vh+p.small::before,.trouble summary::after,.intro-roles dt::before{
  content:"";flex:none;width:24px;height:24px;background:currentColor;-webkit-mask:var(--ic) center/contain no-repeat;mask:var(--ic) center/contain no-repeat}

/* ---------- 互動：狀態層、水波紋（程式在 pointerdown 時加進按鈕裡） ---------- */
.k-ripple{position:absolute;border-radius:50%;background:currentColor;pointer-events:none;transform:scale(0);opacity:.12;animation:kRipple .55s var(--md-ease-decel) forwards}
@keyframes kRipple{65%{transform:scale(1);opacity:.12}100%{transform:scale(1);opacity:0}}
.seg button,.btn,.note,.acct-row,.card.linkrow,.opt-row,.acc-h,.moremenu>button,.chip,.checks label,.tagmenu>button{position:relative;overflow:hidden}
.icon-btn,.tool,.dd{position:relative}
.icon-btn,.tool,.dd{border-radius:50%;transition:background-color .15s linear}
@media (hover:hover){
  .icon-btn:hover:not(:disabled),.tool:hover,.dd:hover:not(:disabled):not(.on){background:var(--st-hover)}
  .note:hover,.acct-row:hover,.card.linkrow:hover,.opt-row:hover,.acc-h:hover,.moremenu>button:hover,.tagmenu>button:hover,.chip:hover,.checks label:hover,.seg button:hover{background-image:linear-gradient(var(--st-hover),var(--st-hover))}
}

/* ---------- 上方應用程式列（small top app bar）：往下捲時換成 surface-container 色 ---------- */
body::before{background:var(--md-surface)}
header.top{min-height:64px;padding:8px 16px;gap:4px;background:var(--md-surface);border-bottom:0;box-shadow:none;transition:background-color .2s var(--md-ease)}
header.top.scrolled{background:var(--md-surface-container)}
body:has(header.top.scrolled)::before{background:var(--md-surface-container)}
.brand,.hd-brand .brand{font-family:var(--font-display);font-size:22px;line-height:28px;font-weight:500;letter-spacing:0;color:var(--md-on-surface)}
.clock{font-size:12px;line-height:16px;letter-spacing:.4px;color:var(--md-on-surface-variant)}
.clock .sim{border-radius:4px;background:var(--md-tertiary-container);color:var(--md-on-tertiary-container);font-weight:500}
@media (max-width:360px){header.top{padding:8px 16px 8px 12px}.hd-brand .brand{font-size:20px}header.top .icon-btn{width:40px;height:40px}}
.icon-btn{width:40px;height:40px;color:var(--md-on-surface-variant)}
header.top .icon-btn{color:var(--md-on-surface-variant)}
.hd-act .bell{margin-right:-4px}  /* 鈴鐺、登入和下面卡片的右邊對齊（原本太靠右） */
.nbadge.hdr{top:6px;right:auto;left:21px;min-width:16px;height:16px;padding:0 4px;border:0;border-radius:8px;font-size:12px;line-height:16px}
header.top.sub{justify-content:flex-start;padding:8px 4px}
@media (max-width:360px){header.top.sub{padding:8px 4px}}
/* 發案畫面（M3 full-screen dialog）：左上 ✕、標題「發案」，沒有下方分頁 */
.hd-title{margin-left:4px;font-size:22px;line-height:28px;font-weight:400;color:var(--md-on-surface)}
main.full{padding-bottom:32px;position:relative;z-index:1;background:var(--md-surface);min-height:calc(100vh - 64px)}
.k-ghost{position:fixed;inset:0;overflow:hidden;pointer-events:none;background:var(--md-surface)}
.k-ghost.under{z-index:0}
.k-ghost.over{z-index:19;animation:kSlideDown .25s var(--md-ease-accel,cubic-bezier(.3,0,.8,.15)) forwards}
.k-ghost-app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header.top.full.slide-up,main.full.slide-up{animation:kSlideUp .3s var(--md-ease-decel) backwards}
@keyframes kSlideUp{from{transform:translateY(100vh)}}
@keyframes kSlideDown{to{transform:translateY(100vh)}}
@media (prefers-reduced-motion:reduce){header.top.full.slide-up,main.full.slide-up,.k-ghost.over{animation:none}}
/* 發案按鈕（M3 extended FAB）：右下角、下方分頁上面；對齊 480px 欄位的右邊 */
.fab{position:fixed;z-index:7;right:max(16px,calc(50vw - 224px));bottom:calc(96px + env(safe-area-inset-bottom,0px));overflow:hidden;display:inline-flex;align-items:center;gap:12px;height:56px;padding:0 20px 0 16px;border:0;border-radius:16px;
  background:var(--md-primary-container);color:var(--md-on-primary-container);font:inherit;font-size:14px;line-height:20px;font-weight:500;letter-spacing:.1px;box-shadow:var(--md-elev-3);cursor:pointer}
@media (hover:hover){.fab:hover{background-image:linear-gradient(var(--st-p-hover),var(--st-p-hover))}}
.fab:focus-visible{outline:3px solid var(--md-secondary);outline-offset:2px}
.fab svg{flex:none}
.fab span{max-width:4em;overflow:hidden;white-space:nowrap;transition:max-width .2s var(--md-ease),opacity .15s linear}
.fab.mini{gap:0;padding:0 16px}
.fab.mini span{max-width:0;opacity:0}
@media (prefers-reduced-motion:reduce){.fab span{transition:none}}
main.has-fab{padding-bottom:176px}  /* 最下面的卡片和示範工具不會被發案按鈕蓋住 */
/* 案件詳情的「⋮」選單（M3 menu） */
.morewrap{position:relative;flex:none}
.moremenu{position:absolute;right:4px;top:calc(100% + 2px);z-index:8;min-width:168px;display:flex;flex-direction:column;padding:8px 0;border-radius:4px;background:var(--md-surface-container);box-shadow:var(--md-elev-2);animation:kMenu .15s var(--md-ease-decel)}
@keyframes kMenu{from{opacity:0;transform:scaleY(.8);transform-origin:top}}
.moremenu>button{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 16px 0 12px;border:0;background:none;font:inherit;font-size:14px;line-height:20px;font-weight:500;color:var(--md-on-surface);text-align:left;cursor:pointer}
.moremenu>button svg{color:var(--md-on-surface-variant)}
.moremenu>button.on svg{color:var(--md-primary)}

/* ---------- 下方導覽列（navigation bar）：圖示在 64×32 的膠囊裡，選中的分頁膠囊有底色、圖示換成實心 ---------- */
nav.tabs{background:var(--md-surface-container);border-top:0;box-shadow:none}
nav.tabs button{min-height:80px;padding:12px 0 16px;gap:4px;justify-content:flex-start;font-size:12px;line-height:16px;font-weight:500;letter-spacing:.5px;color:var(--md-on-surface-variant)}
nav.tabs button::before,nav.tabs button.on::before{content:"";display:block;position:static;flex:none;width:64px;height:32px;border-radius:16px;background-color:transparent;transition:background-color .2s var(--md-ease)}
nav.tabs button.on::before{background-color:var(--md-secondary-container)}
nav.tabs svg{position:absolute;top:16px;left:50%;margin-left:-12px}
nav.tabs button.on{color:var(--md-on-surface);font-weight:700}
nav.tabs button.on svg{color:var(--md-on-secondary-container)}
@media (hover:hover){nav.tabs button:hover::before{background-image:linear-gradient(var(--st-hover),var(--st-hover))}}
nav.tabs button:active::before{background-image:linear-gradient(var(--st-press),var(--st-press))}  /* 底部分頁沒有水波紋，按下時膠囊變深 */
nav.tabs button.on.k-in::before{animation:kPill .3s var(--md-ease) both}  /* 換到這個分頁時，膠囊從中間展開 */
@keyframes kPill{from{transform:scaleX(.35);opacity:.2}}
nav.tabs .badge{top:12px;left:calc(50% + 4px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;font-size:12px;line-height:16px;font-weight:500;letter-spacing:0}

/* ---------- 版面 ---------- */
main{padding-top:8px;gap:12px}
.sec-head{margin-top:4px}
.sec-head h1{font-size:24px;line-height:32px}
.grp{gap:12px}
.grp-h{margin:16px 0 0;font-size:22px;line-height:28px;font-weight:500;letter-spacing:0;color:var(--md-on-surface)}
section[aria-label="待你處理"]>.grp-h{margin-top:8px}
.grp-h .badge{display:none}
.grp-h.sub{margin:8px 0 -4px;font-size:14px;line-height:20px;font-weight:500;letter-spacing:.1px;color:var(--md-primary)}
/* 我的案件：沒有待辦時的一句話放在淺色容器裡，前面一個打勾圖示 */
main>h1.vh+p.small.muted{display:flex;align-items:center;gap:12px;margin-top:8px;padding:12px 16px;border-radius:12px;background:var(--md-surface-container-low);color:var(--md-on-surface-variant)}
main>h1.vh+p.small::before{--ic:var(--ic-checkCircle);color:var(--md-primary)}
.empty{gap:8px;padding:32px 16px;color:var(--md-on-surface-variant);font-size:14px;line-height:20px}
.empty b{font-size:16px;line-height:24px;font-weight:500;color:var(--md-on-surface)}
.empty .btn{align-self:center;margin-top:8px}
.demo-entry{border-top:1px dashed var(--md-outline-variant)}
.demo-entry .btn.ghost{border-color:var(--md-outline-variant);color:var(--md-on-surface-variant)}  /* 示範工具不是正式功能，按鈕灰一點，不和正式按鈕搶 */

/* ---------- 分段按鈕（segmented button）：「我是替身／我是本體」「已完成／已取消」，以及性別等單選（.checks） ---------- */
.seg,.checks{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;height:40px;padding:0;gap:0;background:transparent;border:1px solid var(--md-outline);border-radius:20px;overflow:hidden;box-shadow:none}
.seg button,.checks label{display:flex;align-items:center;justify-content:center;min-height:0;height:100%;margin:0;padding:0 12px;gap:8px;border:0;border-radius:0;background:transparent;
  font-size:14px;line-height:20px;font-weight:500;letter-spacing:.1px;color:var(--md-on-surface);white-space:nowrap;cursor:pointer}
.seg button+button,.checks label+label{border-left:1px solid var(--md-outline)}
.seg button.on,.checks label:has(input:checked){background:var(--md-secondary-container);color:var(--md-on-secondary-container)}
.seg button.on::before,.checks label:has(input:checked)::before{width:18px;height:18px;--ic:var(--ic-check)}
.seg button .muted{color:inherit;font-weight:400}
.checks label.gm,.checks label.gf{color:var(--md-on-surface)}
.checks input{position:absolute;opacity:0;width:1px;height:1px;margin:0;pointer-events:none}
.checks label:has(input:focus-visible){outline:3px solid var(--md-secondary);outline-offset:-3px}
.seg button.on.k-in::before{animation:kCheck .25s var(--md-ease) both}  /* 切換時勾勾長出來 */
@keyframes kCheck{from{width:0;margin-right:-8px;opacity:0}}
/* 篩選晶片（filter chip）：過去的案件「全部／我是替身／我是本體」 */
.chips{gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 16px;border:1px solid var(--md-outline-variant);border-radius:8px;background:transparent;font-size:14px;line-height:20px;font-weight:500;color:var(--md-on-surface-variant)}
.chip.on{padding-left:8px;border-color:transparent;background:var(--md-secondary-container);color:var(--md-on-secondary-container)}
.chip.on::before{width:18px;height:18px;--ic:var(--ic-check)}
.checks.days{display:flex;height:auto;gap:4px;border:0;border-radius:0;overflow:visible}
.checks.days label,.checks.days label+label{flex:1 1 0;max-width:40px;height:40px;padding:0;border:1px solid var(--md-outline-variant);border-radius:50%;justify-content:center;font-size:14px}
.checks.days label:has(input:checked){background:var(--md-primary);border-color:var(--md-primary);color:var(--md-on-primary)}
.checks.days label:has(input:checked)::before{display:none}

/* ---------- 卡片 ---------- */
.card{background:var(--md-surface-container-lowest);border:1px solid var(--md-outline-variant);border-radius:12px;padding:16px;gap:12px;box-shadow:none}
.card.linkrow,.card.me-card,.card.rules{border:0}  /* 「我的」的設定清單維持淺灰填色 */
.card h2{font-size:22px;line-height:28px}

/* 案件卡片（outlined card）：第一排「11月23日（一）  14:00 至 16:00」（日期固定寬度，卡片疊起來時日期和時間各自對齊在同一條直線上），
   第二排地點、限男／限女，標價在右邊；替身確認後多一行「本體 王小明」；底部是狀態列。身分標籤在右上角、壓在外框上緣 */
.card.task{display:flex;flex-direction:column;padding:14px 16px 12px;margin:0;
  background:var(--md-surface-container-lowest);border:1px solid var(--md-outline-variant);border-radius:12px;box-shadow:none;transition:box-shadow .2s var(--md-ease)}
.card.task+.card.task:is(.is-poster,.is-worker){margin-top:6px}  /* 身分標籤往上突出，多留一點縫 */
.tc-body{display:flex;flex-direction:column;gap:4px;padding:0}
.tc-open{border-radius:12px;overflow:hidden;color:var(--md-on-surface);transition:background-color .15s linear}
@media (hover:hover){.card.task:hover{box-shadow:var(--md-elev-1)}.tc-open:hover{background:var(--st-hover)}}
.tc-open:focus-visible{outline:3px solid var(--md-secondary);outline-offset:2px}
/* 我是本體／我是替身：右上角的小標籤（壓在外框上緣，像輸入框的欄位名稱），不佔第一排的位置 */
.tc-tab,.sum-role{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px 0 6px;border:0;border-radius:8px;font-size:12px;line-height:16px;font-weight:500;letter-spacing:.5px;white-space:nowrap}
.tc-tab{position:absolute;top:-13px;right:16px;z-index:2;box-shadow:0 0 0 3px var(--md-surface)}
.tc-tab::before,.sum-role::before{width:16px;height:16px}
.card.task.is-poster .tc-tab,.sum-role.is-poster{background:var(--role-p);color:var(--on-role-p)}
.card.task.is-worker .tc-tab,.sum-role.is-worker{background:var(--role-w);color:var(--on-role-w)}
.card.task.is-poster .tc-tab::before,.sum-role.is-poster::before{--ic:var(--ic-home)}
.card.task.is-worker .tc-tab::before,.sum-role.is-worker::before{--ic:var(--ic-clean)}
/* 第一排：日期（固定寬度）＋時間 */
.tc-date{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 12px;padding:0;font-size:16px;line-height:24px;font-weight:400;letter-spacing:.15px;font-variant-numeric:tabular-nums;color:var(--md-on-surface);white-space:nowrap}  /* 一般手機寬度放得下一排；特別窄（300px 以下）時間才換到下一行 */
.tc-d{flex:none;min-width:7.6em}
.tc-d>*{font:inherit;color:inherit}
.tc-time{flex:none}
.tc-date .tc-time{font-weight:400}  /* 日期和時間都是一般字體（使用者覺得粗體太重） */
.tc-row{display:flex;align-items:center;gap:12px;padding:0}
.tc-main{flex-direction:row;flex-wrap:wrap;align-items:center;gap:0 8px}
.tc-main>.tc-place{flex:0 1 auto;min-width:0}
.tc-main>.tc-g{order:1}
.tc-main>.tc-who{order:2;flex-basis:100%}
.tc-place{font-size:14px;line-height:20px;letter-spacing:.25px;color:var(--md-on-surface-variant)}
.tc-who{margin-top:2px;font-size:14px;line-height:20px;font-weight:500;letter-spacing:.1px;color:var(--md-on-surface)}
.tc-g{margin:0;min-height:0}
.gtxt,.gtxt.male,.gtxt.female{display:inline-flex;align-items:center;gap:2px;height:24px;padding:0 8px;border:0;border-radius:8px;background:var(--md-surface-container-highest);color:var(--md-on-surface-variant);font-size:12px;line-height:24px;font-weight:500;letter-spacing:.5px}
.gtag.any{background:transparent;color:inherit;padding:0;font-size:inherit;font-weight:inherit}
.tc-side,.tc-bottom{gap:4px}
.tc-side .price{font-size:20px;line-height:24px;color:var(--md-on-surface)}
.tc-side .price .muted{font-size:14px;line-height:20px;font-weight:500;letter-spacing:.1px;color:var(--md-on-surface-variant)}
@media (max-width:360px){.tc-date{column-gap:8px;font-size:15px}}
/* 新留言數（large badge）：卡片右上角外側 */
.nbadge{top:-6px;right:-6px;min-width:20px;height:20px;padding:0 6px;border:2px solid var(--md-surface);border-radius:10px;background:var(--md-error);color:var(--md-on-error);font-size:12px;line-height:16px;font-weight:500}
/* 狀態列：平常是灰字；輪到你時是淺紅底（error container）＋紅點＋箭頭 */
.tc-bar,.tc-bar.bottom{display:flex;align-items:center;gap:12px;min-height:40px;margin:12px -16px -12px;padding:8px 16px;
  border:0;border-top:1px solid var(--md-outline-variant);border-radius:0 0 12px 12px;background:transparent;
  font-size:14px;line-height:20px;font-weight:400;letter-spacing:.25px;color:var(--md-on-surface)}  /* 一般的狀態是黑字（使用者覺得灰字太淡）；輪到你是紅字 */
.tc-bar.bottom.todo{background:transparent;color:var(--md-error);font-weight:500;border-top-color:var(--md-outline-variant)}  /* 輪到你：底部一行紅字（紅色只代表需要你處理），不做成像按鈕的膠囊 */
.tc-bar.todo::after{content:"";flex:none;width:20px;height:20px;margin-right:-4px;background:currentColor;-webkit-mask:var(--ic-chev) center/contain no-repeat;mask:var(--ic-chev) center/contain no-repeat}
.tc-dot{width:8px;height:8px;border-radius:50%;background:var(--md-error)}
.card.task .tc-bar .grow{display:block}.tc-bar .nw{white-space:nowrap}  /* 一般的文字排版（「（還剩 2 天）」不從中間斷行，放不下才整段換到下一行） */
/* 狀態小標籤 */
.pill{border:0;border-radius:8px;padding:4px 8px;font-size:12px;line-height:16px;font-weight:500;letter-spacing:.5px}
.pill.s-bid{background:var(--md-secondary-container);color:var(--md-on-secondary-container)}
.pill.s-off{background:var(--md-surface-container-highest);color:var(--md-on-surface-variant);border:0}
.pill.s-bad{background:transparent;color:var(--md-error);box-shadow:inset 0 0 0 1px currentColor}
.pill.s-good{background:#c8f0cf;color:#00531f}
.pill.s-assigned,.pill.s-open{background:var(--md-surface-container-highest);color:var(--md-on-surface-variant)}

/* ---------- 接案頁：搜尋列（search bar），排序、篩選是列裡的圖示按鈕 ---------- */
.toolbar{height:56px;gap:4px;align-items:center;padding:0 8px 0 16px;border:0;border-radius:28px;background:var(--md-surface-container-high)}
.toolbar:focus-within{box-shadow:inset 0 0 0 2px var(--md-primary)}
.toolbar .search{height:40px;padding:0;gap:12px;border:0;border-radius:0;background:transparent;color:var(--md-on-surface-variant)}
.search input{height:40px;min-height:40px;padding:0;border:0;background:transparent;font-size:16px;color:var(--md-on-surface);-webkit-appearance:none;appearance:none}
.search input:focus{box-shadow:none}
.search:focus-within{outline:none}
.tool{width:40px;height:40px;flex:none;border:0;background:transparent;color:var(--md-on-surface-variant)}
.tool .tl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tool.active{background:var(--md-secondary-container);color:var(--md-on-secondary-container)}
.tool .badge,.btn .badge{position:absolute;top:2px;right:0;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--md-primary);color:var(--md-on-primary);font-size:12px;line-height:16px}  /* 篩選條件數：主色，不是提醒 */
#blist{gap:12px}
/* 搜尋框下面一行：左邊是排序（按了打開排序），右邊是件數 */
.bl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:-4px 0 -4px}
.sortbtn{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:6px;min-width:0;min-height:36px;margin-left:-8px;padding:0 12px 0 8px;border:0;border-radius:18px;background:none;
  font:inherit;font-size:14px;line-height:20px;font-weight:500;color:var(--md-primary);cursor:pointer}
.sortbtn svg{flex:none;width:18px;height:18px}
.sortbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (hover:hover){.sortbtn:hover{background:var(--st-p-hover)}}
.bl-count{flex:none;color:var(--md-on-surface-variant)}
/* 目前套用的篩選：每一種一個小標籤（M3 input chip），按 ✕ 移除 */
.fchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:-4px}
.fchip{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:4px;max-width:100%;height:32px;padding:0 6px 0 12px;border:0;border-radius:8px;
  background:var(--md-secondary-container);color:var(--md-on-secondary-container);font:inherit;font-size:14px;line-height:20px;font-weight:500;cursor:pointer}
.fchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fchip svg{flex:none}
@media (hover:hover){.fchip:hover{background-image:linear-gradient(var(--st-hover),var(--st-hover))}}

/* ---------- 按鈕：filled（主要）、outlined（次要）、text（最低調）；全圓角、高 40 ---------- */
.btn{min-height:40px;padding:10px 24px;border:0;border-radius:20px;background:var(--md-primary);color:var(--md-on-primary);
  font-size:14px;line-height:20px;font-weight:500;letter-spacing:.1px;transition:box-shadow .2s var(--md-ease)}
.btn.sm{min-height:40px;padding:10px 16px;font-size:14px}
@media (hover:hover){.btn:hover:not(:disabled){box-shadow:var(--md-elev-1);background-image:linear-gradient(rgba(255,255,255,.08),rgba(255,255,255,.08))}}
.btn:active:not(:disabled){box-shadow:none}
.btn.ghost,.btn.danger{background:transparent;color:var(--md-primary);border:1px solid var(--md-outline);padding:9px 23px}
.btn.ghost.sm,.btn.danger.sm{padding:9px 15px}
.btn.danger{color:var(--md-error)}
@media (hover:hover){.btn.ghost:hover:not(:disabled),.btn.danger:hover:not(:disabled),.btn.quiet:hover{box-shadow:none;background-image:linear-gradient(var(--st-p-hover),var(--st-p-hover))}}
.btn.danger-solid{background:var(--md-error);color:var(--md-on-error)}
.btn.quiet{background:transparent;border:0;color:var(--md-on-surface-variant);padding:10px 12px;font-weight:500;text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--md-outline-variant)}
.btn:disabled{opacity:1;background:rgba(24,28,32,.12);color:rgba(24,28,32,.38)}
.btn.ghost:disabled{background:transparent;border-color:rgba(24,28,32,.12)}
label.btn{cursor:pointer}

/* ---------- 表單：欄位名稱在上、outlined 輸入框 ---------- */
.field{gap:6px}
.field label,.field .lbl{font-size:14px;line-height:20px;font-weight:500;letter-spacing:.1px;color:var(--md-on-surface-variant)}
.req,.opt{margin-left:4px;padding:0;border-radius:0;background:transparent;font-size:12px;font-weight:500}
.req{color:var(--md-error)}.opt{color:var(--md-on-surface-variant)}
input,select,textarea{min-height:56px;padding:16px;border:1px solid var(--md-outline);border-radius:4px;background:transparent;font-size:16px;color:var(--md-on-surface)}
@media (hover:hover){input:hover,select:hover,textarea:hover{border-color:var(--md-on-surface)}}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--md-primary);box-shadow:inset 0 0 0 1px var(--md-primary)}
[aria-invalid="true"]{border-color:var(--md-error);box-shadow:inset 0 0 0 1px var(--md-error)}
.ferr{color:var(--md-error);font-size:12px;line-height:16px;font-weight:400;letter-spacing:.4px}
.mail-in{border:1px solid var(--md-outline);border-radius:4px;background:transparent;padding-right:16px}
.mail-in input{border:0;box-shadow:none;background:transparent}
.mail-in:focus-within{outline:none;border-color:var(--md-primary);box-shadow:inset 0 0 0 1px var(--md-primary)}
.code-in{font-size:28px;letter-spacing:.3em}
/* 欄位名稱嵌在外框上緣（M3 outlined text field 的浮動標籤，底色跟著所在的容器 --field-bg）；框下面的說明往內縮，對齊框裡的字 */
.field:has(>:is(input,select,textarea,.dt-btn,.mail-in)){position:relative}
.field:has(>:is(input,select,textarea,.dt-btn,.mail-in))>:is(label,.lbl){position:absolute;top:-8px;left:12px;max-width:calc(100% - 24px);padding:0 4px;background:var(--field-bg,var(--md-surface));z-index:1;font-size:12px;line-height:16px;font-weight:400;letter-spacing:.4px;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.field>textarea{resize:none;field-sizing:content;min-height:112px;max-height:240px}
.field:has(>:is(input,select,textarea,.dt-btn,.mail-in)){margin-top:4px}
.sheet{--field-bg:var(--md-surface-container-low)}
.card{--field-bg:var(--md-surface-container-lowest)}
form[data-form="post"].card{--field-bg:var(--md-surface)}
.card.next.act{--field-bg:var(--md-surface-container-lowest)}
.pay-acc{--field-bg:var(--md-surface-container-lowest)}
.sheet.dlg{--field-bg:var(--md-surface-container-high)}
.field:has(>:is(input,select,textarea,.mail-in):focus-within)>label{color:var(--md-primary)}
.field>label{transition:top .15s var(--md-ease),font-size .15s var(--md-ease),line-height .15s var(--md-ease)}
.field.k-empty:not(:focus-within)>label{top:16px;left:13px;font-size:16px;line-height:24px;letter-spacing:.15px;background:transparent;color:var(--md-on-surface-variant)}
.field>.small,.two+p.small{padding-left:16px;font-size:12px;line-height:16px;letter-spacing:.4px}
.field>.ferr{padding-left:16px}
/* 日期、時間欄（按了打開選擇視窗）：和輸入框一樣的填色框 */
.dt-btn{min-height:56px;padding:0 16px;gap:12px;border:1px solid var(--md-outline);border-radius:4px;background:transparent;font-size:16px;font-weight:400;color:var(--md-on-surface)}
.dt-btn svg{color:var(--md-on-surface-variant)}
@media (hover:hover){.dt-btn:hover{border-color:var(--md-on-surface)}}
.range{gap:8px}
.range .dt-btn{padding:0 12px;gap:8px;font-size:15px}
.range span{color:var(--md-on-surface-variant)}
.two{gap:12px}
/* 發案：表單直接放在頁面上（不加卡片），欄位之間留白 */
/* 發案：表單直接放在頁面上；時間／地點／條件與價格／備註分組，組之間多留白 */
form[data-form="post"].card{padding:0;background:transparent;border:0;gap:16px}
form[data-form="post"]>.field>.lbl,form[data-form="post"]>p.small{padding-left:16px}  /* 欄位外的標題和說明，左緣對齊框裡的字 */
form[data-form="post"]>:is(.field:has(#p-b),.field:has([aria-labelledby="p-g"]),.field:has(#p-note)){margin-top:12px}
form[data-form="post"] .two+p.small{margin-top:-12px}

/* ---------- 提示框 ---------- */
.banner{border:0;border-radius:12px;padding:12px 16px;background:var(--md-surface-container-high);color:var(--md-on-surface)}
.banner.info{background:var(--md-secondary-container);color:var(--md-on-secondary-container)}
.banner.warn{background:var(--md-tertiary-container);color:var(--md-on-tertiary-container)}
.banner.bad{background:var(--md-error-container);color:var(--md-on-error-container)}

/* ---------- 案件詳情 ---------- */
/* 進度：點加連接線的 stepper（完成＝主色實心圓加勾、目前＝主色實心圓加淡光圈、還沒到＝小灰點），標籤置中在點下面。不像按鈕、分頁或單選鈕 */
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:0;margin:4px 0 0;padding:0}
.steps li{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:0;text-align:center;font-size:12px;line-height:16px;font-weight:400;letter-spacing:.2px;color:var(--md-on-surface-variant)}
.steps li::before{content:"";display:block;position:absolute;top:7px;left:-50%;width:100%;height:2px;border-radius:0;background:var(--md-outline-variant);z-index:0}
.steps li:first-child::before{display:none}
.steps .dot,.steps li.past .dot,.steps li.cur .dot{display:block;position:relative;z-index:1;width:8px;height:8px;margin:4px 0;border:0;border-radius:50%;background:var(--md-outline-variant);box-shadow:none}
.steps li.past .dot,.steps li.cur .dot{width:16px;height:16px;margin:0;background:var(--md-primary)}
.steps li.past .dot::after{content:"";position:absolute;inset:0;background:var(--md-on-primary);-webkit-mask:var(--ic-check) center/12px no-repeat;mask:var(--ic-check) center/12px no-repeat}
.steps li.cur .dot{box-shadow:0 0 0 4px var(--md-primary-container)}
.steps li.past::before,.steps li.cur::before{background:var(--md-primary)}
.steps li.cur{color:var(--md-on-surface);font-weight:500}
/* 摘要：上半部是淺藍的重點區（日期 → 時間 → 標價，由上到下一眼看完），下半部是地點等資料 */
.card.sum{padding:0;gap:0;overflow:hidden}
.card.sum>.pill{align-self:flex-start;margin:16px 16px 0}
.sum-top{position:relative;display:flex;flex-direction:column;align-items:stretch;gap:0;padding:16px 16px 12px;background:transparent;color:var(--md-on-surface)}
.card.sum>.pill+.sum-top{margin-top:16px}
.sum-top .grow{display:flex;flex-direction:column;gap:4px}
.sum-date{padding-right:96px;font-size:24px;line-height:32px;font-weight:400;color:var(--md-on-surface)}  /* 日期比時間大一點，都不粗體（使用者要求） */
.sum-date>*{font:inherit;color:inherit}
.sum-time{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;margin-top:0;font-size:20px;line-height:28px;font-weight:400;font-variant-numeric:tabular-nums}
.sum-top .muted{color:var(--md-on-surface-variant)}
.sum-time .small{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 10px 0 8px;border-radius:8px;background:var(--md-surface-container-highest);color:var(--md-on-surface-variant);font-size:14px;line-height:20px;font-weight:500}
.sum-time .small::before{content:"";width:16px;height:16px;background:currentColor;-webkit-mask:var(--ic-clock) center/contain no-repeat;mask:var(--ic-clock) center/contain no-repeat}
.sum-who{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:8px;margin-top:8px;padding-top:8px;border-top:1px solid var(--md-outline-variant);font-size:14px}
.sum-who-l{color:var(--md-on-surface-variant)}
.sum-who-n{font-size:16px;font-weight:500}
.sum-who .num{color:var(--md-on-surface-variant)}
.sum-role{position:absolute;top:16px;right:16px}
.sum-price{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:baseline;gap:0 12px;margin:0 16px;padding:10px 0 14px;border-top:1px solid var(--md-outline-variant)}
.sum-price>.sum-pl{grid-column:1;grid-row:2;justify-self:start;text-align:left}.sum-price>.price{grid-column:2;grid-row:2;text-align:right}
.sum-orig{grid-column:2;grid-row:1;justify-self:end;font-size:12px;line-height:16px;letter-spacing:.4px;color:var(--md-on-surface-variant)}  /* 成交價和原標價不同時，上方一行低調的小字 */
.sum-price .small{color:var(--md-on-surface-variant)}
.sum-price .price{font-size:24px;line-height:32px;font-weight:700;color:var(--md-on-surface)}
.sum-price .price .muted{font-size:16px;color:var(--md-on-surface-variant)}
.card.sum .facts{padding:12px 0;border-top:1px solid var(--md-outline-variant);margin:0 16px}
.facts{gap:8px 16px;font-size:14px;line-height:20px}
.facts dt{color:var(--md-on-surface-variant)}
@media (max-width:360px){.sum-date{padding-right:84px;font-size:22px;line-height:28px}.sum-time{font-size:18px;line-height:24px}.steps li{font-size:12px;letter-spacing:0}}
/* 你的下一步：輪到你時是浮起的白卡（全頁唯一有陰影的卡片），等別人時是一般的外框卡 */
.card.next{gap:12px}
.card.next.act{background:var(--md-surface-container-lowest);color:var(--md-on-surface);border-color:transparent;box-shadow:var(--md-elev-2)}
.card.next .btn.ghost.block{border-color:transparent;padding:10px 12px}  /* 次要動作（婉拒、修改出價、重新選擇替身）是 text button，主要按鈕才是實心 */
.offer .btn.sm{background:var(--md-secondary-container);color:var(--md-on-secondary-container);box-shadow:none}  /* 「選這位」是淺色底按鈕（tonal）：一屏只留一個實心按鈕 */
.offer-row{align-items:flex-start}
.offer-side .price{margin-top:-2px}
.card.next>h2:first-child{font-size:22px;line-height:28px}
.card.next>p:not(.small){font-size:14px;line-height:22px}
.card.next>.np-lead{font-size:16px;line-height:24px;font-weight:500}
.card.next .facts.np{grid-template-columns:auto 1fr;gap:6px 16px;margin:0;font-size:14px}
.card.next .facts.np dd b,.card.next .facts.np .nw{white-space:nowrap}  /* 日期時間、「（還剩 22 小時）」不要從中間斷行 */
.card.next p b{white-space:nowrap}  /* 期限的日期時間不要從中間斷行 */
.card.next .btn.block+.btn.block{margin-top:-4px}
.pc-row .price{font-size:16px}
.offer{gap:8px;padding:12px 0;border-top:1px solid var(--md-outline-variant)}
.offer:first-of-type{border-top:0;padding-top:0}
.offer .price{font-size:22px;line-height:28px}
.offer-side{gap:8px}
.chosen{gap:8px;padding:12px 16px;border-radius:12px;background:var(--md-surface-container-high)}
/* 付款進度：兩段線段加標籤，和頂端進度條同一套樣子（完成＝主色加 ✓、現在輪到＝主色加粗、還沒到＝灰） */
.chosen.paysteps{display:grid;grid-template-columns:1fr 1fr;gap:0 4px;margin:0;padding:0;background:transparent;font-size:14px;line-height:20px}
.paysteps>span{position:relative;padding:10px 0 0;font-weight:500;color:var(--md-on-surface-variant)}
.paysteps>span::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;border-radius:2px;background:var(--md-surface-container-highest)}
.paysteps>span:first-child:not(.ok),.paysteps>span.ok+span:not(.late){color:var(--md-primary);font-weight:700}
.paysteps>span:first-child:not(.ok)::before,.paysteps>span.ok+span:not(.late)::before,.paysteps .ok::before{background:var(--md-primary)}
.paysteps .ok{color:var(--md-on-surface)}
.paysteps .ok::after{content:" ✓";content:" ✓"/"";font-weight:700;color:var(--md-primary)}
.paysteps>.late{grid-column:1/-1;padding:6px 0 0;color:var(--md-on-tertiary-container);font-weight:400}
.paysteps>.late::before{display:none}
/* 照片 */
.photos{gap:8px}
.ph{border-radius:8px;background:var(--md-surface-container-high)}
.ph.add{border:1px dashed var(--md-outline);background:transparent;color:var(--md-primary);font-weight:500}
.ph-x{background:rgba(24,28,32,.72)}
.big-photo{border-radius:12px}
.qr{border:1px solid var(--md-outline-variant);border-radius:12px;padding:8px}
.bank{border-radius:12px;background:var(--md-surface-container-high)}
/* 付款方式（單選的展開列表） */
.pay-acc{border:1px solid var(--md-outline-variant);border-radius:12px;background:var(--md-surface-container-lowest)}
.pway+.pway{border-top:1px solid var(--md-outline-variant)}
.pway input:checked+.acc-h{background:var(--md-secondary-container);color:var(--md-on-secondary-container)}
.radio-dot{width:20px;height:20px;border:2px solid var(--md-on-surface-variant);background:transparent}
.pway input:checked+.acc-h .radio-dot{border-color:var(--md-primary);background:var(--md-primary);box-shadow:inset 0 0 0 3px var(--md-secondary-container)}
.pway input:focus-visible+.acc-h{outline:3px solid var(--md-secondary);outline-offset:-3px}
/* 展開列表（收款方式） */
.card.acc{padding:0;gap:0;overflow:hidden}
.acc-h{min-height:56px;padding:12px 16px;gap:12px}
.acc-t{font-size:16px;font-weight:500}
.acc-s{font-size:14px;color:var(--md-on-surface-variant)}
.acc-s.set{color:var(--md-primary);font-weight:500}
.acc>.acc-h~.acc-h,.acc>.acc-b~.acc-h{border-top:1px solid var(--md-outline-variant)}
.chev{color:var(--md-on-surface-variant)}
.acc-b{padding:4px 16px 16px}
/* 留言板：對方是灰底泡泡，自己是淺藍底泡泡；輸入列是圓角的輸入框 */
.cmts{gap:8px;max-height:360px}
.cmt{background:var(--md-surface-container-high);border-radius:16px 16px 16px 4px;padding:8px 12px}
.cmt.mine{background:var(--md-primary-container);color:var(--md-on-primary-container);border-radius:16px 16px 4px 16px}
.cmt-meta{font-size:12px;line-height:16px;color:var(--md-on-surface-variant)}
.cmt.mine .cmt-meta{color:var(--md-on-primary-container);opacity:.8}
.cmt-imgs img{border-radius:8px}
.cmt-form{gap:8px;align-items:flex-end}
.cmt-form textarea{min-height:48px;padding:12px 16px;border:0;border-radius:24px;background:var(--md-surface-container-highest)}
.cmt-form textarea:focus{box-shadow:inset 0 0 0 2px var(--md-primary)}
.cmt-form .btn{min-height:48px;border-radius:24px}
.cmt-ph{width:48px;height:48px;border:0;border-radius:50%;color:var(--md-primary)}
@media (hover:hover){.cmt-ph:hover{background:var(--st-p-hover)}}
/* 對方的資訊卡、標記 */
.card.mini{gap:4px;padding:16px}
.profile-form{border-top:0;padding-top:0}
.mini-role{font-size:14px;line-height:20px;font-weight:500;letter-spacing:.1px;color:var(--md-on-surface-variant)}
.id-name{font-size:16px;font-weight:500}
.idblock.big .id-name{font-size:24px;line-height:32px}
.idline{font-size:14px;color:var(--md-on-surface-variant)}
/* 標記：對方資訊卡（和「等替身確認」卡片）右上角一顆書籤圖示的外框小按鈕（像 Google 地圖的「儲存」）；按了在原位往下展開說明和選項。
   標記後同一顆按鈕寫標記的內容（實心書籤＋標記的顏色），所以標記的資訊也在右上角。用 grid 排：左邊是名字和資料，右邊是按鈕，選單在下面整行 */
.card.mini:has(.tagline),.chosen:has(.tagline){display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:12px;row-gap:4px;align-items:start}
.card.mini .tagline,.card.mini .tagline .tagwrap,.chosen .tagline,.chosen .tagline .tagwrap{display:contents}
.card.mini:has(.tagline)>.row{grid-column:1/-1;grid-row:1}  /* 「本體／替身」是標題，自己一排 */
.card.mini:has(.tagline)>.idblock{display:contents}
.card.mini:has(.tagline) .id-name{grid-column:1;grid-row:2;align-self:center}  /* 名字和「標記」按鈕同一排 */
.card.mini:has(.tagline) .idline{grid-column:1/-1;grid-row:3}  /* 學號那一行用整張卡的寬度 */
.card.mini .taglink{grid-column:2;grid-row:2}
.chosen:has(.tagline)>.idblock{display:contents}
.chosen:has(.tagline) .id-name{grid-column:1;grid-row:1;align-self:center}
.chosen:has(.tagline) .idline{grid-column:1/-1;grid-row:2}
.chosen .taglink{grid-column:2;grid-row:1}
.chosen:has(.tagline)>.row{grid-column:1/-1;margin-top:8px}
.tagline .tagmenu{grid-column:1/-1;margin-top:8px}
.taglink{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:6px;max-width:160px;min-height:32px;padding:0 12px 0 8px;border:1px solid var(--md-outline-variant);border-radius:8px;background:transparent;
  font-size:14px;line-height:20px;font-weight:500;color:var(--md-primary);text-decoration:none;cursor:pointer;transition:background-color .15s linear}
.taglink svg{flex:none}
.taglink .tg-lbl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (hover:hover){.taglink:hover{background-image:linear-gradient(var(--st-p-hover),var(--st-p-hover))}}
.taglink[aria-expanded="true"]{background:var(--md-secondary-container);border-color:transparent;color:var(--md-on-secondary-container)}
.taglink.tagged{border-color:transparent}
.taglink.tagged .i-o{display:none}.taglink.tagged .i-f{display:inline}
.taglink.tg-trust{background:#c8f0cf;color:#00531f}
.taglink.tg-black{background:var(--md-error-container);color:var(--md-on-error-container)}
.taglink.tg-custom{background:var(--tag-custom);color:var(--on-tag-custom)}
.tagchip{display:inline-flex;align-items:center;gap:4px;max-width:100%;height:24px;padding:0 8px 0 4px;border-radius:8px;font-size:12px;line-height:16px;font-weight:500;letter-spacing:.4px;vertical-align:middle;white-space:nowrap}
.tagchip svg{flex:none;width:16px;height:16px}
.tagchip .i-o{display:none}.tagchip .i-f{display:inline}
.tagchip .tg-lbl{min-width:0;overflow:hidden;text-overflow:ellipsis}
.tagchip.tg-trust{background:#c8f0cf;color:#00531f}
.tagchip.tg-black{background:var(--md-error-container);color:var(--md-on-error-container)}
.tagchip.tg-custom{background:var(--tag-custom);color:var(--on-tag-custom)}
.offer-tag{display:flex;margin-top:6px;min-width:0}
.banner.tagnote{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
#cmt-sec{scroll-margin-top:72px}  /* 從留言通知捲到留言板時，不被標題欄擋住 */
.tagmenu{border:1px solid var(--md-outline-variant);border-radius:12px;background:var(--md-surface-container-lowest);box-shadow:var(--md-elev-2);padding:8px 0}
.tagline .tagmenu{box-shadow:none}
.tagmenu>button{min-height:48px;padding:0 16px;border-radius:0;font-size:14px;font-weight:500}
.tm-note{padding:4px 16px 12px;border-bottom:1px solid var(--md-outline-variant)}
.tm-check{color:var(--md-primary)}
.tm-remove{color:var(--md-error)!important;border-top:1px solid var(--md-outline-variant)!important;border-radius:0!important}
.tm-custom{padding:8px 16px}
.tm-custom input{min-height:40px;padding:8px 12px}
/* 「標記的人」頁的標記按鈕（assist chip） */
.card.mini>.row.between:has(.tagbtn){flex-wrap:wrap;align-items:flex-start}
.card.mini>.row.between>.idblock{flex:1 1 150px}  /* 「標記過的人」頁：放不下時標記換到下一行，不擠學號 */
.tagbtn{max-width:100%;height:32px;min-height:32px;padding:0 12px 0 8px;gap:6px;border:1px solid var(--md-outline-variant);border-radius:8px;background:transparent;color:var(--md-on-surface-variant);font-size:14px;font-weight:500}
.tagbtn.tg-trust{color:#00531f;border-color:transparent;background:#c8f0cf}
.tagbtn.tg-black{color:var(--md-on-error-container);border-color:transparent;background:var(--md-error-container)}
.tagbtn.tg-custom{color:var(--on-tag-custom);border-color:transparent;background:var(--tag-custom)}
.tm-dot.custom{background:var(--md-primary)}
.tagbtn:not(.tg-none) .i-o{display:none}.tagbtn:not(.tg-none) .i-f{display:inline}
/* 取消、退出、案件遇到問題？：最下面、最低調（text button） */
.exit{gap:4px;margin-top:4px;padding:4px 0 16px}
.trouble summary{display:inline-flex;align-items:center;gap:4px;min-height:40px;padding:0 12px;border-radius:20px;font-size:14px;font-weight:500;color:var(--md-on-surface-variant)}
.trouble summary::after{width:18px;height:18px;--ic:var(--ic-expand);transition:transform .2s var(--md-ease)}
.trouble[open] summary::after{transform:rotate(180deg)}
@media (hover:hover){.trouble summary:hover{background:var(--st-hover);color:var(--md-on-surface)}}

/* ---------- 我的 ---------- */
.card.me-card{position:relative;padding:20px 80px 20px 16px;background:var(--md-surface-container-low)}
.me-edit{position:absolute;top:16px;right:8px;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px 0 10px;border:0;border-radius:20px;background:none;font:inherit;font-size:14px;font-weight:500;color:var(--md-primary);cursor:pointer}
.me-edit::before{content:"";width:18px;height:18px;background:currentColor;-webkit-mask:var(--ic-edit) center/contain no-repeat;mask:var(--ic-edit) center/contain no-repeat}
@media (hover:hover){.me-edit:hover{background:var(--st-p-hover)}}
.card.linkrow::before,.rules>summary::before,main>.btn[data-act="logout"]::before{content:"";flex:none;width:24px;height:24px;background:var(--md-on-surface-variant);-webkit-mask:var(--ic) center/contain no-repeat;mask:var(--ic) center/contain no-repeat}
.card.linkrow[data-act="bankPage"]{--ic:var(--ic-card)}.card.linkrow[data-act="favs"]{--ic:var(--ic-star)}.card.linkrow[data-act="past"]{--ic:var(--ic-history)}.card.linkrow[data-act="tagsPage"]{--ic:var(--ic-bookmark)}
details.rules{display:block;padding:0;gap:0;margin-top:4px;border-radius:16px;overflow:hidden}
.rules>summary{display:flex;align-items:center;gap:16px;min-height:56px;padding:0 8px 0 16px;list-style:none;cursor:pointer;--ic:var(--ic-rule)}
.rules>summary::-webkit-details-marker{display:none}
.rules>summary h2{flex:1;font-size:16px;line-height:24px;font-weight:500}
.rules>summary::after{content:"";width:24px;height:24px;margin-right:0;background:var(--md-on-surface-variant);-webkit-mask:var(--ic-chev) center/contain no-repeat;mask:var(--ic-chev) center/contain no-repeat;transition:transform .2s var(--md-ease)}
.rules[open]>summary::after{transform:rotate(90deg)}
@media (hover:hover){.rules>summary:hover{background:var(--st-hover)}}
.rules>ul.small{padding:4px 16px 16px 58px!important}
main>.btn[data-act="logout"]{display:flex;align-items:center;justify-content:flex-start;gap:16px;width:100%;min-height:56px;margin-top:4px;padding:0 16px;border:0;border-radius:16px;background:transparent;color:var(--md-on-surface-variant);font-size:16px;line-height:24px;--ic:var(--ic-logout)}
@media (hover:hover){main>.btn[data-act="logout"]:hover{background-image:linear-gradient(var(--st-hover),var(--st-hover))}}
/* 收款方式、收藏、過去的案件、標記的人：一組相連的清單（像手機的設定頁），頭尾圓角 */
.card.linkrow{flex-direction:row;align-items:center;gap:16px;min-height:72px;padding:12px 8px 12px 16px;border-radius:4px;background:var(--md-surface-container-low)}
.card.linkrow+.card.linkrow{margin-top:-10px}
:not(.linkrow)+.card.linkrow{border-radius:16px 16px 4px 4px}
.card.linkrow:not(:has(+.card.linkrow)){border-radius:4px 4px 16px 16px}
:not(.linkrow)+.card.linkrow:not(:has(+.card.linkrow)){border-radius:16px}
.card.linkrow .grow{gap:2px}
.card.linkrow .grow>b{font-size:16px;line-height:24px;font-weight:500}
.card.linkrow .chev{font-size:24px;line-height:1;padding:0 8px}
.cnt{font-weight:500;color:var(--md-on-surface)}
.rules ul.small{gap:8px!important;line-height:20px}
.rules ul.small li::marker{color:var(--md-primary)}

/* ---------- 從下面滑出的視窗（bottom sheet）：28px 圓角、上方一條拖曳把手 ---------- */
.scrim{background:rgba(0,0,0,.32)}
.sheet{gap:12px;padding:0 16px 24px;background:var(--md-surface-container-low);border-radius:28px 28px 0 0;box-shadow:var(--md-elev-1)}
.sheet::before{content:"";flex:none;align-self:center;width:32px;height:4px;margin:16px 0 4px;border-radius:2px;background:var(--md-on-surface-variant);opacity:.4}
.sheet h2{font-size:22px;line-height:28px;font-weight:500}
.sheet h3{margin-top:8px}
.m-layer .sheet.fx-in{animation:kSheet .2s var(--md-ease-decel) backwards}
@keyframes kSheet{from{transform:translateY(100%)}}
/* 通知、示範工具的帳號：整排的清單 */
.notes,.acct-list{gap:0;margin:0 -16px}
.note,.acct-row{border:0;border-radius:0;background:transparent;padding:12px 24px;transition:background-color .15s linear}
.note+.note{border-top:1px solid var(--md-outline-variant)}
.note-txt{font-size:16px;line-height:24px;font-weight:700;color:var(--md-on-surface)}  /* 通知內容粗體（使用者要求）；新的通知前面有紅點 */
.note.new{border-color:var(--md-outline-variant)}
.note.new .note-txt::before{background:var(--md-error)}
.note-time{flex-wrap:wrap;column-gap:12px;font-size:14px;line-height:20px;color:var(--md-on-surface-variant)}
.note-time>span:last-child{white-space:nowrap}
.acct-row{min-height:64px}
.acct-row.on{background:var(--md-secondary-container);color:var(--md-on-secondary-container)}
/* 排序：整排的選項，選中的那一排有底色和勾勾 */
.optlist{gap:4px;margin:0 -4px}
.opt-row{min-height:56px;padding:0 16px 0 20px;border:0;border-radius:28px;background:transparent;font-size:16px}
.opt-row.on{background:var(--md-secondary-container);color:var(--md-on-secondary-container);font-weight:500}
/* 出價：大號金額輸入 */
.pc-label{font-size:14px;color:var(--md-on-surface-variant)}
.pc-input{font-size:22px;font-weight:500;color:var(--md-on-surface-variant)}
.pc-input input{width:170px;min-height:64px;font-size:28px;font-weight:400;text-align:center}
.btn.dl{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding-left:16px}  /* 放大照片的「下載」：圖示和字置中對齊（M3 帶圖示的按鈕） */
.btn.dl svg{flex:none;width:18px;height:18px}
.pc-input input::placeholder{font-size:16px;letter-spacing:.5px;color:var(--md-on-surface-variant);opacity:1}
/* 第一次進入的介紹 */
.intro{gap:16px}
.intro-hero{align-items:flex-start;text-align:left;gap:8px;padding:8px 0 4px}
.brand.big{font-size:36px;line-height:44px;font-weight:500;color:var(--md-primary)}
.lead{font-size:22px;line-height:28px;color:var(--md-on-surface)}
.intro-roles{grid-template-columns:auto 1fr;align-items:center;gap:12px 16px;padding:16px;border-radius:16px;background:var(--md-surface-container-high)}
.intro-roles dt{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 10px 0 8px;border-radius:8px;font-size:14px;font-weight:500}
.intro-roles dt::before{width:18px;height:18px}
.intro-roles dt:first-of-type{background:var(--role-p);color:var(--on-role-p)}
.intro-roles dt:first-of-type::before{--ic:var(--ic-home)}
.intro-roles dt:last-of-type{background:var(--role-w);color:var(--on-role-w)}
.intro-roles dt:last-of-type::before{--ic:var(--ic-clean)}
.how li{color:var(--md-on-surface-variant)}
.how li::before{background:var(--md-primary-container);color:var(--md-on-primary-container);font-weight:500}
.how b{font-weight:500}
.intro-dots{gap:8px}
.intro-dots i{width:8px;height:8px;border-radius:4px;background:var(--md-outline-variant);transition:width .2s var(--md-ease)}
.intro-dots i.on{width:24px;background:var(--md-primary)}

/* ---------- 日期、時間選擇（M3 date picker／time picker 對話框） ---------- */
.scrim.center{padding:24px}
.sheet.dlg{max-width:360px;padding:20px 24px 16px;gap:12px;border:0;border-radius:28px;background:var(--md-surface-container-high);box-shadow:var(--md-elev-3)}
.sheet.dlg::before{display:none}
.d-layer .sheet.fx-in{animation:kDlg .15s var(--md-ease-decel) backwards}
@keyframes kDlg{from{opacity:0;transform:scale(.92)}}
.dlg-title{font-size:14px;line-height:20px;font-weight:500;color:var(--md-on-surface-variant)}
.dlg-big{font-size:32px;line-height:40px;font-weight:400}
.dlg-month{font-size:14px}
.dlg-month b{font-weight:500}
.dd-wd{font-size:14px;color:var(--md-on-surface)}
.dd{font-size:14px}
.dd.today{border:1px solid var(--md-primary);color:var(--md-primary)}
.dd.on,.dd.on:hover:not(:disabled){background:var(--md-primary);border-color:var(--md-primary);color:var(--md-on-primary);font-weight:500}
.dd:disabled{color:rgba(24,28,32,.38)}
.dlg-actions{gap:4px}
.dlg-actions .btn,.dlg-actions .btn.ghost{min-height:40px;padding:10px 12px;border:0;background:transparent;color:var(--md-primary);box-shadow:none}
@media (hover:hover){.dlg-actions .btn:hover{background-image:linear-gradient(var(--st-p-hover),var(--st-p-hover));box-shadow:none}}
.tbox{width:96px;height:80px;border:0;border-radius:8px;background:var(--md-surface-container-highest);font-size:48px;font-weight:400}
.tbox.on{background:var(--md-primary-container);color:var(--md-on-primary-container)}
.tcolon{font-size:48px;font-weight:400}
.tbig-in input{width:96px;height:80px;border-radius:8px;font-size:44px}
.dial{background:var(--md-surface-container-highest);box-shadow:none}
.dial-hand{background:var(--md-primary)}
.dial-knob{background:var(--md-primary);color:var(--md-on-primary)}
.dial-c{background:var(--md-primary)}
.dial-n.in{color:var(--md-on-surface-variant)}

/* ---------- 提示訊息（snackbar）：深色底、4px 圓角；照原本的規則從標題欄下面出現 ---------- */
#toast{top:calc(env(safe-area-inset-top,0px) + 72px);padding:14px 16px;border:0;border-radius:4px;background:var(--md-inverse-surface);color:var(--md-inverse-on-surface);box-shadow:var(--md-elev-3);
  font-size:14px;line-height:20px;letter-spacing:.25px;font-weight:400;transform:translate(-50%,-8px);transition:opacity .15s linear,transform .25s var(--md-ease-decel)}
#toast.show{transform:translate(-50%,0)}

/* ---------- 細節 ---------- */
/* 箭頭一律用 Material 圖示（原本是「›」文字）：清單是向右箭頭，展開列表是向下箭頭、展開時轉向 */
.acc-h .chev,.card.linkrow .chev,.dlg-month .icon-btn::before{width:24px;height:24px;flex:none;padding:0;font-size:0;line-height:0;background:currentColor;
  -webkit-mask:var(--ic-chev) center/contain no-repeat;mask:var(--ic-chev) center/contain no-repeat;transition:transform .2s var(--md-ease)}
.acc-h .chev{-webkit-mask-image:var(--ic-expand);mask-image:var(--ic-expand)}
.acc-h.on .chev,.pway input:checked+.acc-h .chev{transform:rotate(180deg)}
.dlg-month .icon-btn{font-size:0}
.dlg-month .icon-btn::before{content:""}
.dlg-month [data-v="-1"]::before{transform:rotate(180deg)}
/* 留言輸入框：一行高，字多時跟著長高（最多 6 行） */
.cmt-form textarea{height:auto;min-height:48px;max-height:168px;field-sizing:content;resize:none;line-height:24px;padding:11px 16px}
.cmt-form .cmt-ph{flex:none}
/* 通知視窗右上角的「關閉」是 text button */
.sheet>.row.between>.btn.ghost.sm{border:0;padding:10px 12px}
/* 第一次進入的介紹：第一頁上方是淺藍的封面區，右下角一個大的掃具圖示 */
.intro-hero{position:relative;overflow:hidden;padding:24px 20px 28px;border-radius:24px;background:var(--md-primary-container);color:var(--md-on-primary-container)}
.intro-hero .lead{color:var(--md-on-primary-container)}
.intro-hero::after{content:"";position:absolute;right:-14px;bottom:-18px;width:132px;height:132px;background:var(--md-primary);opacity:.14;
  -webkit-mask:var(--ic-clean) center/contain no-repeat;mask:var(--ic-clean) center/contain no-repeat}

/* 第十四版：卡片和詳情頁的日期粗體；卡片上日期和時間靠近一點 */
