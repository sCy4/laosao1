    if(r==='worker'){
      const re=canUn?'本體現在可以改選別人了。':'本體 1 小時後可以改選別人（還剩 '+span(unAt-now())+'）。';
      return card('確認接案','<p>本體選了你！你的出價 <b class="price">NT$ '+money(t.price)+'</b>。請在 <b>'+dl+'</b> 前確認接案（還剩 '+left+'），逾時自動撤銷。'+re+'</p>'+
        '<button class="btn block" data-act="acceptMatch" data-id="'+t.id+'">確認接案</button><button class="btn ghost block" data-act="declineMatch" data-id="'+t.id+'">婉拒</button>',true);
    }
    if(r==='poster'){
      const re=canUn?'你現在可以改選別人。':'1 小時後你能改選別人（還剩 '+span(unAt-now())+'）。';
      return card('等替身確認','<div class="chosen">'+idBlock(w)+tagLine(w.id,'替身')+'<div class="row between"><span class="small muted">成交價</span><b class="price">'+ntd(t.price)+'</b></div></div>'+
        '<p>'+re+esc(w.name)+'將在 '+dl+' 前確認接案或婉拒（還剩 '+left+'）。</p>'+
        '<button class="btn ghost block" data-act="unchoose" data-id="'+t.id+'"'+(canUn?'':' disabled')+'>改選別人</button>',false);
    }
    const mine=m?t.offers.find(o=>o.user===m.id):null;
    return card('',(mine?'<div class="row between pc-row"><span class="muted">你的出價</span><span class="price">'+ntd(mine.price)+'</span></div>':'')+
      '<p class="small muted center">本體已選其他人，正在等對方確認。對方沒有確認的話，案件會重新召喚替身。</p>',false);
  }
  if(t.status==='assigned'){
    const begun=now()>=t.start,over=now()>=t.end,autoAt=fmtTime(t.end+24*H);
    if(r==='worker')return card('打掃完成後',photoBlock(t,true)+
      '<button class="btn block" data-act="requestPay" data-id="'+t.id+'"'+(begun?'':' disabled')+'>打掃完成</button>'+
      '<p class="small muted">'+(!begun?'開工時間 '+fmtTime(t.start)+' 到了才能按（'+when(t)+'）。':over?'已過結束時間。沒有按的話，'+autoAt+' 會自動算打掃完成。':'按下後會通知本體驗收。提早完成也可以直接按。')+'</p>',begun);
    if(r==='poster')return card(begun?'打掃中':'待開工','<p class="small muted">'+(over?'已過結束時間，替身還沒按「打掃完成」。'+autoAt+' 會自動算打掃完成。':'替身完成後會通知你驗收。')+'</p>',false);
    return '';
  }
  if(t.status==='done'){
    const autoAt=t.requestedAt+3*D,auto=fmtTime(autoAt)+' 會自動驗收完成（還剩 '+span(autoAt-now())+'）。';
    if(r==='poster')return card('驗收',(t.autoDone?'<p class="small muted">替身沒有按打掃完成，已在結束時間 24 小時後自動算打掃完成。</p>':'')+photoBlock(t,false)+
      '<p class="small muted">驗收完成後會顯示替身的收款方式。沒有驗收的話，'+auto+'</p><button class="btn block" data-act="confirmDone" data-id="'+t.id+'">驗收完成</button>',true);
    if(r==='worker')return card('等本體驗收','<p class="small muted">'+(t.autoDone?'你沒有按打掃完成，已自動算打掃完成。':'已通知本體驗收。')+'本體沒有驗收的話，'+auto+'</p>'+photoBlock(t,false),false);
    return '';
  }
  if(t.status==='confirmed'){
    const b=w.bank,autoNote=t.autoConfirmed?'<p class="small muted">'+(r==='poster'?'你沒有在 3 天內驗收，已自動驗收完成。':'本體沒有在 3 天內驗收，已自動驗收完成。')+'</p>':'';
    if(r==='poster'){
      const lp=w.linepay,ways=[b?'bank':'',lp?'linepay':''].filter(Boolean),opts=ways.length?ways:['bank','linepay'],one=opts.length===1,WN={bank:'銀行轉帳',linepay:'LINE Pay'};
      let body=autoNote+payBanner(t,r)+'<div class="row between pc-row"><span class="muted">金額</span><b class="price">'+ntd(t.price)+'</b></div>'+
        (ways.length?'':'<p>替身還沒設定收款方式，請在留言板跟替身確認。</p>')+
        '<form data-form="pay" data-id="'+t.id+'" class="stack" novalidate><div class="field"><span class="lbl" id="pw">'+(one?'付款方式':'選一種付款方式')+'</span><div class="pay-acc" role="radiogroup" aria-labelledby="pw">';
      opts.forEach(k=>{
        body+='<div class="pway"><input type="radio" class="vh" name="method" id="pm-'+k+'" value="'+k+'"'+(one?' checked':'')+'>'+
          '<label for="pm-'+k+'" class="acc-h"><span class="radio-dot" aria-hidden="true"></span><span class="acc-t">'+WN[k]+'</span><span class="chev" aria-hidden="true">›</span></label><div class="acc-b pway-b">';
        if(k==='bank')body+=(b?'<div class="bank"><div><span class="small muted">銀行</span><b>'+b.code+' '+(BANKS[b.code]||'')+'</b></div><div><span class="small muted">帳號</span><b class="mono">'+esc(b.acct)+'</b></div><div><span class="small muted">戶名</span><b>'+esc(b.name)+'</b></div></div>'+
            '<button class="btn ghost sm" type="button" data-act="copy" data-v="'+esc(b.acct)+'">複製帳號</button>':'')+
          '<div class="field"><label for="l5">你的匯款帳號末五碼</label><input id="l5" name="last5" inputmode="numeric" maxlength="5"></div>';
        else body+=lp?'<img class="qr" src="'+lp.qr+'" alt="'+esc(w.name)+'的 LINE Pay 收款碼" data-act="viewImg"><span class="small muted">用 LINE Pay 掃描收款碼付款。</span>':'';
        body+='</div></div>';
      });
      body+='</div></div><p class="small muted">只付款到這裡顯示的收款方式。對方私下要求改用其他帳號或收款碼的話，請先確認清楚再付款。</p>'+
        '<button class="btn block" type="submit">我已付款</button></form>';
      return card('付款給替身',body,true);
    }
    if(r==='worker')return card('等本體付款',autoNote+payBanner(t,r)+'<p class="small">本體已驗收，會付款 NT$ '+money(t.price)+' 給你。'+(hasPay(w)?'':'你沒有提供收款方式，請和本體約定付款方式。')+'</p>',false);
    return '';
  }
  if(t.status==='paid'){
    const how=t.payment.last5?'匯款，帳號末五碼 <b class="mono">'+esc(t.payment.last5)+'</b>':'用 '+esc(t.payment.method)+' 付款';
    if(r==='worker')return card('確認收款',payBanner(t,r)+'<p>本體表示已'+how+'，金額 <b class="price">NT$ '+money(t.price)+'</b>。</p>'+
      '<button class="btn block" data-act="received" data-id="'+t.id+'">我已收款</button><p class="small muted">還沒收到的話，先在留言板跟本體確認。</p>',true);
    if(r==='poster')return card('等替身確認收款',payBanner(t,r)+'<p class="small">你已'+how+'，等替身確認收款。</p>',false);
    return '';
  }
  if(t.status==='closed'){
    const pb=r==='viewer'?'':photoBlock(t,false);
    return '<div class="banner info">案件已完成'+(t.payment?'（'+(t.payment.last5?'匯款末五碼 '+esc(t.payment.last5):'用 '+esc(t.payment.method)+' 付款')+'）':'')+'。</div>'+(pb?'<section class="card">'+pb+'</section>':'');
  }
  if(t.status==='cancelled'){
    let h='<div class="banner">'+esc(endReason(t,r))+'</div>';
    const k=t.cancelKind,n=t.endNote;
    /* 本體結束案件時寫的原因和照片，雙方都看得到 */
    if(k==='notdone'&&n&&r!=='viewer')h+=card(r==='poster'?'你寫的原因':'本體寫的原因','<p class="cmt-txt">'+esc(n.text)+'</p>'+
      (n.photos&&n.photos.length?'<div class="endnote-photos">'+n.photos.map((src,i)=>'<div class="ph"><img src="'+src+'" alt="照片證明 '+(i+1)+'" data-act="viewImg"></div>').join('')+'</div><p class="small muted">照片會在 '+fmtTime(t.cancelAt+7*D)+' 自動刪除。</p>':'')+
      (n.photosGone?'<p class="small muted">照片已在案件取消 7 天後自動刪除。</p>':''),false);
    /* 替身上傳過的打掃證明也留給雙方看 */
    const pb=r==='viewer'?'':photoBlock(t,false);if(pb)h+='<section class="card">'+pb+'</section>';
    /* 被結束的一方：可以直接把對方加入黑名單 */
    if((k==='fail'&&r==='poster')||(k==='notdone'&&r==='worker')||(k==='unpaid'&&r==='poster')){
      const oid=r==='poster'?t.assignee:t.poster,o=u(oid),g=tagOf(oid);
      h+=g&&g.type==='black'?'<p class="small muted center">你已經把'+esc(o.name)+'加入黑名單。</p>'
        :'<button class="btn ghost block" data-act="setTag" data-uid="'+oid+'" data-type="black">把'+esc(o.name)+'加入黑名單</button>';
    }
    return h;
  }
  return '';
}
/* 取消或退出：放在最下面，樣式淡一點。
   開工前的取消、退出是正常選項；開工後的「結束案件」不鼓勵使用，只在條件到了才出現，並收在「案件遇到問題？」裡 */
function exitArea(t,r){
  const s=t.status,n=now(),q=(act,label)=>'<button class="btn quiet" data-act="'+act+'" data-id="'+t.id+'">'+label+'</button>',tip=x=>'<p class="small muted center">'+x+'</p>';
  if(n<t.start){
    if(r==='poster'&&(s==='open'||s==='pending'||s==='assigned'))return '<div class="exit">'+q('cancelTask','取消案件')+'<p class="small muted">開工前都可以取消。</p></div>';
    if(r==='worker'&&s==='assigned')return '<div class="exit">'+q('withdrawAssign','退出案件')+'<p class="small muted">開工前都可以退出。</p></div>';
    return '';
  }
  /* 開工後（替身收款問題：驗收後）就出現「案件遇到問題？」；還不能結束案件時，只說明什麼時候可以，先引導溝通 */
  let trouble='';
  if(r==='worker'&&s==='assigned')
    trouble=tip('建議先在留言板跟本體說明。如果真的無法完成，可以結束案件，案件會直接取消。')+q('failTask','結束案件：無法完成');
  else if(r==='poster'&&(s==='assigned'||s==='done')){
    const at=t.end+24*H;
    trouble=n>=at?tip('建議先在留言板跟替身確認。如果替身真的沒有完成，可以結束案件，需要寫原因並附上照片。')+q('openNotDone','結束案件：替身未完成')
      :tip('有疑慮請先在留言板跟替身溝通。開工時間結束 24 小時後，也就是 '+fmtTime(at)+' 之後，如果替身真的沒有完成，才能選擇「結束案件：替身未完成」。');
  }else if(r==='worker'&&(s==='confirmed'||s==='paid')&&t.confirmedAt){
    const at=t.confirmedAt+7*D;
    trouble=n>=at?tip('建議先在留言板跟本體確認。如果一直沒收到款項，可以結束案件。')+q('unpaid','結束案件：沒收到款項')
      :tip('有疑慮請先在留言板跟本體確認。驗收 7 天後，也就是 '+fmtTime(at)+' 之後，如果還沒收到款項，才能選擇「結束案件：沒收到款項」。');
  }
  const note=s==='assigned'&&(r==='poster'||r==='worker')?'<p class="small muted">已經開工，不能'+(r==='worker'?'退出':'取消')+'了。有狀況請在留言板說明。</p>':'';
  if(!trouble)return note?'<div class="exit">'+note+'</div>':'';
  return '<div class="exit">'+note+'<details class="trouble"><summary>案件遇到問題？</summary>'+trouble+'</details></div>';
}
function detailView(){
  const t=T(ui.detailId);
  if(!t)return '<div class="empty"><b>找不到這個案件</b><span class="small">可能是連結有誤，或示範資料已經重設。</span><button class="btn ghost sm" data-act="tab" data-v="browse">回到接案</button></div>';
  const r=role(t,S.me),p=u(t.poster),w=t.assignee?u(t.assignee):null,out=[];
  if(r!=='viewer')out.push(stepper(t));
  out.push(summaryCard(t));
  out.push(nextStep(t,r));
  if(r==='viewer'){const g=tagOf(t.poster);if(g)out.push('<div class="banner warn row wrap">你標記過這位本體：'+tagChip(g)+'</div>');}
  out.push(commentSection(t,r));
  if(w&&r!=='viewer'&&t.status!=='pending')out.push(r==='poster'?personCard('替身',w,false):personCard('本體',p,false));
  out.push(exitArea(t,r));
  return out.join('');
}

/* ---------- 日期、時間選擇視窗（發案和篩選共用，疊在其他視窗上面） ----------
   ui.dlg.target：post（發案日期）、from／to（篩選日期）、start／end（發案時間）、tmin／tmax（篩選時段）
   全站一律 24 小時制：時鐘外圈是 00～11 點，內圈是 12～23 點 */
const DLG_TITLE={post:'選取日期',from:'選取最早日期',to:'選取最晚日期',start:'選取開工時間',end:'選取結束時間',tmin:'選取最早開工時間',tmax:'選取最晚結束時間'};
function isFilterT(k){return k==='from'||k==='to'||k==='tmin'||k==='tmax';}
function dateOk(ds,target){
  const today=toDate(new Date(now())),maxD=toDate(new Date(now()+60*D));
  if(ds<today||ds>maxD)return false;
  return target==='post'?!!firstSlot(ds):true;
}
function dateDlg(){
  const g=ui.dlg,sel=new Date(g.sel+'T00:00'),today=toDate(new Date(now())),maxD=toDate(new Date(now()+60*D));

    body='<div class="field"><label for="dlg-date" class="small muted">輸入日期</label><input id="dlg-date" class="dlg-input" inputmode="numeric" autocomplete="off" placeholder="年/月/日" value="'+g.sel.replace(/-/g,'/')+'"></div>';
  }else{
    const ym=g.month.split('-').map(Number),y=ym[0],mo=ym[1],lead=(new Date(y,mo-1,1).getDay()+6)%7,days=new Date(y,mo,0).getDate();
    let cells='';for(let i=0;i<lead;i++)cells+='<span></span>';
    for(let d=1;d<=days;d++){const ds=toDate(new Date(y,mo-1,d)),dis=!dateOk(ds,g.target),on=ds===g.sel;
      cells+='<button type="button" class="dd'+(on?' on':'')+(ds===today?' today':'')+'" data-act="dPick" data-v="'+ds+'"'+(dis?' disabled':'')+' aria-pressed="'+on+'" aria-label="'+mo+' 月 '+d+' 日">'+d+'</button>';}
    body='<div class="row between dlg-month"><b>'+y+'年'+mo+'月</b><span class="row"><button type="button" class="icon-btn" data-act="dMonth" data-v="-1"'+(g.month>today.slice(0,7)?'':' disabled')+' aria-label="上個月">‹</button><button type="button" class="icon-btn" data-act="dMonth" data-v="1"'+(g.month<maxD.slice(0,7)?'':' disabled')+' aria-label="下個月">›</button></span></div>'+
      '<div class="dd-grid">'+'一二三四五六日'.split('').map(w=>'<span class="dd-wd">'+w+'</span>').join('')+cells+'</div>';
  }
  return '<div class="dlg-title">'+DLG_TITLE[g.target]+'</div>'+
    '<div class="row between dlg-big"><span>'+sel.getFullYear()+'年'+(sel.getMonth()+1)+'月'+sel.getDate()+'日</span><button type="button" class="icon-btn" data-act="dInput" aria-label="'+(g.input?'改用日曆選擇':'手動輸入日期')+'">'+(g.input?IC.cal:IC.pen)+'</button></div>'+
    body+'<div class="dlg-actions">'+(isFilterT(g.target)?'<button type="button" class="btn ghost" data-act="dClear">不限</button><span class="grow"></span>':'')+'<button type="button" class="btn ghost" data-act="dlgClose">取消</button><button type="button" class="btn" data-act="dOk">確定</button></div>';
}
function dialHTML(g){return '<div class="dial" aria-hidden="true">'+dialInner(g)+'</div>';}
/* 錶盤裡面的數字、指針（拖曳時只換這些，不換掉手指按著的錶盤本身） */
function dialInner(g){
  const C=120,RO=92,RI=58,rad=a=>a*Math.PI/180;
  const pos=(a,R)=>'left:'+(C+R*Math.sin(rad(a))).toFixed(1)+'px;top:'+(C-R*Math.cos(rad(a))).toFixed(1)+'px';
  let labels='',ang,R,knob;
  if(g.mode==='h'){
    for(let i=0;i<12;i++){
      labels+='<span class="dial-n'+(g.h===i?' on':'')+'" style="'+pos(i*30,RO)+'">'+pad(i)+'</span>';
      labels+='<span class="dial-n in'+(g.h===i+12?' on':'')+'" style="'+pos(i*30,RI)+'">'+(i+12)+'</span>';
    }
    ang=(g.h%12)*30;R=g.h>=12?RI:RO;knob=pad(g.h);
  }else{
    for(let i=0;i<12;i++)labels+='<span class="dial-n'+(g.m===i*5?' on':'')+'" style="'+pos(i*30,RO)+'">'+pad(i*5)+'</span>';
    ang=g.m*6;R=RO;knob=pad(g.m);
  }
  return labels+'<span class="dial-hand" style="top:'+(C-R)+'px;height:'+R+'px;transform:rotate('+ang+'deg)"></span>'+
    '<span class="dial-knob'+(R===RI?' in':'')+'" style="'+pos(ang,R)+'">'+knob+'</span><span class="dial-c"></span>';
}

function parseDateIn(target){
  const el=document.getElementById('dlg-date');if(!el)return null;
  const p=el.value.trim().split(/[\/\-.\s]+/).map(Number);if(p.length!==3||p.some(isNaN))return null;
  const dt=new Date(p[0],p[1]-1,p[2]);if(dt.getMonth()!==p[1]-1)return null;
  const ds=toDate(dt);
  return dateOk(ds,target)?ds:null;
}
function readTimeIn(){
  const h=Number((document.getElementById('dlg-h')||{}).value),m=Number((document.getElementById('dlg-m')||{}).value);
  if(!(h>=0&&h<=23)||!(m>=0&&m<=59)||!Number.isInteger(h)||!Number.isInteger(m))return null;
  return {h:h,m:m};
}

function dialSet(e){
  const el=document.querySelector('.dial');if(!el||!ui.dlg)return;
  const r=el.getBoundingClientRect(),x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2);
  let a=Math.atan2(x,-y)*180/Math.PI;if(a<0)a+=360;
  const g=ui.dlg,idx=Math.round(a/30)%12,dist=Math.hypot(x,y)*(240/r.width);
  if(g.mode==='h')g.h=idx+(dist<75?12:0);else g.m=Math.round(a/6)%60;
  /* 手機上如果把手指按著的元素換掉，放開的訊號就收不到，所以這裡只更新錶盤內容和上方的數字 */
  el.innerHTML=dialInner(g);
  const bh=document.querySelector('.tbox[data-v="h"]'),bm=document.querySelector('.tbox[data-v="m"]');
  if(bh)bh.textContent=pad(g.h);if(bm)bm.textContent=pad(g.m);
}

function saveDraft(){if(!S.me)return;try{const all=JSON.parse(localStorage.getItem(DRAFT_KEY)||'{}');all[S.me]=ui.pf;localStorage.setItem(DRAFT_KEY,JSON.stringify(all));}catch(e){}}
function clearDraft(){if(!S.me)return;try{const all=JSON.parse(localStorage.getItem(DRAFT_KEY)||'{}');delete all[S.me];localStorage.setItem(DRAFT_KEY,JSON.stringify(all));}catch(e){}}
function loadDraft(uid){
  try{const d=(JSON.parse(localStorage.getItem(DRAFT_KEY)||'{}'))[uid];if(!d)return null;
    const pf=Object.assign(pfdef(),d),def=pfdef(),today=toDate(new Date(now()));
    if(!pf.date||pf.date<today||!firstSlot(pf.date)){pf.date=def.date;pf.month=def.month;pf.start=def.start;pf.end=def.end;}
    else if(!slotOk(pf.date,pf.start)){const f=firstSlot(pf.date);pf.start=f;pf.end=fromMin(Math.min(toMin(f)+60,MAXEND));}
    return pf;}catch(e){return null;}
}

/* ---------- 方案 K（Material Design 3）設計測試 ----------
   目前只有「我的案件」換成方案 K，其他頁面維持方案 I，方便對照。做法是切換兩段 <style> 的 media（theme-i、theme-k），畫面結構不變 */
function pageTheme(){return ui.view==='list'&&ui.tab==='mine'?'k':'i';}
function setTheme(k){
  const r=document.documentElement;if(r.dataset.theme===k)return;
  r.dataset.theme=k;
  const a=document.getElementById('theme-i'),b=document.getElementById('theme-k');
  if(a)a.media=k==='k'?'not all':'all';
  if(b)b.media=k==='k'?'all':'not all';
}
/* 上方應用程式列：往下捲時換底色（M3 的捲動狀態） */
function topScrolled(){const h=document.querySelector('header.top');if(h)h.classList.toggle('scrolled',window.scrollY>0);}
window.addEventListener('scroll',topScrolled,{passive:true});
/* 底部分頁的膠囊、分段按鈕的勾勾：只在「換了」的那一次播放動畫，其他原因重畫畫面時不重播 */
let kPrev=null;
function kMotion(){
  const cur={tab:ui.tab,seg:ui.mineRole};
  if(kPrev){
    const sel=cur.tab!==kPrev.tab?'nav.tabs button.on':cur.seg!==kPrev.seg?'.seg button.on':'';
    const el=sel&&document.querySelector(sel);if(el)el.classList.add('k-in');
  }
  kPrev=cur;
}
/* 按下時的水波紋（Material 的按壓回饋）：只在套用方案 K 的頁面；圓形圖示按鈕從中間擴散，其他從手指的位置擴散 */
document.addEventListener('pointerdown',e=>{
  if(document.documentElement.dataset.theme!=='k'||e.button>0)return;
  const el=e.target.closest&&e.target.closest('.tc-open,.seg button,.btn,.icon-btn,.favbtn,.note,.acct-row');
  if(!el||el.disabled)return;
  try{if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;}catch(x){}
  const r=el.getBoundingClientRect(),round=el.matches('.icon-btn,.favbtn');
  const x=round?r.width/2:e.clientX-r.left,y=round?r.height/2:e.clientY-r.top;
  const d=round?Math.max(r.width,r.height):2*Math.hypot(Math.max(x,r.width-x),Math.max(y,r.height-y));
  const s=document.createElement('span');s.className='k-ripple';s.setAttribute('aria-hidden','true');
  s.style.cssText='width:'+d+'px;height:'+d+'px;left:'+(x-d/2)+'px;top:'+(y-d/2)+'px';
  el.appendChild(s);setTimeout(()=>s.remove(),600);
},{passive:true});

let fxKeys=null;  /* 方案 I：記住上一次畫的是哪一頁、哪個視窗，換了才播進場動畫 */
function render(){
  const app=document.getElementById('app');
  sweep();
  if(S.me&&!u(S.me))S.me=null;
  let body;
  if(ui.view==='detail')body=detailView();
  else if(!S.me&&ui.tab!=='browse')body=gateView(ui.tab);
  else body=({browse:browseView,post:postView,mine:mineView,me:meView}[ui.tab]||browseView)();
  setTheme(pageTheme());
  /* 示範工具只在原型裡用，放在每一頁內容的最下面，不佔標題欄 */
  app.innerHTML=headerView()+'<main>'+body+'<div class="demo-entry"><button class="btn ghost sm" data-act="openDemo">示範工具</button><span class="small muted">原型才有，正式版不會出現</span></div></main>'+tabsView()+modalView()+dlgView();
  const k={p:[ui.view,ui.tab,ui.detailId,ui.meSub,ui.mineRole,ui.pastKind,ui.histSeg].join('|'),
    m:ui.modal?[ui.modal.type,ui.modal.step||0,ui.modal.title||''].join('|'):'',d:ui.dlg?ui.dlg.kind+'|'+ui.dlg.target:''};
  const pk=fxKeys||{p:k.p,m:'',d:''};  /* 第一次畫面不播換頁動畫，但第一次進入的介紹視窗會播 */
  const ms=app.querySelector('.m-layer .sheet'),ds=app.querySelector('.d-layer .sheet');
  if(ms&&k.m!==pk.m)ms.classList.add('fx-in');
  if(ds&&k.d!==pk.d)ds.classList.add('fx-in');
  fxKeys=k;
  if(ui.top){window.scrollTo(0,0);ui.top=false;}
  kMotion();topScrolled();
  fixNotes();
  centerTimeCols();
  document.querySelectorAll('.cmts').forEach(c=>{c.scrollTop=c.scrollHeight;});
  if(ui.tagScroll){ui.tagScroll=false;const m=document.querySelector('.tagmenu');if(m)m.scrollIntoView({block:'nearest'});}  /* 打開標記選單時，捲到整個選單都看得到 */
  if(ui.tagCustom){const i=document.querySelector('.tm-custom input');if(i&&document.activeElement!==i)i.focus();}
  const af=document.querySelector('.sheet [data-autofocus]');if(af&&document.activeElement!==af){try{af.focus({preventScroll:true});}catch(x){}}
  if(S.me)saveDraft();
}

const F={
  offer(f,d){
    const m=me();if(suspended(m))return toast('停權中不能出價');if(!genderOk(T(d.id),m))return toast('這個案件有指定性別，你沒辦法出價');if(!hasPay(m))return toast('出價前要先設定收款方式');
    const raw=v(f,'price'),price=Math.round(Number(raw));
    if(!raw||!(price>0))return ferr(f.elements.price,'請輸入出價金額');
    const t=T(d.id),msg='',ex=t.offers.find(o=>o.user===m.id);
    if(ex){ex.price=price;ex.msg=msg;ex.at=now();toast('已更新出價');}
    else{t.offers.push({id:nid('o'),user:m.id,price,msg,at:now()});notify(t.poster,'有人出價 NT$ '+money(price),t.id);toast('已送出出價，等本體選人');}
    ui.modal=null;save();fx('lime','唰！');
  },
  post(f){
    const m=me(),pf=ui.pf;if(suspended(m))return toast('停權中不能發案');
    if(!pf.date||!pf.start||!pf.end)return ferr(f.querySelector('[data-act="openDate"]'),'請選日期、開工和結束時間');
    const start=new Date(pf.date+'T'+pf.start).getTime(),end=new Date(pf.date+'T'+pf.end).getTime();
    if(!(end>start))return ferr(f.querySelector('[data-w="end"]'),'結束時間要晚於開工時間');
    if(!(start>now()+H))return ferr(f.querySelector('[data-w="start"]'),'開工時間至少要在 1 小時後');
    if(!v(f,'building'))return ferr(f.elements.building,'請填地點');
    if(!v(f,'meet'))return ferr(f.elements.meet,'請填集合位置');
    const g=f.querySelector('input[name=gender]:checked');if(!g)return ferr(f.elements.gender,'請選擇替身性別');
    const bs=v(f,'budget');let budget=null;
    if(bs){budget=Math.round(Number(bs));if(!(budget>=50&&budget<=5000))return ferr(f.elements.budget,'標價請在 NT$ 50 到 5,000 之間');}
    /* 案件發布後不能修改，所以先給本體看一次摘要，確認後才發布 */
    ui.postDraft={building:v(f,'building'),meet:v(f,'meet'),gender:g.value,start,end,budget,note:v(f,'note')};ui.modal={type:'postConfirm'};
  },
  pay(f,d){
    const t=T(d.id);
    const sel=f.querySelector('input[name=method]:checked');
    if(!sel)return ferr(f.querySelector('.pay-acc'),'請選擇付款方式');
    if(sel.value==='bank'){const x=v(f,'last5');if(!/^\d{5}$/.test(x))return ferr(f.elements.last5,'請輸入 5 位數字');t.payment={last5:x,method:'銀行轉帳',at:now()};}
    else t.payment={last5:null,method:'LINE Pay',at:now()};
    t.status='paid';notify(t.assignee,'本體已付款 NT$ '+money(t.price)+'，收到後請按「我已收款」',t.id);save();fx('gold','咻！');toast('已通知替身確認收款');
  },
  /* 登入第 1 步：輸入學校信箱（只要打學號，也接受貼上整個信箱） */
  loginEmail(f){
    const sid=v(f,'sid').toLowerCase().replace(MAIL_DOMAIN,'');
    if(!/^[a-z]\d{8}$/.test(sid))return ferr(f.elements.sid,'請輸入學號，例如 s15330124');
    ui.login={step:'code',sid:sid.toUpperCase(),email:sid+MAIL_DOMAIN};sendCode();
  },
  /* 登入第 2 步：輸入驗證碼 */
  loginCode(f){
    const L=ui.login,code=v(f,'code').replace(/\s/g,'');
    if(!L||!L.code)return toast('請重新寄送驗證碼');
    if(now()>L.sentAt+10*M)return ferr(f.elements.code,'驗證碼已過期，請按「重新寄送」');
    if(code!==L.code)return ferr(f.elements.code,'驗證碼不對，請再確認一次');
    const x=S.users.find(x=>x.email===L.email);
    if(x)return loginAs(x.id);
    L.step='profile';
  },
  /* 登入第 3 步（只有第一次）：填姓名和性別，學號從信箱來 */
  loginProfile(f){
    const L=ui.login,name=v(f,'name'),g=f.querySelector('input[name=gender]:checked');
    if(!name)return ferr(f.elements.name,'請填姓名');
    if(!g)return ferr(f.elements.gender,'請選擇性別');
    const x={id:nid('u'),name,sid:L.sid,email:L.email,gender:g.value,cls:v(f,'cls').toUpperCase(),bank:null,doneWork:0,donePost:0,dropped:0,suspendedUntil:0};
    S.users.push(x);loginAs(x.id);
  },
  profile(f){
    const m=me(),name=v(f,'name'),g=f.querySelector('input[name=gender]:checked');
    if(!name)return ferr(f.elements.name,'請填姓名');
    if(!g||!g.value)return ferr(f.elements.gender,'請選擇性別');
    if(name!==m.name&&m.nameAt&&now()<m.nameAt+30*D)return ferr(f.elements.name,'姓名 30 天內只能改一次，'+fmtTime(m.nameAt+30*D)+' 之後才能再改');
    if(m.bank&&m.bank.name!==name)return ferr(f.elements.name,'姓名要和收款方式的戶名相同，請先到「收款方式」修改或移除');
    if(name!==m.name)m.nameAt=now();
    Object.assign(m,{name,gender:g.value,cls:v(f,'cls').toUpperCase()});
    save();toast('資料已更新');return goBack('#me');
  },
  bank(f){
    const m=me(),code=v(f,'code'),acct=v(f,'acct').replace(/[\s-]/g,''),bname=v(f,'bname');
    if(!code)return ferr(f.elements.code,'請選擇銀行');
    if(!/^\d{10,16}$/.test(acct))return ferr(f.elements.acct,'帳號請輸入 10 到 16 位數字');
    if(bname!==m.name)return ferr(f.elements.bname,'戶名必須和姓名「'+m.name+'」相同');
    m.bank={code,acct,name:bname};ui.payOpen=null;save();
    if(ui.payReturn){const id=ui.payReturn;ui.payReturn=null;toast('收款方式已儲存，現在可以出價了');return goBack('#task-'+id);}
    toast('收款方式已儲存');
  },
  filter(f){
    const fd=ui.fd||ui.f,from=fd.from,to=fd.to,tmin=fd.tmin,tmax=fd.tmax,pmin=v(f,'pmin'),pmax=v(f,'pmax');
    if(tmin!==''&&tmax!==''&&Number(tmax)<=Number(tmin))return ferr(f.querySelector('[data-w="tmax"]'),'最晚結束時間要晚於最早開工時間');
    if(from&&to&&to<from)return ferr(f.querySelector('[data-w="to"]'),'最晚日期不能早於最早日期');
    if(pmin!==''&&pmax!==''&&Number(pmax)<Number(pmin))return ferr(f.elements.pmax,'最高標價不能低於最低標價');
    const genders=Array.from(f.querySelectorAll('input[name=g]:checked')).map(x=>x.value);
    if(!genders.length)return ferr(f.elements.g,'至少勾選一種替身性別');
    ui.f={from,to,tmin,tmax,pmin,pmax,genders};ui.fd=null;ui.modal=null;
  },
  comment(f,d){
    const t=T(d.id),text=v(f,'text'),imgs=(ui.cimg[t.id]||[]).slice();
    if(!text&&!imgs.length)return ferr(f.elements.text,'請輸入留言或加上照片');
    if(CMT_OPEN.indexOf(t.status)<0)return toast('這個案件的留言板已經關閉');
    t.comments=t.comments||[];t.comments.push({id:nid('c'),user:S.me,text,imgs,at:now()});
    notifyCmt(S.me===t.poster?t.assignee:t.poster,t,me(),text,imgs.length);
    t.seen=t.seen||{};t.seen[S.me]=now();ui.cdraft[t.id]='';ui.cimg[t.id]=[];save();
  },
  /* 本體結束案件：替身未完成（必須寫原因、附至少 1 張照片） */
  notdone(f,d){
    const t=T(d.id),dr=ui.endDraft||{text:'',photos:[]},text=v(f,'text');
    if(!(t.status==='assigned'||t.status==='done')||now()<t.end+24*H)return toast('現在不能結束案件');
    if(!text)return ferr(f.elements.text,'請寫下原因');
    if(!dr.photos.length)return ferr(f.querySelector('#nd-f'),'請至少附上 1 張照片');
    t.status='cancelled';t.cancelKind='notdone';t.cancelAt=now();t.cancelReason='本體結束了案件：替身未完成';
    t.endNote={text,photos:dr.photos.slice(),at:now()};
    notify(t.assignee,'本體結束了案件，表示你未完成，請到案件裡查看原因',t.id);
    ui.modal=null;ui.endDraft=null;save();toast('已結束案件');
  },
  tag(f,d){
    const text=v(f,'text');if(!text)return ferr(f.elements.text,'請輸入自訂內容');
    S.tags[S.me]=S.tags[S.me]||{};S.tags[S.me][d.uid]={type:'custom',text,at:now()};
    ui.tagMenu=null;ui.tagCustom=false;save();toast('已儲存標記');
  }
};

/* ---------- 照片 ---------- */
function shrink(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{const max=640,s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');
      c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',0.7));};
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('bad image'));};
    img.src=url;
  });
}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(ui.tagMenu&&!e.target.closest('.tagwrap')){ui.tagMenu=null;ui.tagCustom=false;if(!el){render();return;}}
  if(ui.moreMenu&&!e.target.closest('.morewrap')){ui.moreMenu=false;if(!el){render();return;}}
  if(!el)return;
  const fn=A[el.dataset.act];if(!fn)return;
  if(el.dataset.act!=='scrim'&&el.dataset.act!=='dscrim')e.preventDefault();
  if(fn(el.dataset,el,e)!==false)render();
});
document.addEventListener('submit',e=>{
  const f=e.target;if(!f.dataset||!f.dataset.form)return;
  e.preventDefault();
  if(F[f.dataset.form](f,f.dataset)!==false)render();
});
document.addEventListener('input',e=>{
  clearErr(e.target);
  const el=e.target,pf=el.form&&el.form.dataset.form==='post';
  if(el.id==='m-cls'||el.id==='lp-cls'){const p=el.selectionStart,up=el.value.toUpperCase();if(up!==el.value){el.value=up;try{el.setSelectionRange(p,p);}catch(x){}}return;}
  if(el.id==='cmt-in'&&el.form){ui.cdraft[el.form.dataset.id]=el.value;return;}
  if(el.id==='nd-text'&&ui.endDraft){ui.endDraft.text=el.value;return;}
  if(el.id==='lg-code'&&el.form&&el.value.replace(/\D/g,'').length===6){if(el.form.requestSubmit)el.form.requestSubmit();else el.form.dispatchEvent(new Event('submit',{cancelable:true,bubbles:true}));return;}
  if(el.form&&el.form.dataset.form==='filter'&&ui.fd){if(el.name==='pmin'||el.name==='pmax')ui.fd[el.name]=el.value;if(el.name==='g')ui.fd.genders=Array.from(el.form.querySelectorAll('input[name=g]:checked')).map(x=>x.value);return;}
  if(pf&&['building','meet','budget','note','gender'].indexOf(el.name)>=0){ui.pf[el.name]=el.value;saveDraft();return;}
  if(el.id!=='q')return;
  ui.q=el.value;const box=document.getElementById('blist');if(box){box.innerHTML=browseList();fixNotes();}
});
window.addEventListener('resize',()=>fixNotes());
document.addEventListener('change',async e=>{
  const el=e.target;
  if(el.id==='sort'){ui.sort=el.value;render();return;}
  if(el.form&&el.form.dataset.form==='post'&&el.name==='gender'){ui.pf.gender=el.value;return;}
  if(el.classList.contains('tb-input')){const t=parseTime(el.value);if(t===null){toast('請輸入像 14:35 或 1435 的時間');}else{const r=setTime(el.dataset.w,t);if(r!==true)toast(r);}render();return;}if(!el.dataset||!el.dataset.upload)return;
  const files=Array.from(el.files||[]),kind=el.dataset.upload,id=el.dataset.id;if(!files.length)return;
  const out=[];let bad=0;
  for(const file of files){try{out.push(await shrink(file));}catch(err){bad++;}}
  /* 打掃證明直接存進案件；留言照片和結束案件的照片先放草稿，按送出才存 */
  if(kind==='linepay'){if(!out.length)return toast('讀不到這張圖片');me().linepay={qr:out[0],at:now()};ui.payOpen=null;save();
    if(ui.payReturn){const rid=ui.payReturn;ui.payReturn=null;toast('收款方式已儲存，現在可以出價了');goBack('#task-'+rid);render();return;}
    render();toast('已儲存 LINE Pay 收款碼');return;}
  /* 照片張數上限：打掃證明、留言照片每個案件各 12 張，結束案件的照片證明 6 張 */
  let cut=false;
  if(kind==='cimg'){const t=T(id),used=(t.comments||[]).reduce((a,c)=>a+((c.imgs||[]).length),0)+(ui.cimg[id]||[]).length,room=Math.max(0,PH_MAX-used);cut=out.length>room;ui.cimg[id]=(ui.cimg[id]||[]).concat(out.slice(0,room));render();if(cut)toast('留言照片每個案件最多 '+PH_MAX+' 張');}
  else if(kind==='endnote'){if(ui.endDraft){const room=Math.max(0,END_MAX-ui.endDraft.photos.length);cut=out.length>room;ui.endDraft.photos=ui.endDraft.photos.concat(out.slice(0,room));}renderModal();if(cut)toast('照片證明最多 '+END_MAX+' 張');}
  else{const t=T(id),room=Math.max(0,PH_MAX-t.photos.length);cut=out.length>room;out.slice(0,room).forEach(src=>t.photos.push({src,at:now()}));save();render();if(cut)toast('打掃證明最多 '+PH_MAX+' 張');else if(!bad)toast('已上傳 '+Math.min(out.length,room)+' 張');}
  if(bad)toast('有 '+bad+' 張讀不到');
});
document.addEventListener('pointerdown',e=>{const d=e.target.closest&&e.target.closest('.dial');if(!d)return;ui.drag=true;e.preventDefault();try{d.setPointerCapture(e.pointerId);}catch(x){}dialSet(e);});
document.addEventListener('pointermove',e=>{if(ui.drag)dialSet(e);});
/* 放開手指：選完小時就自動換選分鐘（跟 Google 日曆一樣） */
function dialEnd(){if(!ui.drag)return;ui.drag=false;if(ui.dlg&&ui.dlg.mode==='h'){ui.dlg.mode='m';renderDlg();}}
document.addEventListener('pointerup',dialEnd);
document.addEventListener('pointercancel',dialEnd);
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.target.id==='dlg-date'||e.target.id==='dlg-h'||e.target.id==='dlg-m')){e.preventDefault();A[e.target.id==='dlg-date'?'dOk':'tOk']();render();return;}if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('tb-input')){e.preventDefault();e.target.blur();return;}if(e.key!=='Escape')return;if(ui.moreMenu){ui.moreMenu=false;render();}else if(ui.tagMenu){ui.tagMenu=null;ui.tagCustom=false;render();}else if(ui.dlg){ui.dlg=null;render();}else if(ui.modal){ui.modal=null;ui.pending=null;ui.dlg=null;render();}});

navStack=[curHash()];applied=curHash();applyRoute();
if(S.me)ui.pf=loadDraft(S.me)||ui.pf;
if(!introSeen()){ui.modal={type:'intro',step:0};markIntro();}
render();
})();
</script>
